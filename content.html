<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contenidos — TOXI Media</title>
    <meta property="og:title" content="Contenidos — TOXI Media" />
    <meta property="og:description" content="Todo el catálogo de TOXI Media en un solo lugar." />
    <meta property="og:image" content="https://toxi.media/toxi-media-og.jpg" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f0f;
            --surface: #181818;
            --border: #303030;
            --text: #f1f1f1;
            --muted: #aaaaaa;
            --muted-dim: #717171;
            --accent: #fff;
        }

        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100dvh;
        }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .logo-link { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .logo-link img { height: 20px; }

        .search-wrap {
            flex: 1;
            min-width: 0;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
        }
        #search {
            flex: 1;
            min-width: 0;
            background: #121212;
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 20px 0 0 20px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        #search:focus { border-color: #3ea6ff; }
        .search-btn {
            width: 44px;
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 20px 20px 0;
            background: #222;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Filtros (chips) ── */
        #chips {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            overflow-x: auto;
            scrollbar-width: none;
            position: sticky;
            top: 49px;
            z-index: 25;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        #chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }
        .chip:hover { background: #2a2a2a; }
        .chip.active { background: var(--accent); color: #0f0f0f; }

        /* ── Grid ── */
        #popular-section, #engaging-section, #least-section { padding: 24px 24px 0; }
        .section-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
        .section-heading h2 { font-size: 1.15rem; font-weight: 600; }
        .section-heading span { color: var(--muted); font-size: 0.8rem; }
        #popular-grid, #engaging-grid, #least-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px 16px;
        }
        #grid-view { padding: 24px; }
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px 16px;
        }
        .card { cursor: pointer; }
        .thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #202020;
        }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
        .card:hover .thumb-wrap img { transform: scale(1.02); }
        .duration-badge {
            position: absolute;
            right: 6px; bottom: 6px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 1px 5px;
            border-radius: 4px;
        }
        .card-meta { display: flex; gap: 10px; margin-top: 10px; }
        .card-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #222 url('/toxi-app-logo.jpg') center/cover;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-sub { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
        .card-sub span:not(:last-child)::after { content: '•'; margin: 0 4px; }

        #empty { display: none; color: var(--muted); text-align: center; padding: 60px 0; }

        /* ── Watch view ── */
        #watch-view { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
        .watch-layout { display: flex; gap: 24px; align-items: flex-start; }
        .watch-main { flex: 1; min-width: 0; }
        #player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        mux-player { width: 100%; height: 100%; --media-object-fit: contain; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            background: none;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 14px;
            padding: 6px 0;
        }
        .back-btn:hover { color: var(--text); }
        #watch-title { font-size: 1.25rem; font-weight: 600; margin-top: 16px; }
        #watch-sub { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

        .watch-side { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
        .side-card { display: flex; gap: 8px; cursor: pointer; }
        .side-thumb { position: relative; width: 168px; flex-shrink: 0; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #202020; }
        .side-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .side-thumb .duration-badge { font-size: 0.66rem; }
        .side-info { min-width: 0; }
        .side-title { font-size: 0.86rem; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .side-sub { color: var(--muted); font-size: 0.76rem; margin-top: 4px; }

        @media (max-width: 980px) {
            .watch-layout { flex-direction: column; }
            .watch-main { width: 100%; }
            .watch-side { width: 100%; flex-direction: column; }
        }
        @media (max-width: 640px) {
            header { gap: 10px; padding: 8px 14px; }
            #popular-section, #engaging-section, #least-section { padding: 18px 14px 0; }
            #grid-view, #watch-view { padding: 14px; }
            #grid { grid-template-columns: 1fr 1fr; gap: 18px 10px; }
            #popular-grid, #engaging-grid, #least-grid { grid-template-columns: 1fr 1fr; gap: 18px 10px; }
        }

        /* ── Créditos ── */
        .credits-pill {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
        }
        .credits-pill:hover { background: #2a2a2a; }
        .credits-pill.low { border-color: #f5a524; }
        .credits-pill.empty { border-color: #ff4e45; color: #ff8a84; }
        .credits-pill-time { color: var(--muted); font-variant-numeric: tabular-nums; }

        #paywall {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(6px);
        }
        #paywall[hidden] { display: none; }

        .buy-card { width: 100%; max-width: 520px; margin: auto; text-align: center; }
        .buy-card h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .buy-card p { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
        .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
        .pack-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 14px 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            cursor: pointer;
        }
        .pack-btn:hover:not(:disabled) { border-color: #3ea6ff; background: #1f1f1f; }
        .pack-btn:disabled { opacity: 0.6; cursor: wait; }
        .pack-credits { font-size: 1.4rem; font-weight: 700; }
        .pack-label { color: var(--muted); font-size: 0.74rem; }
        .pack-price { margin-top: 6px; color: #3ea6ff; font-size: 0.92rem; font-weight: 600; }
        .buy-error { min-height: 1.2em; margin-top: 10px; color: #ff6b6b; font-size: 0.82rem; }
        .buy-note { margin-top: 4px; color: var(--muted-dim) !important; font-size: 0.74rem !important; }

        #buy-dialog {
            width: min(560px, calc(100% - 28px));
            margin: auto;
            padding: 24px 20px 18px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #141414;
            color: var(--text);
        }
        #buy-dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
        .dialog-close {
            display: block;
            margin: 6px auto 0;
            padding: 6px 14px;
            border: none;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .dialog-close:hover { color: var(--text); }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 100;
            max-width: calc(100% - 32px);
            padding: 10px 16px;
            border-radius: 8px;
            background: #f1f1f1;
            color: #0f0f0f;
            font-size: 0.88rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            transform: translateX(-50%);
        }
        #toast[hidden] { display: none; }

        @media (max-width: 640px) {
            .credits-pill { padding: 6px 10px; }
            .credits-pill-label { display: none; }
            #player-box.blocked { aspect-ratio: auto; min-height: 330px; }
            #paywall { padding: 14px; }
            .packs { gap: 6px; }
            .pack-btn { padding: 10px 4px; }
            .pack-credits { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <header>
        <a class="logo-link" href="/"><img src="/toxi-logo-white.png" alt="TOXI Media" /></a>
        <div class="search-wrap">
            <input id="search" type="text" placeholder="Buscar contenido…" autocomplete="off" />
            <div class="search-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
        </div>
        <button class="credits-pill" id="credits-pill" type="button" aria-haspopup="dialog">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
            <span><span id="credits-count">10</span><span class="credits-pill-label"> créditos</span></span>
            <span class="credits-pill-time" id="credits-time"></span>
        </button>
    </header>

    <div id="chips"></div>

    <section id="popular-section" aria-labelledby="popular-title" hidden>
        <div class="section-heading">
            <h2 id="popular-title">Más vistos</h2>
            <span>Últimos 30 días</span>
        </div>
        <div id="popular-grid"></div>
    </section>
    <section id="engaging-section" aria-labelledby="engaging-title" hidden>
        <div class="section-heading">
            <h2 id="engaging-title">Más atrapantes</h2>
            <span>Mayor porcentaje promedio visto</span>
        </div>
        <div id="engaging-grid"></div>
    </section>
    <section id="least-section" aria-labelledby="least-title" hidden>
        <div class="section-heading">
            <h2 id="least-title">Menos vistos</h2>
            <span>Últimos 30 días</span>
        </div>
        <div id="least-grid"></div>
    </section>

    <div id="grid-view">
        <div id="grid"></div>
        <div id="empty">No se encontraron resultados.</div>
    </div>

    <div id="watch-view">
        <div class="watch-layout">
            <div class="watch-main">
                <button class="back-btn" id="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Volver
                </button>
                <div id="player-box">
                    <mux-player id="player" stream-type="on-demand" autoplay preload="auto" default-hidden-captions></mux-player>
                    <div id="paywall" hidden></div>
                </div>
                <h1 id="watch-title"></h1>
                <div id="watch-sub"></div>
            </div>
            <div class="watch-side" id="watch-side"></div>
        </div>
    </div>

    <dialog id="buy-dialog"></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./src/analytics.js"></script>
    <script type="module">
        import { CONTENT } from './src/content.js';
        import { createWallet } from './src/credits.js';
        import { CREDIT_PACKS, DAILY_FREE_CREDITS, SECONDS_PER_CREDIT } from './src/credits-config.mjs';

        const videos = CONTENT.filter(v => v.title && v.id);

        const TYPE_LABEL = {
            film: 'Película', short: 'Corto', series: 'Serie',
            live: 'En vivo', event: 'Evento', other: 'Video',
        };

        function thumbUrl(video) {
            return `https://image.mux.com/${video.id}/thumbnail.jpg?width=640&height=360&fit_mode=smartcrop&time=${video.thumbnailTime}`;
        }

        function formatDuration(sec) {
            sec = Math.round(sec || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            const pad = n => String(n).padStart(2, '0');
            return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
        }

        function metaLine(video) {
            const parts = [];
            if (video.year) parts.push(video.year);
            parts.push(TYPE_LABEL[video.type] || 'Video');
            return parts.join(' • ');
        }

        // ── Chips de colecciones ──
        const collectionCounts = {};
        videos.forEach(v => (v.collections || []).forEach(c => {
            collectionCounts[c] = (collectionCounts[c] || 0) + 1;
        }));
        const topCollections = Object.entries(collectionCounts)
            .filter(([c]) => !['tv', 'radio'].includes(c))
            .sort((a, b) => b[1] - a[1])
            .slice(0, 14)
            .map(([c]) => c);

        const chipsEl = document.getElementById('chips');
        let activeChip = 'todos';
        function renderChips() {
            chipsEl.innerHTML = '';
            const all = document.createElement('div');
            all.className = 'chip' + (activeChip === 'todos' ? ' active' : '');
            all.textContent = 'Todos';
            all.onclick = () => { activeChip = 'todos'; renderChips(); renderGrid(); };
            chipsEl.appendChild(all);
            topCollections.forEach(c => {
                const chip = document.createElement('div');
                chip.className = 'chip' + (activeChip === c ? ' active' : '');
                chip.textContent = c;
                chip.onclick = () => { activeChip = c; renderChips(); renderGrid(); };
                chipsEl.appendChild(chip);
            });
        }

        // ── Grid ──
        const gridEl = document.getElementById('grid');
        const leaderboardSections = [
            { section: document.getElementById('popular-section'), grid: document.getElementById('popular-grid') },
            { section: document.getElementById('engaging-section'), grid: document.getElementById('engaging-grid') },
            { section: document.getElementById('least-section'), grid: document.getElementById('least-grid') },
        ];
        const emptyEl = document.getElementById('empty');
        const searchEl = document.getElementById('search');

        function setLeaderboardsVisible(visible) {
            leaderboardSections.forEach(({ section, grid }) => {
                section.hidden = !visible || !grid.childElementCount;
            });
        }

        function makeCard(video, thumbClass, titleClass, subClass, detail = '') {
            const wrap = document.createElement('div');
            wrap.className = 'card';
            wrap.innerHTML = `
                <div class="${thumbClass}">
                    <img loading="lazy" src="${thumbUrl(video)}" alt="${video.title}" />
                    <span class="duration-badge">${formatDuration(video.duration)}</span>
                </div>
                <div class="${titleClass === 'card-title' ? 'card-meta' : 'side-info'}">
                    ${titleClass === 'card-title' ? '<div class="card-avatar"></div>' : ''}
                    <div>
                        <div class="${titleClass}">${video.title}</div>
                        <div class="${subClass}">${metaLine(video)}</div>
                        ${detail ? `<div class="${subClass}">${detail}</div>` : ''}
                    </div>
                </div>
            `;
            wrap.onclick = () => openWatch(video);
            return wrap;
        }

        function renderGrid() {
            const q = searchEl.value.trim().toLowerCase();
            setLeaderboardsVisible(!q && activeChip === 'todos');
            const filtered = videos.filter(v => {
                const matchesQuery = !q || v.title.toLowerCase().includes(q);
                const matchesChip = activeChip === 'todos' || (v.collections || []).includes(activeChip);
                return matchesQuery && matchesChip;
            });
            gridEl.innerHTML = '';
            filtered.forEach(v => gridEl.appendChild(makeCard(v, 'thumb-wrap', 'card-title', 'card-sub')));
            emptyEl.style.display = filtered.length ? 'none' : 'block';
        }

        async function renderLeaderboards() {
            try {
                const response = await fetch('/api/most-viewed');
                if (!response.ok) throw new Error(`Mux API returned ${response.status}`);
                const ranking = await response.json();
                const metricsById = new Map(ranking.map(item => [item.playbackId, item]));
                const measuredVideos = videos.map(video => {
                    const metrics = metricsById.get(video.id);
                    const views = metrics?.views || 0;
                    const averageWatchedPercent = views && video.duration
                        ? Math.min(100, (metrics.totalPlayingTime / 1000 / views / video.duration) * 100)
                        : null;
                    return { video, views, averageWatchedPercent };
                });

                const [popular, engaging, least] = leaderboardSections;
                measuredVideos
                    .filter(item => item.views > 0)
                    .sort((a, b) => b.views - a.views)
                    .slice(0, 6)
                    .forEach(item => popular.grid.appendChild(makeCard(item.video, 'thumb-wrap', 'card-title', 'card-sub')));

                measuredVideos
                    .filter(item => item.views >= 3 && item.averageWatchedPercent !== null)
                    .sort((a, b) => b.averageWatchedPercent - a.averageWatchedPercent || b.views - a.views)
                    .slice(0, 6)
                    .forEach(item => engaging.grid.appendChild(makeCard(
                        item.video, 'thumb-wrap', 'card-title', 'card-sub',
                        `${Math.round(item.averageWatchedPercent)}% promedio visto`,
                    )));

                measuredVideos
                    .sort((a, b) => a.views - b.views || a.video.title.localeCompare(b.video.title))
                    .slice(0, 6)
                    .forEach(item => least.grid.appendChild(makeCard(
                        item.video, 'thumb-wrap', 'card-title', 'card-sub',
                        `${item.views.toLocaleString('es-AR')} ${item.views === 1 ? 'vista' : 'vistas'}`,
                    )));

                setLeaderboardsVisible(!searchEl.value.trim() && activeChip === 'todos');
            } catch (error) {
                console.warn('No se pudieron cargar las secciones de popularidad:', error);
            }
        }

        searchEl.addEventListener('input', renderGrid);

        // ── Watch view ──
        const gridView = document.getElementById('grid-view');
        const watchView = document.getElementById('watch-view');
        const player = document.getElementById('player');
        const watchTitle = document.getElementById('watch-title');
        const watchSub = document.getElementById('watch-sub');
        const watchSide = document.getElementById('watch-side');
        const backBtn = document.getElementById('back-btn');

        function openWatch(video, pushState = true) {
            currentVideo = video;
            if (wallet.getBalance().canWatch) hidePaywall(); else showPaywall();
            player.setAttribute('playback-id', video.id);
            player.setAttribute('metadata-video-title', video.title);
            watchTitle.textContent = video.title;
            watchSub.textContent = metaLine(video);

            watchSide.innerHTML = '';
            videos.filter(v => v.id !== video.id).slice(0, 30).forEach(v => {
                const side = document.createElement('div');
                side.className = 'side-card';
                side.innerHTML = `
                    <div class="side-thumb">
                        <img loading="lazy" src="${thumbUrl(v)}" alt="${v.title}" />
                        <span class="duration-badge">${formatDuration(v.duration)}</span>
                    </div>
                    <div class="side-info">
                        <div class="side-title">${v.title}</div>
                        <div class="side-sub">${metaLine(v)}</div>
                    </div>
                `;
                side.onclick = () => openWatch(v);
                watchSide.appendChild(side);
            });

            gridView.style.display = 'none';
            watchView.style.display = 'block';
            chipsEl.style.display = 'none';
            setLeaderboardsVisible(false);
            window.scrollTo({ top: 0 });
            startMeter();
            if (pushState) history.pushState({ v: video.id }, '', `#v=${video.id}`);
        }

        function closeWatch(pushState = true) {
            stopMeter();
            currentVideo = null;
            hidePaywall();
            player.removeAttribute('playback-id');
            watchView.style.display = 'none';
            gridView.style.display = 'block';
            chipsEl.style.display = 'flex';
            setLeaderboardsVisible(!searchEl.value.trim() && activeChip === 'todos');
            if (pushState) history.pushState({}, '', location.pathname);
        }

        backBtn.addEventListener('click', () => closeWatch());
        window.addEventListener('popstate', () => {
            const id = new URLSearchParams(location.hash.slice(1)).get('v');
            const video = id && videos.find(v => v.id === id);
            if (video) openWatch(video, false); else closeWatch(false);
        });

        // ── Créditos ──
        // 1 crédito = 1 minuto de reproducción. El crédito se cobra apenas
        // arranca cada minuto; al quedarse sin saldo el video se bloquea.
        const wallet = createWallet();
        const playerBox = document.getElementById('player-box');
        const paywallEl = document.getElementById('paywall');
        const buyDialog = document.getElementById('buy-dialog');
        const creditsPill = document.getElementById('credits-pill');
        const creditsCount = document.getElementById('credits-count');
        const creditsTime = document.getElementById('credits-time');
        const toastEl = document.getElementById('toast');
        const RETURN_VIDEO_KEY = 'toxi.credits.returnVideo';
        const FINAL_PAYMENT_STATUSES = ['rejected', 'cancelled', 'refunded', 'charged_back'];
        const formatPrice = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format;
        let currentVideo = null;
        let blocked = false;

        let toastTimer = null;
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toastEl.hidden = true; }, 6000);
        }

        function creditsText(n) {
            return `${n} ${n === 1 ? 'crédito' : 'créditos'}`;
        }

        function renderBalance(balance = wallet.getBalance()) {
            creditsCount.textContent = balance.credits;
            const inMinute = balance.secondsLeft > 0;
            const secs = Math.ceil(balance.secondsLeft);
            creditsTime.textContent = inMinute ? `· ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : '';
            creditsPill.classList.toggle('empty', !balance.canWatch);
            creditsPill.classList.toggle('low', balance.canWatch && balance.credits < 3);
            creditsPill.title = `${creditsText(balance.credits)} (${balance.free} gratis de hoy, ${balance.paid} comprados)`
                + (inMinute ? ` — quedan ${secs} s del minuto en curso` : '');
            if (blocked && balance.canWatch) {
                // Se recargó el saldo (compra o día nuevo): sacamos el bloqueo y seguimos.
                hidePaywall();
                if (currentVideo) player.play?.()?.catch?.(() => {});
            }
        }

        // Tarjeta con los paquetes a la venta (se usa en el bloqueo y en el diálogo).
        function buildBuyCard(title, text, withClose = false) {
            const card = document.createElement('div');
            card.className = 'buy-card';
            card.innerHTML = `
                <h2></h2>
                <p class="buy-text"></p>
                <div class="packs">
                    ${CREDIT_PACKS.map(pack => `
                        <button class="pack-btn" type="button" data-pack="${pack.id}">
                            <span class="pack-credits">${pack.credits}</span>
                            <span class="pack-label">créditos · ${pack.credits} min</span>
                            <span class="pack-price">${formatPrice(pack.price)}</span>
                        </button>`).join('')}
                </div>
                <p class="buy-error" role="alert"></p>
                <p class="buy-note">Pagás con Mercado Pago. Los créditos comprados no vencen.</p>
                ${withClose ? '<button class="dialog-close" type="button">Cerrar</button>' : ''}
            `;
            card.querySelector('h2').textContent = title;
            card.querySelector('.buy-text').textContent = text;
            card.querySelectorAll('.pack-btn').forEach(btn => {
                btn.onclick = () => buyPack(btn.dataset.pack, card);
            });
            card.querySelector('.dialog-close')?.addEventListener('click', () => buyDialog.close());
            return card;
        }

        async function buyPack(packId, card) {
            const buttons = card.querySelectorAll('.pack-btn');
            const errorEl = card.querySelector('.buy-error');
            buttons.forEach(b => { b.disabled = true; });
            errorEl.textContent = '';
            try {
                const response = await fetch('/api/create-preference', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ purpose: 'creditos', pack: packId, returnPath: location.pathname }),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.initPoint) throw new Error(data.error || 'No se pudo iniciar el pago');
                // Al volver de Mercado Pago reabrimos el video que estaba mirando.
                if (currentVideo) sessionStorage.setItem(RETURN_VIDEO_KEY, currentVideo.id);
                else sessionStorage.removeItem(RETURN_VIDEO_KEY);
                location.href = data.initPoint;
            } catch (error) {
                console.error('[TOXI][CREDITOS] error iniciando pago', error);
                errorEl.textContent = `${error.message}. Probá de nuevo en un momento.`;
                buttons.forEach(b => { b.disabled = false; });
            }
        }

        function showPaywall() {
            blocked = true;
            player.pause?.();
            if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
            paywallEl.replaceChildren(buildBuyCard(
                'Se terminaron tus créditos',
                `Cada crédito es 1 minuto de reproducción. Mañana vas a tener ${DAILY_FREE_CREDITS} créditos gratis otra vez, o podés comprar más ahora y seguir mirando.`,
            ));
            paywallEl.hidden = false;
            playerBox.classList.add('blocked');
        }

        function hidePaywall() {
            blocked = false;
            paywallEl.hidden = true;
            paywallEl.replaceChildren();
            playerBox.classList.remove('blocked');
        }

        creditsPill.addEventListener('click', () => {
            const { credits, free, paid } = wallet.getBalance();
            buyDialog.replaceChildren(buildBuyCard(
                `Tenés ${creditsText(credits)}`,
                `${free} gratis de hoy y ${paid} comprados. Cada crédito es 1 minuto de reproducción y todos los días recibís ${DAILY_FREE_CREDITS} gratis.`,
                true,
            ));
            buyDialog.showModal();
        });
        buyDialog.addEventListener('click', event => {
            if (event.target === buyDialog) buyDialog.close(); // click en el fondo
        });

        // Medidor de reproducción: solo cuenta tiempo mientras el video avanza
        // de verdad (no en pausa, cargando ni con la computadora suspendida).
        const meter = { timer: null, lastWall: 0, lastMediaTime: 0 };

        function startMeter() {
            if (meter.timer) return;
            meter.lastWall = performance.now();
            meter.lastMediaTime = player.currentTime || 0;
            meter.timer = setInterval(tickMeter, 250);
        }

        function stopMeter() {
            clearInterval(meter.timer);
            meter.timer = null;
        }

        function tickMeter() {
            const now = performance.now();
            const wallDelta = (now - meter.lastWall) / 1000;
            const mediaTime = player.currentTime || 0;
            const mediaDelta = Math.abs(mediaTime - meter.lastMediaTime) / (player.playbackRate || 1);
            meter.lastWall = now;
            meter.lastMediaTime = mediaTime;
            if (blocked || player.paused || player.ended || mediaDelta === 0) return;
            // Si el temporizador se demoró (pestaña en segundo plano) usamos lo que
            // avanzó el video; si se saltó hacia adelante, el tiempo real.
            const watched = Math.min(wallDelta, mediaDelta + 1);
            if (!wallet.consume(watched)) showPaywall();
        }

        // El crédito del primer minuto se cobra en cuanto arranca la reproducción.
        player.addEventListener('play', () => {
            if (blocked || !wallet.getBalance().canWatch) showPaywall();
        });
        player.addEventListener('playing', () => {
            if (!currentVideo) return;
            if (!wallet.consume(0)) showPaywall();
        });

        wallet.subscribe(renderBalance);
        window.addEventListener('storage', event => wallet.handleStorageEvent(event));
        // Refresca el saldo cada tanto para detectar el cambio de día (créditos gratis nuevos).
        setInterval(() => renderBalance(), 30000);

        // Consulta un pago de créditos y, si está aprobado, suma los créditos (una sola vez).
        async function confirmCreditsPayment(paymentId, announce) {
            try {
                const response = await fetch('/api/create-preference', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ purpose: 'creditos-confirmar', paymentId }),
                });
                const data = await response.json().catch(() => ({}));
                if (response.status === 400 || response.status === 404) {
                    wallet.removePendingPayment(paymentId);
                    if (announce) showToast(data.error || 'No pudimos validar el pago.');
                    return;
                }
                if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);

                if (data.status === 'approved' && data.credits > 0) {
                    if (wallet.addPurchasedCredits(paymentId, data.credits)) {
                        showToast(`¡Listo! Sumaste ${creditsText(data.credits)}.`);
                    }
                } else if (FINAL_PAYMENT_STATUSES.includes(data.status)) {
                    wallet.removePendingPayment(paymentId);
                    if (announce) showToast('El pago fue rechazado. No se sumaron créditos.');
                } else if (announce) {
                    showToast('Tu pago está pendiente. Vamos a sumar los créditos apenas se apruebe.');
                }
            } catch (error) {
                console.warn('[TOXI][CREDITOS] no se pudo confirmar el pago', paymentId, error);
                if (announce) showToast('No pudimos confirmar el pago ahora. Lo volvemos a intentar la próxima vez que entres.');
            }
        }

        // Vuelta desde Mercado Pago: ?creditos=ok|error|pendiente&payment_id=...&status=...
        async function handlePaymentReturn() {
            const params = new URLSearchParams(location.search);
            if (!params.has('creditos')) return;
            const paymentId = params.get('payment_id') || params.get('collection_id');
            history.replaceState(history.state, '', location.pathname + location.hash);

            if (!paymentId || paymentId === 'null') {
                showToast('El pago no se completó. No se sumaron créditos.');
                return;
            }
            if (wallet.isRedeemed(paymentId)) return;
            wallet.addPendingPayment(paymentId);
            await confirmCreditsPayment(paymentId, true);
        }

        async function checkPendingPayments() {
            for (const paymentId of wallet.getPendingPayments()) {
                await confirmCreditsPayment(paymentId, false);
            }
        }

        // ── Init ──
        renderChips();
        renderGrid();
        renderLeaderboards();
        renderBalance();
        const returnVideoId = sessionStorage.getItem(RETURN_VIDEO_KEY);
        sessionStorage.removeItem(RETURN_VIDEO_KEY);
        const initialId = new URLSearchParams(location.hash.slice(1)).get('v') || returnVideoId;
        const initialVideo = initialId && videos.find(v => v.id === initialId);
        if (initialVideo) {
            openWatch(initialVideo, false);
            if (!location.hash) history.replaceState({ v: initialVideo.id }, '', `#v=${initialVideo.id}`);
        }
        handlePaymentReturn().finally(checkPendingPayments);
    </script>
</body>
</html>
