<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOXI VR</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            position: relative;
        }
        .hidden { display: none !important; }
        /* Capa oscura superpuesta para que resalte más el video y el menú sobre el fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 1;
        }
        .bg-video-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 1.2s ease;
        }
        .bg-video-container.faded-out {
            opacity: 0;
        }
        .bg-video-container mux-player {
            width: 100%;
            height: 100%;
            display: block;
            --media-object-fit: cover;
            object-fit: cover;
            --media-background-color: transparent;
            --controls: none;
            filter: blur(0.2rem);
        }
        .stage {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease;
        }
        .stage.stage-hidden {
            opacity: 0;
            pointer-events: none;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            --media-background-color: transparent;
            --controls: none;
            transition: opacity 0.4s ease;
        }
        .stage.player-error mux-player {
            opacity: 0;
            pointer-events: none;
        }

        /* Pantalla de bienvenida: título y las dos opciones */
        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            transition: opacity 1s ease;
        }
        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .intro-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-size: 2.2rem;
            margin: 0 0 50px 0;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
            font-weight: bold;
        }
        .intro-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .pricing {
            display: flex;
            gap: 28px;
            margin-top: 44px;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .pricing-item {
            min-width: 190px;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .pricing-name {
            display: block;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            line-height: 1.35;
            text-transform: uppercase;
        }
        .pricing-duration {
            display: block;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.76rem;
        }
        .pricing-value {
            display: block;
            margin-top: 9px;
            font-size: 0.92rem;
            font-weight: bold;
            line-height: 1.4;
        }
        .course-link {
            display: inline-block;
            margin-top: 30px;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-decoration: underline;
            text-underline-offset: 5px;
            text-transform: uppercase;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        .course-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        .story-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.15em;
            padding: 18px 44px;
            border-radius: 0px;
            cursor: pointer;
            min-width: 360px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.3s ease, transform 0.2s ease, color 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }
        .story-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        /* Barra de controles inferior durante la reproducción */
        .controls-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 24px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffffff;
            border-radius: 0px;
            padding: 12px 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.4s ease, visibility 0.4s ease;
            opacity: 1;
            visibility: visible;
        }
        .controls-bar.faded-out:not(:hover) {
            opacity: 0;
            visibility: hidden;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .controls-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.35);
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 0px;
            transition: background 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }
        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .ctrl-btn svg[fill="none"] {
            fill: none;
        }
        .ctrl-btn svg[fill="none"] text {
            fill: currentColor;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            border-radius: 0px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 0px;
            background: #ffffff;
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 0px;
            background: #ffffff;
            border: none;
            cursor: pointer;
        }

        /* Responsive optimization */
        @media (max-width: 768px) {
            .intro-title {
                font-size: 1.5rem;
                margin-bottom: 35px;
            }
            .story-btn {
                min-width: 280px;
                font-size: 1rem;
                padding: 14px 28px;
            }
            .pricing {
                width: 100%;
                flex-direction: column;
                gap: 8px;
                margin-top: 28px;
            }
            .pricing-item {
                min-width: 0;
                padding: 8px 14px;
            }
            .pricing-name,
            .pricing-duration,
            .pricing-value {
                display: inline;
            }
            .pricing-duration::before {
                content: ' | ';
            }
            .pricing-value::before {
                content: ' - ';
            }
            .course-link {
                margin-top: 22px;
                font-size: 0.8rem;
            }
            .controls-bar {
                bottom: 16px;
                gap: 12px;
                padding: 8px 16px;
            }
            .volume-slider {
                width: 60px;
            }
            .ctrl-btn {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Fondo de video en loop, blur y cover, decorando el menú -->
    <div class="bg-video-container">
        <mux-player
            id="bg-player"
            playback-id="lMXKqJZceO4ZN1acWwwBSJH38xGDPcRrJAwH9gns56U"
            stream-type="on-demand"
            autoplay
            muted
            loop
            playsinline
        ></mux-player>
    </div>

    <div class="stage stage-hidden">
        <mux-player
            id="player"
            stream-type="on-demand"
            playsinline
        ></mux-player>
    </div>

    <!-- Pantalla de bienvenida: título y las dos opciones -->
    <div class="intro-overlay" id="intro-overlay">
        <h1 class="intro-title">TOXI VR</h1>
        <div class="intro-buttons">
            <button id="btn-reel" class="story-btn">VER EL REEL</button>
            <button id="btn-trailer" class="story-btn">VER EL TRAILER DE JUEGO DE DRONES</button>
        </div>
        <section class="pricing" aria-label="Precios">
            <div class="pricing-item">
                <span class="pricing-name">Demostración</span>
                <span class="pricing-duration">2 hs</span>
                <span class="pricing-value">Gratis</span>
            </div>
            <div class="pricing-item">
                <span class="pricing-name">Workshop Técnico</span>
                <span class="pricing-duration">4 hs</span>
                <span class="pricing-value">$300 USD | $450.000 ARS</span>
            </div>
            <div class="pricing-item">
                <span class="pricing-name">Diseño de Entorno VR a Medida</span>
                <span class="pricing-value">$3.000 USD | $4.500.000 ARS</span>
            </div>
        </section>
        <a class="course-link" href="university/diseno-entornos-virtuales.html">Conocé el curso de Diseño de Entornos Virtuales</a>
    </div>

    <!-- Barra de controles durante la reproducción -->
    <div class="controls-bar hidden" id="controls-bar">
        <div class="controls-group">
            <button id="btn-playpause" class="ctrl-btn" title="Pausar / reproducir">
                <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                <svg id="icon-play" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button id="btn-skip-back" class="ctrl-btn" title="Retroceder 10 segundos">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12a8 8 0 1 0 3-6.3"/>
                    <polyline points="4 4 4 8 8 8"/>
                    <text x="12.5" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-weight="bold">10</text>
                </svg>
            </button>
            <button id="btn-skip-forward" class="ctrl-btn" title="Adelantar 10 segundos">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12a8 8 0 1 1 -3-6.3"/>
                    <polyline points="20 4 20 8 16 8"/>
                    <text x="11.5" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-weight="bold">10</text>
                </svg>
            </button>
            <button id="btn-menu" class="ctrl-btn" title="Volver al menú">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
        </div>
        <div class="controls-divider"></div>
        <div class="controls-group">
            <button id="btn-mute" class="ctrl-btn" title="Silenciar / activar audio">
                <svg id="icon-speaker-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-speaker-off" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4zm7.5 8c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z"/></svg>
            </button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const bgPlayer = document.getElementById('bg-player');
        const stageEl = document.querySelector('.stage');
        const bgVideoContainer = document.querySelector('.bg-video-container');
        const introOverlay = document.getElementById('intro-overlay');
        const btnReel = document.getElementById('btn-reel');
        const btnTrailer = document.getElementById('btn-trailer');

        const controlsBar = document.getElementById('controls-bar');
        const btnPlayPause = document.getElementById('btn-playpause');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnSkipBack = document.getElementById('btn-skip-back');
        const btnSkipForward = document.getElementById('btn-skip-forward');
        const btnMenu = document.getElementById('btn-menu');
        const btnMute = document.getElementById('btn-mute');
        const iconSpeakerOn = document.getElementById('icon-speaker-on');
        const iconSpeakerOff = document.getElementById('icon-speaker-off');
        const volumeSlider = document.getElementById('volume-slider');

        let hideControlsTimeout = null;

        function startControlsTimeout() {
            clearControlsTimeout();
            hideControlsTimeout = setTimeout(() => {
                const isPlaying = !player.paused;
                // Sólo ocultar si está reproduciendo el video principal y la barra es visible
                if (isPlaying && !controlsBar.classList.contains('hidden')) {
                    controlsBar.classList.add('faded-out');
                }
            }, 3000);
        }

        function clearControlsTimeout() {
            if (hideControlsTimeout) {
                clearTimeout(hideControlsTimeout);
                hideControlsTimeout = null;
            }
        }

        // Mostrar controles e iniciar timeout en cualquier interacción o movimiento del mouse sobre el body o el player
        function showControls() {
            controlsBar.classList.remove('faded-out');
            startControlsTimeout();
        }

        document.body.addEventListener('mousemove', showControls);
        document.body.addEventListener('touchstart', showControls);
        document.body.addEventListener('click', showControls);

        // Al hacer hover físico sobre la barra de controles, se cancela/limpia el temporizador para que no se oculte mientras interactuás con sus botones
        controlsBar.addEventListener('mouseenter', clearControlsTimeout);
        controlsBar.addEventListener('mouseleave', startControlsTimeout);

        const VIDEOS = {
            reel: { playbackId: 'gpyaD02TP7ooRgAxf868u0001IENHX7YPLul2ynnSchMmE', label: 'Reel' },
            trailer: { playbackId: '95Udf3e8O6tFwt7G7H5GQyvvEJ6K4iP00O4AhWOMd7mc', label: 'Trailer de Juego de Drones' },
        };

        function updatePlayPauseIcon() {
            const isPaused = player.paused;
            iconPlay.classList.toggle('hidden', !isPaused);
            iconPause.classList.toggle('hidden', isPaused);
        }

        function updateSpeakerIcon() {
            iconSpeakerOn.classList.toggle('hidden', player.muted);
            iconSpeakerOff.classList.toggle('hidden', !player.muted);
        }

        function playVideo(key) {
            const video = VIDEOS[key];
            if (!video) return;

            stageEl.classList.remove('player-error');
            player.setAttribute('playback-id', video.playbackId);
            player.muted = false;
            player.volume = parseFloat(volumeSlider.value);
            player.autoplay = true; // Activa la reproducción automática en el elemento

            stageEl.classList.remove('stage-hidden');
            bgVideoContainer.classList.add('faded-out');
            try {
                if (bgPlayer) bgPlayer.pause();
            } catch (e) {}

            try {
                const p = player.play();
                if (p && typeof p.then === 'function') {
                    p.catch(() => {
                        // En caso de que el navegador bloquee el autoplay por falta de interacción previa (aunque ya hubo clic), intentamos forzarlo
                        player.play().catch(() => {});
                    });
                }
            } catch (e) {}

            introOverlay.classList.add('fade-out');
            controlsBar.classList.remove('hidden');
            controlsBar.classList.remove('faded-out');
            updatePlayPauseIcon();
            updateSpeakerIcon();
            startControlsTimeout();
        }

        function backToMenu() {
            clearControlsTimeout();
            player.pause();
            stageEl.classList.add('stage-hidden');
            bgVideoContainer.classList.remove('faded-out');
            introOverlay.classList.remove('fade-out');
            controlsBar.classList.add('hidden');
            controlsBar.classList.remove('faded-out');
            try {
                if (bgPlayer) {
                    const p = bgPlayer.play();
                    if (p && typeof p.then === 'function') p.catch(() => {});
                }
            } catch (e) {}
        }

        btnReel.addEventListener('click', () => playVideo('reel'));
        btnTrailer.addEventListener('click', () => playVideo('trailer'));
        btnMenu.addEventListener('click', backToMenu);

        btnPlayPause.addEventListener('click', () => {
            if (player.paused) {
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } else {
                player.pause();
            }
            updatePlayPauseIcon();
        });

        btnSkipBack.addEventListener('click', () => {
            try {
                player.currentTime = Math.max(0, player.currentTime - 10);
            } catch (e) {}
        });

        btnSkipForward.addEventListener('click', () => {
            try {
                const duration = isFinite(player.duration) ? player.duration : Infinity;
                player.currentTime = Math.min(duration, player.currentTime + 10);
            } catch (e) {}
        });

        btnMute.addEventListener('click', () => {
            player.muted = !player.muted;
            updateSpeakerIcon();
        });

        volumeSlider.addEventListener('input', () => {
            const v = parseFloat(volumeSlider.value);
            player.volume = v;
            if (v > 0 && player.muted) {
                player.muted = false;
            }
            updateSpeakerIcon();
        });

        player.addEventListener('error', () => {
            console.warn('[VR] El video principal no pudo cargarse.');
            stageEl.classList.add('player-error');
        });

        player.addEventListener('ended', () => {
            updatePlayPauseIcon();
        });

        if (bgPlayer) {
            bgPlayer.addEventListener('ended', () => {
                try {
                    bgPlayer.currentTime = 0;
                    bgPlayer.play().catch(() => {});
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
