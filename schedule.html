<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grilla Semanal — TOXI</title>
  <style>
    :root {
      --bg:     #080808;
      --bg2:    #111111;
      --bg3:    #1a1a1a;
      --border: #252525;
      --text:   #d8d8d8;
      --muted:  #555;
      --accent: #ffffff;
      --red:    #f87171;
      --green:  #4ade80;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Now', Helvetica, Arial, sans-serif;
      font-size: 12px;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── SIDEBAR ────────────────────────────────────────────────────────── */
    #sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-head h1 {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #search {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
    }
    #search:focus { border-color: #444; }

    #library {
      flex: 1;
      overflow-y: auto;
    }

    .lib-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      cursor: grab;
      border-bottom: 1px solid var(--border);
      user-select: none;
      transition: background .1s;
    }
    .lib-item:hover   { background: var(--bg3); }
    .lib-item:active  { cursor: grabbing; }
    .lib-item.dragging { opacity: .35; }

    .lib-thumb {
      width: 56px;
      height: 32px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg3);
    }

    .lib-info   { flex: 1; min-width: 0; }

    .lib-title {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 2px;
    }

    .lib-dur {
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── GRID AREA ──────────────────────────────────────────────────────── */
    #grid-outer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .week-nav { display: flex; align-items: center; gap: 6px; }

    .week-nav button {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 15px;
      width: 26px;
      height: 26px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .week-nav button:hover { border-color: #444; }

    #week-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      min-width: 150px;
      text-align: center;
    }

    .spacer { flex: 1; }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 6px 11px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-ghost:hover { border-color: #555; }

    /* ── GRID HEADER (sticky) ──────────────────────────────────────────── */
    #grid-wrap {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    #grid-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      background: var(--bg2);
      border-bottom: 2px solid var(--border);
    }

    .gh-gutter {
      width: 52px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .gh-day {
      flex: 1;
      min-width: 110px;
      padding: 8px 6px 6px;
      border-right: 1px solid var(--border);
      text-align: center;
    }

    .gh-day-name {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .gh-day-date {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .gh-day.today .gh-day-date {
      background: var(--accent);
      color: var(--bg);
    }

    .gh-day-total {
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
      height: 13px;
      font-variant-numeric: tabular-nums;
    }

    /* ── GRID BODY ─────────────────────────────────────────────────────── */
    #grid-body { display: flex; }

    #time-axis {
      width: 52px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      position: relative;
    }

    .time-label {
      position: absolute;
      right: 7px;
      font-size: 9px;
      color: var(--muted);
      transform: translateY(-50%);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }

    #days-area { flex: 1; display: flex; }

    .day-col {
      flex: 1;
      min-width: 110px;
      position: relative;
      border-right: 1px solid var(--border);
    }
    .day-col.drag-over { background: rgba(255,255,255,.025); }

    /* Grid lines */
    .hour-line {
      position: absolute;
      left: 0; right: 0;
      border-top: 1px solid var(--border);
      pointer-events: none;
    }
    .hour-line.half {
      border-top-style: dashed;
      opacity: .35;
    }

    /* Current time line */
    .now-line {
      position: absolute;
      left: 0; right: 0;
      border-top: 2px solid #ef4444;
      z-index: 12;
      pointer-events: none;
    }
    .now-dot {
      position: absolute;
      left: -4px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    /* Drop indicator ghost */
    .drop-indicator {
      position: absolute;
      left: 2px; right: 2px;
      background: rgba(255,255,255,.08);
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 4px;
      pointer-events: none;
      z-index: 15;
      display: none;
    }

    /* ── SCHEDULED BLOCKS ───────────────────────────────────────────────── */
    .sched-block {
      position: absolute;
      left: 2px; right: 2px;
      border-radius: 4px;
      overflow: hidden;
      cursor: grab;
      z-index: 8;
      user-select: none;
      transition: box-shadow .1s;
    }
    .sched-block:hover        { box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
    .sched-block:active       { cursor: grabbing; }
    .sched-block.dragging-block { opacity: .4; }

    .block-inner {
      padding: 3px 18px 3px 6px;
      height: 100%;
      overflow: hidden;
      border-left: 3px solid rgba(255,255,255,.3);
    }

    .block-title {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .block-time {
      font-size: 9px;
      color: rgba(255,255,255,.45);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .block-del {
      position: absolute;
      top: 2px; right: 4px;
      font-size: 13px;
      color: rgba(255,255,255,.4);
      cursor: pointer;
      line-height: 1;
      display: none;
      z-index: 2;
    }
    .sched-block:hover .block-del { display: block; }
    .block-del:hover { color: var(--red); }

    /* Zoom control */
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .zoom-row input { accent-color: var(--accent); width: 80px; }

    /* Scrollbar */
    ::-webkit-scrollbar       { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
  </style>
</head>

      <div id="grid-body">
        <div id="time-axis"></div>
        <div id="days-area">

    </div>
  </div>

</div>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmtDur(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function fmtTime(totalMin) {
  const h = Math.floor(totalMin / 60) % 24;
  const m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function itemColor(title) {
  let hash = 5381;
  for (let i = 0; i < title.length; i++) hash = ((hash << 5) + hash) ^ title.charCodeAt(i);
  const hue = Math.abs(hash) % 360;
  return {
    bg:     `hsl(${hue}, 48%, 22%)`,
    border: `hsl(${hue}, 65%, 52%)`,
  };
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function minToPx(min) { return (min / 60) * PX_PER_HOUR; }
function pxToMin(px)  { return (px / PX_PER_HOUR) * 60;  }
function snap(min)    { return Math.round(min / SNAP_MIN) * SNAP_MIN; }

// ── WEEK HELPERS ─────────────────────────────────────────────────────────────
function getMonday(offset = 0) {
  const now  = new Date();
  const dow  = now.getDay(); // 0=Sun
  const diff = dow === 0 ? -6 : 1 - dow;
  const mon  = new Date(now);
  mon.setDate(now.getDate() + diff + offset * 7);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function getWeekDates(offset = 0) {
  const mon = getMonday(offset);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function weekKey(offset = weekOffset) {
  return getMonday(offset).toISOString().split('T')[0];
}

// ── STATE ────────────────────────────────────────────────────────────────────
let weekOffset = 0;

// schedule entries: { id, itemIdx, day (0=Mon … 6=Sun), startMin, week (YYYY-MM-DD of Monday) }
let schedule = JSON.parse(localStorage.getItem('toxi-schedule-v3') || '[]');

function saveSchedule() {
  localStorage.setItem('toxi-schedule-v3', JSON.stringify(schedule));
}

function weekSchedule() {
  const wk = weekKey();
  return schedule.filter(s => s.week === wk);
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
function buildSidebar() {
  const q   = document.getElementById('search').value.toLowerCase().trim();
  const lib = document.getElementById('library');
  const items = PLAYLIST
    .map((item, i) => ({ item, i }))
    .filter(({ item }) => !q || item.title.toLowerCase().includes(q));

  document.getElementById('lib-count').textContent = items.length;
  lib.innerHTML = '';

  items.forEach(({ item, i }) => {
    const el = document.createElement('div');
    el.className = 'lib-item';
    el.draggable = true;
    el.dataset.idx = i;

    el.innerHTML = `
      <img class="lib-thumb"
           src="https://image.mux.com/${item.id}/thumbnail.png?time=4&width=112&height=64"
           loading="lazy" alt="" onerror="this.style.opacity='.2'" />
      <div class="lib-info">
        <div class="lib-title" title="${item.title}">${item.title}</div>
        <div class="lib-dur">${fmtDur(item.duration)}</div>
      </div>`;

    el.addEventListener('dragstart', onLibDragStart);
    el.addEventListener('dragend',   () => { el.classList.remove('dragging'); currentDrag = null; });
    lib.appendChild(el);
  });
}

// ── GRID ─────────────────────────────────────────────────────────────────────
const GRID_H  = () => HOURS * PX_PER_HOUR;
const MONTHS  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DAYNAME = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

function buildGrid() {
  const dates  = getWeekDates(weekOffset);
  const today  = new Date(); today.setHours(0,0,0,0);
  const wk     = weekKey();

  // Week label
  const d0 = dates[0], d6 = dates[6];
  document.getElementById('week-label').textContent =
    `${d0.getDate()} ${MONTHS[d0.getMonth()]} — ${d6.getDate()} ${MONTHS[d6.getMonth()]} ${d6.getFullYear()}`;

  // ── Header ────────────────────────────────────────────────────────────
  const header = document.getElementById('grid-header');
  header.innerHTML = '<div class="gh-gutter"></div>';

  dates.forEach((d, i) => {
    const isToday = d.getTime() === today.getTime();
    const total   = dayTotal(i, wk);
    const gh = document.createElement('div');
    gh.className = 'gh-day' + (isToday ? ' today' : '');
    gh.innerHTML = `
      <div class="gh-day-name">${DAYNAME[i]}</div>
      <div class="gh-day-date">${d.getDate()}</div>
      <div class="gh-day-total" id="day-total-${i}">${total > 0 ? fmtDur(total) : ''}</div>`;
    header.appendChild(gh);
  });

  // ── Time axis ─────────────────────────────────────────────────────────
  const ta = document.getElementById('time-axis');
  ta.style.height = GRID_H() + 'px';
  ta.innerHTML = '';
  for (let h = 0; h <= HOURS; h++) {
    const lbl = document.createElement('div');
    lbl.className   = 'time-label';
    lbl.style.top   = minToPx(h * 60) + 'px';
    lbl.textContent = h < HOURS ? String(h).padStart(2,'0') + ':00' : '';
    ta.appendChild(lbl);
  }

  // ── Day columns ───────────────────────────────────────────────────────
  const daysArea = document.getElementById('days-area');
  daysArea.innerHTML = '';

  for (let day = 0; day < 7; day++) {
    const col = document.createElement('div');
    col.className  = 'day-col';
    col.style.height = GRID_H() + 'px';
    col.dataset.day  = day;

    // Hour + half-hour lines
    for (let h = 0; h < HOURS; h++) {
      const line = document.createElement('div');
      line.className = 'hour-line';
      line.style.top = minToPx(h * 60) + 'px';
      col.appendChild(line);

      const half = document.createElement('div');
      half.className = 'hour-line half';
      half.style.top = minToPx(h * 60 + 30) + 'px';
      col.appendChild(half);
    }
    // Final border
    const bot = document.createElement('div');
    bot.className = 'hour-line';
    bot.style.top = GRID_H() + 'px';
    col.appendChild(bot);

    // Drop indicator ghost
    const di = document.createElement('div');
    di.className = 'drop-indicator';
    di.id = `di-${day}`;
    col.appendChild(di);

    // "Now" line if today
    if (dates[day].getTime() === today.getTime()) {
      const now    = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const nl = document.createElement('div');
      nl.className = 'now-line';
      nl.style.top = minToPx(nowMin) + 'px';
      nl.innerHTML = '<div class="now-dot"></div>';
      col.appendChild(nl);
    }

    col.addEventListener('dragover',  onColDragOver);
    col.addEventListener('dragleave', onColDragLeave);
    col.addEventListener('drop',      onColDrop);
    daysArea.appendChild(col);
  }

  renderBlocks();
}

// ── RENDER SCHEDULED BLOCKS ───────────────────────────────────────────────────
function renderBlocks() {
  document.querySelectorAll('.sched-block').forEach(el => el.remove());
  const wk = weekKey();

  schedule
    .filter(s => s.week === wk)
    .forEach(entry => {
      const item = PLAYLIST[entry.itemIdx];
      if (!item) return;
      const col = document.querySelector(`.day-col[data-day="${entry.day}"]`);
      if (!col) return;

      const durMin  = item.duration / 60;
      const topPx   = minToPx(entry.startMin);
      const highPx  = Math.max(14, minToPx(durMin));
      const color   = itemColor(item.title);

      const block = document.createElement('div');
      block.className  = 'sched-block';
      block.dataset.id = entry.id;
      block.draggable  = true;
      block.style.top    = topPx + 'px';
      block.style.height = highPx + 'px';
      block.style.background = color.bg;

      const showTitle = highPx >= 20;
      const showTime  = highPx >= 32;

      block.innerHTML = `
        <div class="block-inner" style="border-left-color:${color.border}">
          ${showTitle ? `<div class="block-title">${item.title}</div>` : ''}
          ${showTime  ? `<div class="block-time">${fmtTime(entry.startMin)} — ${fmtDur(item.duration)}</div>` : ''}
        </div>
        <span class="block-del" title="Eliminar">×</span>`;

      block.querySelector('.block-del').addEventListener('click', e => {
        e.stopPropagation();
        schedule = schedule.filter(s => s.id !== entry.id);
        saveSchedule();
        renderBlocks();
        refreshTotals();
      });

      block.addEventListener('dragstart', onBlockDragStart);
      block.addEventListener('dragend',   onBlockDragEnd);
      col.appendChild(block);
    });
}

// ── TOTALS ─────────────────────────────────────────────────────────────────
function dayTotal(day, wk) {
  return schedule
    .filter(s => s.week === wk && s.day === day)
    .reduce((sum, s) => sum + (PLAYLIST[s.itemIdx]?.duration || 0), 0);
}

function refreshTotals() {
  const wk = weekKey();
  for (let i = 0; i < 7; i++) {
    const el = document.getElementById(`day-total-${i}`);
    if (el) {
      const t = dayTotal(i, wk);
      el.textContent = t > 0 ? fmtDur(t) : '';
    }
  }
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
let currentDrag   = null;  // { type:'lib'|'block', itemIdx, schedId? }
let dragOffsetMin = 0;     // grab offset within block (for block drags)

function onLibDragStart(e) {
  const idx = parseInt(e.currentTarget.dataset.idx);
  currentDrag   = { type: 'lib', itemIdx: idx };
  dragOffsetMin = 0;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', String(idx));
}

function onBlockDragStart(e) {
  const id    = e.currentTarget.dataset.id;
  const entry = schedule.find(s => s.id === id);
  if (!entry) return;
  const rect    = e.currentTarget.getBoundingClientRect();
  dragOffsetMin = snap(pxToMin(e.clientY - rect.top));
  currentDrag   = { type: 'block', itemIdx: entry.itemIdx, schedId: id };
  e.currentTarget.classList.add('dragging-block');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
}

function onBlockDragEnd(e) {
  e.currentTarget.classList.remove('dragging-block');
  document.querySelectorAll('.lib-item.dragging').forEach(el => el.classList.remove('dragging'));
  currentDrag = null;
}

function dropMinute(e, col) {
  const rect = col.getBoundingClientRect();
  const raw  = pxToMin(e.clientY - rect.top) - dragOffsetMin;
  return Math.min(Math.max(0, snap(raw)), 24 * 60 - SNAP_MIN);
}

function onColDragOver(e) {
  e.preventDefault();
  if (!currentDrag) return;
  e.dataTransfer.dropEffect = currentDrag.type === 'lib' ? 'copy' : 'move';

  const col  = e.currentTarget;
  col.classList.add('drag-over');
  const day  = parseInt(col.dataset.day);
  const item = PLAYLIST[currentDrag.itemIdx];
  if (!item) return;

  const startMin = dropMinute(e, col);
  const highPx   = Math.max(14, minToPx(item.duration / 60));
  const di = document.getElementById(`di-${day}`);
  if (di) {
    di.style.display = 'block';
    di.style.top     = minToPx(startMin) + 'px';
    di.style.height  = highPx + 'px';
  }
}

function onColDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over');
    const day = parseInt(e.currentTarget.dataset.day);
    const di  = document.getElementById(`di-${day}`);
    if (di) di.style.display = 'none';
  }
}

function onColDrop(e) {
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('drag-over');
  const day = parseInt(col.dataset.day);
  const di  = document.getElementById(`di-${day}`);
  if (di) di.style.display = 'none';
  if (!currentDrag) return;

  const startMin = dropMinute(e, col);
  const wk       = weekKey();

  if (currentDrag.type === 'lib') {
    schedule.push({ id: uid(), itemIdx: currentDrag.itemIdx, day, startMin, week: wk });
    document.querySelectorAll('.lib-item.dragging').forEach(el => el.classList.remove('dragging'));
  } else {
    const entry = schedule.find(s => s.id === currentDrag.schedId);
    if (entry) { entry.day = day; entry.startMin = startMin; entry.week = wk; }
  }

  saveSchedule();
  renderBlocks();
  refreshTotals();
  currentDrag = null;
}

// ── TOOLBAR ACTIONS ───────────────────────────────────────────────────────────
document.getElementById('prev-week').addEventListener('click', () => { weekOffset--; buildGrid(); });
document.getElementById('next-week').addEventListener('click', () => { weekOffset++; buildGrid(); });
document.getElementById('today-btn').addEventListener('click', () => { weekOffset = 0; buildGrid(); scrollToNow(); });

document.getElementById('zoom').addEventListener('input', e => {
  PX_PER_HOUR = parseInt(e.target.value);
  buildGrid();
  scrollToNow();
});

document.getElementById('search').addEventListener('input', buildSidebar);

document.getElementById('export-btn').addEventListener('click', () => {
  const dates    = getWeekDates(weekOffset);
  const wk       = weekKey();
  const exported = schedule
    .filter(s => s.week === wk)
    .map(s => {
      const item = PLAYLIST[s.itemIdx];
      const date = dates[s.day];
      return {
        title:      item.title,
        mux_id:     item.id,
        duration_s: item.duration,
        duration:   fmtDur(item.duration),
        day:        DAYNAME[s.day],
        date:       date.toISOString().split('T')[0],
        start_time: fmtTime(s.startMin),
      };
    })
    .sort((a, b) => a.date.localeCompare(b.date) || a.start_time.localeCompare(b.start_time));

  const blob = new Blob([JSON.stringify(exported, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `toxi-grilla-${wk}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  const wk = weekKey();
  const count = schedule.filter(s => s.week === wk).length;
  if (!count) return;
  if (!confirm(`¿Eliminar los ${count} bloques de esta semana?`)) return;
  schedule = schedule.filter(s => s.week !== wk);
  saveSchedule();
  buildGrid();
});

// ── SCROLL TO NOW ─────────────────────────────────────────────────────────────
function scrollToNow() {
  const now    = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const top    = Math.max(0, minToPx(nowMin) - 180);
  document.getElementById('grid-wrap').scrollTop = top;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildSidebar();
buildGrid();
setTimeout(scrollToNow, 80);
</script>
