<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERS Vlog</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            --media-object-fit: cover;
            --controls: none;
            --media-background-color: #000;
        }
        /* En pantalla completa mostrar el video entero, sin cropear */
        mux-player:fullscreen,
        mux-player:-webkit-full-screen {
            --media-object-fit: contain;
        }
        .controls {
            position: fixed;
            inset: auto 0 32px 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 16px;
            z-index: 10;
            pointer-events: none;
        }
        .controls button {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 22px;
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease, opacity 0.3s ease;
        }
        .controls button:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.75);
        }
        .controls button.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="stage">
        <mux-player
            id="player"
            playback-id="KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg"
            stream-type="on-demand"
            autoplay
            muted
            loop
            playsinline
            nohotkeys
        ></mux-player>
    </div>
    <div class="controls">
        <button id="unmute-btn" type="button" aria-label="Activar sonido">🔇 Activar sonido</button>
        <button id="fullscreen-btn" type="button" aria-label="Pantalla completa">⛶ Pantalla completa</button>
    </div>
    <script>
        const player = document.getElementById('player');
        const unmuteBtn = document.getElementById('unmute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        function activateSound() {
            try {
                player.muted = false;
                player.volume = 1;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            unmuteBtn.classList.add('hidden');
        }

        async function goFullscreen() {
            try {
                // Activar sonido también al entrar en fullscreen
                player.muted = false;
                player.volume = 1;
                unmuteBtn.classList.add('hidden');

                // iOS Safari usa el fullscreen nativo del <video>
                const videoEl = player.media && player.media.nativeEl;
                if (videoEl && typeof videoEl.webkitEnterFullscreen === 'function') {
                    try { videoEl.webkitEnterFullscreen(); return; } catch (e) {}
                }

                if (player.requestFullscreen) {
                    await player.requestFullscreen();
                } else if (player.webkitRequestFullscreen) {
                    player.webkitRequestFullscreen();
                } else if (videoEl && videoEl.webkitEnterFullscreen) {
                    videoEl.webkitEnterFullscreen();
                }
            } catch (e) {}
        }

        unmuteBtn.addEventListener('click', activateSound);
        unmuteBtn.addEventListener('touchstart', activateSound, { passive: true });
        fullscreenBtn.addEventListener('click', goFullscreen);
        fullscreenBtn.addEventListener('touchstart', (e) => { e.preventDefault(); goFullscreen(); });
    </script>
</body>
</html>
