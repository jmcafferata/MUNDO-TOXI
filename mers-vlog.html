<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MERS Vlog</title>

    <!-- Media Chrome (UI) + Mux Video (motor de reproducción HLS). -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-video@0/+esm"></script>

    <style>
        :root {
            /* Tokens de estilo de la barra */
            --bar-bg: rgba(0, 0, 0, 0.55);
            --btn-hover: rgba(255, 255, 255, 0.12);
            --btn-icon: #ffffff;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        /* --- media-chrome --- */
        media-controller {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            /* Vídeo: mostrar completo, sin cropear */
            --media-object-fit: contain;
            --media-background-color: #000;

            /* Estilo de la barra de controles */
            --media-primary-color: #fff;
            --media-secondary-color: transparent;
            --media-text-color: #fff;
            --media-icon-color: #fff;
            --media-control-hover-background: var(--btn-hover);
            --media-control-background: transparent;
            --media-control-bar-background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
            --media-control-bar-height: 64px;

            /* Iconos y textos grandes para mobile */
            --media-button-icon-width: 28px;
            --media-button-icon-height: 28px;
            --media-font-size: 15px;
            --media-text-content-height: 32px;

            /* Barra de tiempo */
            --media-range-thumb-height: 16px;
            --media-range-thumb-width: 16px;
            --media-range-track-height: 5px;
            --media-range-track-background: rgba(255, 255, 255, 0.25);
            --media-range-bar-color: #ff5ac0;
        }

        mux-video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        media-control-bar {
            padding: 8px 12px;
            gap: 4px;
        }

        /* Que la barra de tiempo ocupe todo el espacio disponible */
        media-time-range {
            flex: 1 1 auto;
            min-width: 40px;
        }

        /* Botones custom integrados en la barra de controles */
        .mc-btn {
            appearance: none;
            background: transparent;
            border: 0;
            color: var(--btn-icon);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            height: 44px;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.15s ease;
        }
        .mc-btn:hover {
            background: var(--btn-hover);
        }
        .mc-btn.hidden {
            display: none;
        }
        .mc-btn svg {
            width: 26px;
            height: 26px;
            display: block;
        }
        .mc-btn .mc-btn-label {
            margin-left: 6px;
        }

        /* Botón grande flotante para activar sonido (necesario por el autoplay muteado) */
        .unmute-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .unmute-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .unmute-overlay button {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 20px 32px;
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .unmute-overlay button:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.75);
        }

        /* Ajustes para móvil */
        @media (max-width: 640px) {
            .unmute-overlay {
                top: 12px;
            }
            .unmute-overlay button {
                font-size: 14px;
                letter-spacing: 1px;
                padding: 12px 20px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
            media-controller {
                --media-control-bar-height: 56px;
                --media-button-icon-width: 24px;
                --media-button-icon-height: 24px;
                --media-font-size: 14px;
            }
            media-control-bar {
                padding: 6px 8px 24px 8px;
                gap: 2px;
            }
            .mc-btn {
                height: 40px;
                padding: 0 8px;
                font-size: 13px;
            }
            .mc-btn svg {
                width: 22px;
                height: 22px;
            }
        }
        
        /* Ajuste extra para iOS (safe area) */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            @media (max-width: 640px) {
                media-control-bar {
                    padding-bottom: max(24px, env(safe-area-inset-bottom));
                }
            }
        }

        /* Panel lateral con la lista de episodios */
        .episode-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(360px, 85vw);
            background: rgba(15, 15, 20, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 30;
            transform: translateX(100%);
            transition: transform 0.35s ease;
            display: flex;
            flex-direction: column;
        }
        .episode-panel.open {
            transform: translateX(0);
        }
        .episode-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .episode-panel-header button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .episode-list {
            list-style: none;
            margin: 0;
            padding: 8px 0;
            overflow-y: auto;
            flex: 1;
        }
        .episode-list li {
            padding: 16px 24px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s ease;
        }
        .episode-list li:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .episode-list li.current {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }
        .episode-list .marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        .episode-list li.current .marker {
            background: #ff5ac0;
            box-shadow: 0 0 12px #ff5ac0;
        }
    </style>
</head>
<body>
    <div class="stage">
        <media-controller>
            <mux-video
                id="video"
                slot="media"
                playback-id="KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg"
                stream-type="on-demand"
                autoplay
                muted
                playsinline
                crossorigin
            ></mux-video>

            <media-control-bar>
                <media-play-button></media-play-button>
                <media-seek-backward-button seekoffset="10"></media-seek-backward-button>
                <media-seek-forward-button seekoffset="10"></media-seek-forward-button>
                <media-time-range></media-time-range>
                <media-time-display showduration remaining></media-time-display>

                <!-- BOTONES CUSTOM integrados en la barra -->
                <button id="next-btn" class="mc-btn" type="button" aria-label="Siguiente episodio" title="Siguiente episodio">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M6 5v14l11-7L6 5zm12 0h2v14h-2z"/>
                    </svg>
                    <span class="mc-btn-label">Siguiente</span>
                </button>
                <button id="list-btn" class="mc-btn" type="button" aria-label="Ver lista de episodios" title="Episodios">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
                    </svg>
                    <span class="mc-btn-label">Episodios</span>
                </button>

                <media-mute-button></media-mute-button>
                <media-volume-range></media-volume-range>
                <media-pip-button></media-pip-button>
                <media-fullscreen-button></media-fullscreen-button>
            </media-control-bar>
        </media-controller>
    </div>

    <div id="unmute-overlay" class="unmute-overlay">
        <button id="unmute-btn" type="button" aria-label="Activar sonido">🔇 Activar sonido</button>
    </div>

    <aside id="episode-panel" class="episode-panel" aria-hidden="true">
        <div class="episode-panel-header">
            <span>Episodios</span>
            <button id="close-panel" type="button" aria-label="Cerrar">✕</button>
        </div>
        <ul id="episode-list" class="episode-list"></ul>
    </aside>

    <script>
        // Auto-refresh para usuarios con versión cacheada vieja
        const VERSION = '2.2';
        const storedVersion = localStorage.getItem('mers-vlog-version');
        if (storedVersion !== VERSION) {
            localStorage.setItem('mers-vlog-version', VERSION);
            if (storedVersion !== null) {
                // Ya visitó antes con versión vieja, refrescar una vez
                location.reload(true);
            }
        }
        
        const video = document.getElementById('video');
        const unmuteOverlay = document.getElementById('unmute-overlay');
        const unmuteBtn = document.getElementById('unmute-btn');
        const nextBtn = document.getElementById('next-btn');
        const listBtn = document.getElementById('list-btn');
        const closeBtn = document.getElementById('close-panel');
        const panel = document.getElementById('episode-panel');
        const listEl = document.getElementById('episode-list');

        const EPISODES = [
            { id: 'KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg', title: 'Episodio 1' },
            { id: 'm400b5KKa9zFXdB7pzc00X6U5mekfteej8WHQbI6UR102g', title: 'Episodio 2' },
            { id: '7aA401UGod4t2zsaIWxH3KEwjMKcO1EuJF1gMvks9C4E', title: 'Episodio 3' },
            { id: '9orOWaGSufTUXAV02t1i3RVFlz41NHeZDMEUZQSUA202E', title: 'Episodio 4' },
            { id: 'VdEEcI601TJyUEz535TNYWDpWDU3I02xjdXWbW6Pozt7Y', title: 'Episodio 5' }
        ];
        let currentIndex = 0;

        function renderEpisodeList() {
            listEl.innerHTML = '';
            EPISODES.forEach((ep, idx) => {
                const li = document.createElement('li');
                li.className = idx === currentIndex ? 'current' : '';
                li.innerHTML = `<span class="marker"></span><span>${ep.title}</span>`;
                li.addEventListener('click', () => {
                    playEpisode(idx, { keepSound: !video.muted });
                    closePanel();
                });
                listEl.appendChild(li);
            });
        }

        function updateNextButton() {
            if (currentIndex >= EPISODES.length - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        function playEpisode(index, { keepSound = false, updateHash = true, startTime = null } = {}) {
            if (index < 0 || index >= EPISODES.length) return;
            currentIndex = index;
            
            // Si hay un tiempo de inicio específico, aplicarlo cuando el video esté listo
            if (startTime !== null && startTime >= 0) {
                const seekToTime = () => {
                    console.log('Seeking to', startTime);
                    video.currentTime = startTime;
                    video.removeEventListener('loadedmetadata', seekToTime);
                };
                // Limpiar listeners previos
                video.removeEventListener('loadedmetadata', seekToTime);
                video.addEventListener('loadedmetadata', seekToTime, { once: true });
            }
            
            video.setAttribute('playback-id', EPISODES[index].id);
            updateNextButton();
            renderEpisodeList();
            if (updateHash) {
                const targetHash = '#' + (index + 1);
                if (window.location.hash !== targetHash) {
                    // Cambio silencioso para no re-disparar hashchange
                    history.replaceState(null, '', targetHash);
                }
            }
            
            try {
                if (!keepSound) video.muted = false;
                const p = video.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
        }

        function goNext() {
            playEpisode(currentIndex + 1, { keepSound: !video.muted });
        }

        function activateSound() {
            try {
                video.muted = false;
                video.volume = 1;
                const p = video.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            unmuteOverlay.classList.add('hidden');
        }

        function openPanel() {
            panel.classList.add('open');
            panel.setAttribute('aria-hidden', 'false');
        }
        function closePanel() {
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden', 'true');
        }
        function togglePanel() {
            if (panel.classList.contains('open')) closePanel();
            else openPanel();
        }

        // Ocultar la burbuja de "Activar sonido" apenas se desmutea desde donde sea
        video.addEventListener('volumechange', () => {
            if (!video.muted) unmuteOverlay.classList.add('hidden');
        });

        // Auto-avance al terminar
        video.addEventListener('ended', () => {
            if (currentIndex < EPISODES.length - 1) goNext();
        });

        unmuteBtn.addEventListener('click', activateSound);
        unmuteBtn.addEventListener('touchstart', activateSound, { passive: true });
        nextBtn.addEventListener('click', goNext);
        listBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);

        // Routing por hash (#1, #2, #3, …) con soporte para tiempo (#5?t=126)
        function parseHashParams() {
            const hash = window.location.hash || '';
            console.log('Parsing hash:', hash);
            // Formato: #5?t=126 o simplemente #5
            const m = /^#(\d+)(\?(.*))?$/.exec(hash);
            if (!m) return null;
            
            const idx = parseInt(m[1], 10) - 1;
            if (idx < 0 || idx >= EPISODES.length) return null;
            
            let time = null;
            if (m[3]) {
                // Parsear query params
                const params = new URLSearchParams(m[3]);
                const tParam = params.get('t');
                if (tParam) {
                    const parsedTime = parseInt(tParam, 10);
                    if (!isNaN(parsedTime) && parsedTime >= 0) {
                        time = parsedTime;
                    }
                }
            }
            
            console.log('Parsed result:', { index: idx, time });
            return { index: idx, time };
        }
        
        function episodeIndexFromHash() {
            const result = parseHashParams();
            return result ? result.index : null;
        }
        
        function applyHash({ keepSound = false } = {}) {
            const params = parseHashParams();
            if (params === null) return;
            if (params.index !== currentIndex) {
                playEpisode(params.index, { keepSound, updateHash: false, startTime: params.time });
            } else if (params.time !== null) {
                // Mismo episodio pero con tiempo diferente
                video.currentTime = params.time;
            }
        }
        window.addEventListener('hashchange', () => applyHash({ keepSound: !video.muted }));

        // Estado inicial: si viene con hash, empieza en ese episodio (y tiempo si aplica)
        const initialParams = parseHashParams();
        console.log('Initial params:', initialParams);
        if (initialParams !== null) {
            if (initialParams.index !== 0 || initialParams.time !== null) {
                currentIndex = initialParams.index; // Set before calling playEpisode
                playEpisode(initialParams.index, { updateHash: false, startTime: initialParams.time });
            }
        } else {
            // Sin hash válido, cargar episodio 1
            renderEpisodeList();
            updateNextButton();
        }
    </script>
</body>
</html>
