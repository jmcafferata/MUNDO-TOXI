<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MERS Vlog</title>

    <!-- Media Chrome (UI) + Mux Video (motor de reproducción HLS). -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-video@0/+esm"></script>
    <script>
        // Inicializar Cast SDK
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                const context = cast.framework.CastContext.getInstance();
                context.setOptions({
                    receiverApplicationId: 'B668F863', // O usa chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID si este falla
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                });

                // Escuchar cuando el Chromecast se conecta para enviarle el video
                context.addEventListener(
                    cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                    function(event) {
                        if (event.sessionState === cast.framework.SessionState.SESSION_STARTED) {
                            // Llamamos a una función global que definiremos abajo
                            if (typeof window.loadMediaToChromecast === 'function') {
                                window.loadMediaToChromecast();
                            }
                        }
                    }
                );
            }
        };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

    <style>
        :root {
            /* Tokens de estilo de la barra */
            --bar-bg: rgba(0, 0, 0, 0.55);
            --btn-hover: rgba(255, 255, 255, 0.12);
            --btn-icon: #ffffff;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- media-chrome --- */
        media-controller {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            /* Vídeo: mostrar completo, sin cropear */
            --media-object-fit: contain;
            --media-background-color: #000;
            --media-primary-color: #fff;
            --media-secondary-color: transparent;
            --media-text-color: #fff;
            --media-icon-color: #fff;
            --media-control-hover-background: var(--btn-hover);
            --media-control-background: transparent;
            --media-control-bar-background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            --media-control-bar-height: 64px;
            --media-button-icon-width: 28px;
            --media-button-icon-height: 28px;
            --media-font-size: 15px;
            --media-text-content-height: 32px;
            --media-range-thumb-height: 12px;
            --media-range-thumb-width: 12px;
            --media-range-track-height: 4px;
            --media-range-track-background: rgba(255,255,255,0.22);
            --media-range-bar-color: #ff5ac0;
        }

        mux-video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        /* Barra de controles custom - fixed al bottom */
        .custom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 16px 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .control-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .control-btn.hidden {
            display: none;
        }
        google-cast-launcher {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            flex-shrink: 0;
        }
        google-cast-launcher:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        google-cast-launcher::part(icon) {
            width: 24px;
            height: 24px;
        }
        
        .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #ff5ac0;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            font-size: 14px;
            color: #fff;
            min-width: 100px;
            text-align: right;
            flex-shrink: 0;
        }

        media-control-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: block !important;
            z-index: 30;
            pointer-events: auto;
            height: 64px;
            min-height: 64px;
            padding: 0 12px 8px;
            background: transparent;
        }
        media-control-bar::part(control-bar) {
            min-height: 64px;
            padding: 0;
            background: transparent;
        }
        media-control-bar::part(range) {
            margin: 0;
            min-height: 4px;
        }

        @media (max-width: 640px) {
            .custom-controls {
                padding: 10px 12px 16px;
                gap: 10px;
            }
            .control-btn svg {
                width: 22px;
                height: 22px;
            }
            .time-display {
                font-size: 13px;
                min-width: 85px;
            }
        }
        
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .custom-controls {
                padding-bottom: max(20px, calc(env(safe-area-inset-bottom) + 8px));
            }
        }

        /* Botones custom integrados en la barra de controles */

        /* Botón grande flotante para activar sonido (necesario por el autoplay muteado) */
        .unmute-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .unmute-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .unmute-overlay button {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            width: 72px;
            height: 72px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .unmute-overlay button:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.75);
        }
        .unmute-overlay button svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }
        
        @media (max-width: 640px) {
            .unmute-overlay {
                top: 12px;
            }
            .unmute-overlay button {
                font-size: 14px;
                letter-spacing: 1px;
                padding: 12px 20px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }

        /* Panel lateral con la lista de episodios */
        .episode-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(360px, 85vw);
            background: rgba(15, 15, 20, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 30;
            transform: translateX(100%);
            transition: transform 0.35s ease;
            display: flex;
            flex-direction: column;
        }
        .episode-panel.open {
            transform: translateX(0);
        }
        .episode-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .episode-panel-header button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .episode-list {
            list-style: none;
            margin: 0;
            padding: 8px 0;
            overflow-y: auto;
            flex: 1;
        }
        .episode-list li {
            padding: 16px 24px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s ease;
        }
        .episode-list li:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .episode-list li.current {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }
        .episode-list .marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        .episode-list li.current .marker {
            background: #fbfdfb;
            box-shadow: 0 0 12px #ffffff;
        }
    </style>
    <script type="module" src="./src/analytics.js"></script>
</head>
<body>
    <div class="stage">
        <media-controller>
            <mux-video
                id="video"
                slot="media"
                playback-id="KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg"
                stream-type="on-demand"
                muted
                playsinline
                crossorigin
            ></mux-video>
            <media-control-bar></media-control-bar>
        </media-controller>
    </div>

    <div class="custom-controls">
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="controls-row">
            <button class="control-btn" id="play-btn" aria-label="Play/Pausa">
                <svg viewBox="0 0 24 24" id="play-icon">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button class="control-btn" id="backward-btn" aria-label="Retroceder 10s">
                <svg viewBox="0 0 24 24">
                    <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
            <button class="control-btn" id="forward-btn" aria-label="Adelantar 10s">
                <svg viewBox="0 0 24 24">
                    <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
                </svg>
            </button>
            <span class="time-display" id="time-display">0:00 / 0:00</span>
            <button class="control-btn" id="next-btn" aria-label="Siguiente episodio">
                <svg viewBox="0 0 24 24">
                    <path d="M6 5v14l11-7L6 5zm12 0h2v14h-2z"/>
                </svg>
            </button>
            <button class="control-btn" id="list-btn" aria-label="Ver lista de episodios">
                <svg viewBox="0 0 24 24">
                    <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
                </svg>
            </button>
            <button class="control-btn" id="mute-btn" aria-label="Silenciar/Activar sonido">
                <svg viewBox="0 0 24 24" id="volume-icon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
            </button>
            <!-- <google-cast-launcher id="cast-btn" title="Chromecast"></google-cast-launcher> -->
            <button class="control-btn" id="fullscreen-btn" aria-label="Pantalla completa">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="unmute-overlay" class="unmute-overlay">
        <button id="unmute-btn" type="button" aria-label="Reproducir">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
    </div>

    <aside id="episode-panel" class="episode-panel" aria-hidden="true">
        <div class="episode-panel-header">
            <span>Episodios</span>
            <button id="close-panel" type="button" aria-label="Cerrar">✕</button>
        </div>
        <ul id="episode-list" class="episode-list"></ul>
    </aside>

    <script>
        // Auto-refresh para usuarios con versión cacheada vieja
        const VERSION = '3.0';
        const storedVersion = localStorage.getItem('mers-vlog-version');
        if (storedVersion !== VERSION) {
            localStorage.setItem('mers-vlog-version', VERSION);
            if (storedVersion !== null) {
                // Ya visitó antes con versión vieja, refrescar una vez
                location.reload(true);
            }
        }
        
        const video = document.getElementById('video');
        const stage = document.querySelector('.stage');
        const unmuteOverlay = document.getElementById('unmute-overlay');
        const unmuteBtn = document.getElementById('unmute-btn');
        const nextBtn = document.getElementById('next-btn');
        const listBtn = document.getElementById('list-btn');
        const closeBtn = document.getElementById('close-panel');
        const panel = document.getElementById('episode-panel');
        const listEl = document.getElementById('episode-list');

        const THUMBNAIL_WIDTH = 1280;
        const getThumbnailUrl = (playbackId,poster) =>
            `https://image.mux.com/${playbackId}/thumbnail.jpg?time=${poster}&width=${THUMBNAIL_WIDTH}&fit_mode=preserve`;
        
        // Controles custom
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const backwardBtn = document.getElementById('backward-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const muteBtn = document.getElementById('mute-btn');
        const volumeIcon = document.getElementById('volume-icon');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const timeDisplay = document.getElementById('time-display');

        const EPISODES = [
            { id: 'KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg', title: 'Episodio 1' },
            { id: 'm400b5KKa9zFXdB7pzc00X6U5mekfteej8WHQbI6UR102g', title: 'Episodio 2' },
            { id: '7aA401UGod4t2zsaIWxH3KEwjMKcO1EuJF1gMvks9C4E', title: 'Episodio 3' },
            { id: '9orOWaGSufTUXAV02t1i3RVFlz41NHeZDMEUZQSUA202E', title: 'Episodio 4' },
            { id: 'VdEEcI601TJyUEz535TNYWDpWDU3I02xjdXWbW6Pozt7Y', title: 'Episodio 5' },
            { id: '2pvsoB4YE81IJwB3miI9hD7p02VAInuLagXPx01S2f02ao', title: 'Episodio 6', poster: 496 }
        ];
        let currentIndex = 0;

        function renderEpisodeList() {
            listEl.innerHTML = '';
            EPISODES.forEach((ep, idx) => {
                const li = document.createElement('li');
                li.className = idx === currentIndex ? 'current' : '';
                li.innerHTML = `<span class="marker"></span><span>${ep.title}</span>`;
                li.addEventListener('click', () => {
                    playEpisode(idx, { keepSound: !video.muted });
                    closePanel();
                });
                listEl.appendChild(li);
            });
        }

        function updateNextButton() {
            if (currentIndex >= EPISODES.length - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        function prepareEpisode(index, { startTime = null } = {}) {
            if (index < 0 || index >= EPISODES.length) return;
            currentIndex = index;

            const thumbnail = getThumbnailUrl(EPISODES[index].id, EPISODES[index].poster || 0);
            video.setAttribute('poster', thumbnail);
            stage.style.backgroundImage = `url('${thumbnail}')`;
            video.setAttribute('playback-id', EPISODES[index].id);

            if (startTime !== null && startTime >= 0) {
                const seekToTime = () => {
                    console.log('Seeking to', startTime);
                    video.currentTime = startTime;
                    video.removeEventListener('loadedmetadata', seekToTime);
                };
                video.removeEventListener('loadedmetadata', seekToTime);
                video.addEventListener('loadedmetadata', seekToTime, { once: true });
            }

            updateNextButton();
            renderEpisodeList();
        }

        function playEpisode(index, { keepSound = false, updateHash = true, startTime = null } = {}) {
            prepareEpisode(index, { startTime });
            if (updateHash) {
                const targetHash = '#' + (index + 1);
                if (window.location.hash !== targetHash) {
                    history.replaceState(null, '', targetHash);
                }
            }

            try {
                if (!keepSound) video.muted = false;
                const p = video.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
        }

        // Función para enviar el stream de Mux al Chromecast
        window.loadMediaToChromecast = function() {
            const context = cast.framework.CastContext.getInstance();
            const castSession = context.getCurrentSession();
            
            if (!castSession) return;

            // Obtener el episodio actual de tu array EPISODES
            const currentEpisode = EPISODES[currentIndex];
            
            // Mux entrega el HLS nativo en esta estructura de URL
            const streamUrl = `https://stream.mux.com/${currentEpisode.id}.m3u8`;

            // Crear la información del medio para el Chromecast
            const mediaInfo = new chrome.cast.media.MediaInfo(streamUrl, 'application/x-mpegurl');
            
            // (Opcional) Agregar metadatos para que se vea el título y la imagen en la TV
            const metadata = new chrome.cast.media.GenericMediaMetadata();
            metadata.title = currentEpisode.title;
            metadata.images = [
                new chrome.cast.Image(getThumbnailUrl(currentEpisode.id, currentEpisode.poster || 0))
            ];
            mediaInfo.metadata = metadata;

            const request = new chrome.cast.media.LoadRequest(mediaInfo);
            
            // Sincronizar el tiempo de reproducción actual con la TV
            if (video.currentTime > 0) {
                request.currentTime = video.currentTime;
            }

            // Cargar el video en el Chromecast
            castSession.loadMedia(request).then(
                function() {
                    console.log('Video cargado exitosamente en Chromecast');
                    // Opcional: pausar el video local para que no suenen ambos
                    video.pause(); 
                },
                function(error) {
                    console.error('Error al cargar video en Cast:', error);
                }
            );
        };

        function goNext() {
            playEpisode(currentIndex + 1, { keepSound: !video.muted });
        }

        function activateSound() {
            try {
                video.muted = false;
                video.volume = 1;
                const p = video.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            unmuteOverlay.classList.add('hidden');
        }

        function openPanel() {
            panel.classList.add('open');
            panel.setAttribute('aria-hidden', 'false');
        }
        function closePanel() {
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden', 'true');
        }
        function togglePanel() {
            if (panel.classList.contains('open')) closePanel();
            else openPanel();
        }

        // Funciones de control del video
        function togglePlay() {
            if (video.paused) {
                video.muted = false;
                video.volume = 1;
                video.play();
            } else {
                video.pause();
            }
        }

        function updatePlayIcon() {
            if (video.paused) {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
                playIcon.innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
            }
        }

        function seekBackward() {
            video.currentTime = Math.max(0, video.currentTime - 10);
        }

        function seekForward() {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateVolumeIcon();
        }

        function updateVolumeIcon() {
            if (video.muted) {
                volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else {
                volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (stage.requestFullscreen) {
                    stage.requestFullscreen();
                } else if (stage.webkitRequestFullscreen) {
                    stage.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function formatTime(seconds) {
            if (!isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            const progress = (video.currentTime / video.duration) * 100;
            progressBar.style.width = progress + '%';
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }

        function seek(e) {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        // Event listeners de los controles
        playBtn.addEventListener('click', togglePlay);
        backwardBtn.addEventListener('click', seekBackward);
        forwardBtn.addEventListener('click', seekForward);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        progressContainer.addEventListener('click', seek);

        // Actualizar UI cuando el video cambia
        video.addEventListener('play', updatePlayIcon);
        video.addEventListener('pause', updatePlayIcon);
        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('loadedmetadata', updateProgress);
        video.addEventListener('volumechange', updateVolumeIcon);

        // Ocultar la burbuja de "Activar sonido" apenas se desmutea desde donde sea
        video.addEventListener('volumechange', () => {
            if (!video.muted) unmuteOverlay.classList.add('hidden');
        });

        // Auto-avance al terminar
        video.addEventListener('ended', () => {
            if (currentIndex < EPISODES.length - 1) goNext();
        });

        unmuteBtn.addEventListener('click', activateSound);
        unmuteBtn.addEventListener('touchstart', activateSound, { passive: true });
        nextBtn.addEventListener('click', goNext);
        listBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);

        video.addEventListener('click', () => {
            if (video.paused) {
                activateSound();
            }
        });
        video.addEventListener('touchstart', () => {
            if (video.paused) {
                activateSound();
            }
        }, { passive: true });

        video.addEventListener('play', () => {
            unmuteOverlay.classList.add('hidden');
        });

        // Routing por hash (#1, #2, #3, …) con soporte para tiempo (#5?t=126)
        function parseHashParams() {
            const hash = window.location.hash || '';
            console.log('Parsing hash:', hash);
            // Formato: #5?t=126 o simplemente #5
            const m = /^#(\d+)(\?(.*))?$/.exec(hash);
            if (!m) return null;
            
            const idx = parseInt(m[1], 10) - 1;
            if (idx < 0 || idx >= EPISODES.length) return null;
            
            let time = null;
            if (m[3]) {
                // Parsear query params
                const params = new URLSearchParams(m[3]);
                const tParam = params.get('t');
                if (tParam) {
                    const parsedTime = parseInt(tParam, 10);
                    if (!isNaN(parsedTime) && parsedTime >= 0) {
                        time = parsedTime;
                    }
                }
            }
            
            console.log('Parsed result:', { index: idx, time });
            return { index: idx, time };
        }
        
        function episodeIndexFromHash() {
            const result = parseHashParams();
            return result ? result.index : null;
        }
        
        function applyHash({ keepSound = false } = {}) {
            const params = parseHashParams();
            if (params === null) return;
            if (params.index !== currentIndex) {
                playEpisode(params.index, { keepSound, updateHash: false, startTime: params.time });
            } else if (params.time !== null) {
                // Mismo episodio pero con tiempo diferente
                video.currentTime = params.time;
            }
        }
        window.addEventListener('hashchange', () => applyHash({ keepSound: !video.muted }));

        // Estado inicial: si viene con hash, empieza en ese episodio (y tiempo si aplica)
        const initialParams = parseHashParams();
        console.log('Initial params:', initialParams);
        if (initialParams !== null) {
            currentIndex = initialParams.index;
            prepareEpisode(initialParams.index, { startTime: initialParams.time });
        } else {
            // Sin hash válido, cargar episodio 1
            const initialThumbnail = getThumbnailUrl(EPISODES[0].id);
            video.setAttribute('poster', initialThumbnail);
            stage.style.backgroundImage = `url('${initialThumbnail}')`;
            renderEpisodeList();
            updateNextButton();
        }
    </script>
</body>
</html>
