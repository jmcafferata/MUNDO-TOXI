<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERS Vlog</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            --media-object-fit: contain;
            --media-background-color: #000;
            /* Controles más grandes para mobile */
            --media-control-bar-height: 64px;
            --media-button-icon-width: 32px;
            --media-button-icon-height: 32px;
            --media-range-thumb-height: 18px;
            --media-range-thumb-width: 18px;
            --media-range-track-height: 6px;
            --media-font-size: 16px;
            --media-text-content-height: 32px;
        }
        /* En pantalla completa mostrar el video entero, sin cropear */
        mux-player:fullscreen,
        mux-player:-webkit-full-screen {
            --media-object-fit: contain;
        }
        .controls {
            position: fixed;
            inset: 24px 0 auto 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 16px;
            z-index: 10;
            pointer-events: none;
        }
        .controls button {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 20px 32px;
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease, opacity 0.3s ease;
        }
        .controls button:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.75);
        }
        .controls button.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="stage">
        <mux-player
            id="player"
            playback-id="KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg"
            stream-type="on-demand"
            autoplay
            muted
            playsinline
        ></mux-player>
    </div>
    <div class="controls">
        <button id="unmute-btn" type="button" aria-label="Activar sonido">🔇 Activar sonido</button>
        <button id="next-btn" type="button" aria-label="Siguiente episodio">Siguiente episodio ⏭</button>
    </div>
    <script>
        const player = document.getElementById('player');
        const unmuteBtn = document.getElementById('unmute-btn');
        const nextBtn = document.getElementById('next-btn');

        const EPISODES = [
            'KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg',
            'm400b5KKa9zFXdB7pzc00X6U5mekfteej8WHQbI6UR102g'
        ];
        let currentIndex = 0;

        function updateNextButton() {
            if (currentIndex >= EPISODES.length - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        function playEpisode(index, { keepSound = false } = {}) {
            if (index < 0 || index >= EPISODES.length) return;
            currentIndex = index;
            player.setAttribute('playback-id', EPISODES[index]);
            updateNextButton();
            // Reintentar reproducción; si el sonido ya estaba activo, mantenerlo
            try {
                if (!keepSound) player.muted = false;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
        }

        function goNext() {
            playEpisode(currentIndex + 1, { keepSound: !player.muted });
        }

        function activateSound() {
            try {
                player.muted = false;
                player.volume = 1;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            unmuteBtn.classList.add('hidden');
        }

        // Ocultar el botón si el usuario desmutea desde los controles nativos
        player.addEventListener('volumechange', () => {
            if (!player.muted) unmuteBtn.classList.add('hidden');
        });

        // Auto-avanzar al siguiente episodio cuando termina
        player.addEventListener('ended', () => {
            if (currentIndex < EPISODES.length - 1) goNext();
        });

        unmuteBtn.addEventListener('click', activateSound);
        unmuteBtn.addEventListener('touchstart', activateSound, { passive: true });
        nextBtn.addEventListener('click', goNext);
        nextBtn.addEventListener('touchstart', (e) => { e.preventDefault(); goNext(); });

        updateNextButton();
    </script>
</body>
</html>
