[versions]
agp = "8.3.2"
kotlin = "1.9.24"
media3 = "1.4.1"
coreKtx = "1.13.1"
appcompat = "1.7.0"
cast = "21.5.0"
mediarouter = "1.7.0"

[libraries]
media3-exoplayer     = { group = "androidx.media3", name = "media3-exoplayer",     version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui            = { group = "androidx.media3", name = "media3-ui",            version.ref = "media3" }
androidx-core-ktx    = { group = "androidx.core",   name = "core-ktx",             version.ref = "coreKtx" }
androidx-appcompat   = { group = "androidx.appcompat", name = "appcompat",         version.ref = "appcompat" }
cast-framework       = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "cast" }
media3-cast          = { group = "androidx.media3", name = "media3-cast",          version.ref = "media3" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter",     version.ref = "mediarouter" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
