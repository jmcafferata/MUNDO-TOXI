<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#000000" />
	<title>Conrado Herzfeld - TOXI Media</title>
	<meta name="description" content="Interpretaciones de obras del álbum de Conrado Herzfeld." />
	<meta property="og:title" content="Conrado Herzfeld - TOXI Media" />
	<meta property="og:description" content="Interpretaciones de obras del álbum de Conrado Herzfeld." />
	<style>
		:root {
			color-scheme: dark;
			font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
			color: #fff;
			background: #000;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 1.25rem clamp(1.25rem, 5vw, 4rem);
			border-bottom: 1px solid rgba(255, 255, 255, 0.16);
		}

		header a,
		.recording a {
			color: inherit;
			text-decoration: none;
		}

		header a {
			font-size: 0.75rem;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		header a:hover,
		.recording a:hover {
			color: rgba(255, 255, 255, 0.68);
		}

		main {
			width: min(100% - 2.5rem, 52rem);
			margin: clamp(4rem, 12vh, 8rem) auto;
		}

		.eyebrow {
			color: rgba(255, 255, 255, 0.55);
			font-size: 0.75rem;
			letter-spacing: 0.2em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0.75rem 0 3rem;
			font-size: clamp(2.5rem, 9vw, 5.5rem);
			font-weight: 400;
			letter-spacing: -0.045em;
			line-height: 1;
		}

		.recording {
			padding: 1.5rem 0;
			border-top: 1px solid rgba(255, 255, 255, 0.22);
		}

		.recording h2 {
			margin: 0;
			font-size: clamp(1.2rem, 3vw, 1.6rem);
			font-weight: 400;
			line-height: 1.5;
		}

		.recording p {
			margin: 0.5rem 0 0;
			color: rgba(255, 255, 255, 0.62);
			line-height: 1.6;
		}

		.recording a {
			display: inline-block;
			margin-top: 1rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.55);
			padding-bottom: 0.2rem;
			font-size: 0.85rem;
		}
	</style>
</head>
<body>
	<header>
		<a href="/">TOXI Media</a>
		<a href="/">Inicio</a>
	</header>
	<main>
		<p class="eyebrow">Música</p>
		<h1>Conrado Herzfeld</h1>
		<section class="recording" aria-labelledby="album-heading">
			<h2 id="album-heading">Diego López interpreta obras del álbum, 12/10/2026</h2>
			<a href="https://drive.google.com/drive/folders/1ntGRkZj6Hxu31dvfOaaEeA2YjGWJZ7vV?usp=sharing" target="_blank" rel="noopener noreferrer">Ver obras del álbum en Google Drive</a>
		</section>
		<section class="recording" aria-labelledby="song-heading">
			<h2 id="song-heading">
				<a href="https://drive.google.com/file/d/1bZC3KJNvHwHtuQlErmPe2k2UCdh-Ye8w/view?usp=drivesdk" target="_blank" rel="noopener noreferrer">Io T'amerò, de Conrado Herzfeld</a>
			</h2>
			<p>Interpretada en el Salón Dorado del Teatro Colón por los alumnos de Lucio Bruno Videla.</p>
		</section>
	</main>
</body>
</html>
