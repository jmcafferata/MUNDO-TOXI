<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#000000" />
	<title>Advoluta - TOXI Media</title>
	<meta property="og:title" content="Advoluta - TOXI Media" />
	<meta property="og:image" content="https://toxi.media/advoluta-og.jpg" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="https://toxi.media/advoluta-og.jpg" />
	<link rel="preload" as="image" href="/advoluta.webp" type="image/webp" fetchpriority="high" />
	<link rel="preconnect" href="https://stream.mux.com" crossorigin />
	<link rel="preconnect" href="https://image.mux.com" crossorigin />
	<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
	<style>
		html,
		body {
			margin: 0;
			background: #000;
		}

		.painting {
			display: block;
			width: 100%;
			height: auto;
			max-height: 100vh;
			object-fit: contain;
		}

		mux-player {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 9;
			--media-object-fit: contain;
		}

		.signup-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 24px 64px; box-sizing: border-box; font-family: 'Helvetica Now', Helvetica, Arial, sans-serif; }
		.signup-hero h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 16px; line-height: 1.1; color: #fff; }
		.signup-form { display: flex; gap: 10px; width: 100%; max-width: 480px; }
		.signup-form input { flex: 1; min-width: 0; padding: 14px 16px; font-size: 1rem; border: 1px solid #444; border-radius: 6px; background: #111; color: #fff; }
		.signup-form button { padding: 14px 26px; font-size: 1rem; font-weight: bold; border: 0; border-radius: 6px; background: #fff; color: #000; cursor: pointer; }
		.signup-form button:hover { background: #ddd; }
		@media (max-width: 480px) { .signup-form { flex-direction: column; } }
	</style>
</head>
<body>
	<img class="painting" src="/advoluta.webp" alt="Advoluta" width="1775" height="1255" fetchpriority="high" decoding="async" />
	<mux-player
		playback-id="Y1vt7hWBfTTTcdku7SRoalhS00NOLIj02z3eqi3LBdde8"
		metadata-video-title="Advoluta"
		stream-type="on-demand"
		preload="auto"
		playsinline
	></mux-player>
	<section class="signup-hero">
		<h1>Ingresá tu mail para saber el precio de lista</h1>
		<form class="signup-form" id="signup-form">
			<input type="email" id="signup-email" placeholder="tu@mail.com" autocomplete="email" required aria-label="Email">
			<input type="text" name="website" id="signup-website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
			<button type="submit">Enviar</button>
		</form>
	</section>
	<script>
		document.getElementById('signup-form').addEventListener('submit', function (e) {
			e.preventDefault();
			var btn = e.target.querySelector('button');
			var email = document.getElementById('signup-email').value.trim();
			btn.disabled = true;
			btn.textContent = 'Enviando...';
			fetch('/api/signup?kind=university', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ email: email, course: 'Advoluta - precio de lista', website: document.getElementById('signup-website').value })
			}).then(function (r) {
				if (!r.ok) throw new Error('fail');
				btn.textContent = '¡Listo! Te escribimos pronto';
			}).catch(function () {
				btn.disabled = false;
				btn.textContent = 'Enviar';
				alert('No pudimos enviar tu mail. Intentá de nuevo.');
			});
		});
	</script>
</body>
</html>
