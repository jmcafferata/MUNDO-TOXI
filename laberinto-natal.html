<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Laberinto Natal - TOXI Media</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            min-height: 100%;
        }

        body {
            font-family: 'Helvetica Now', 'Helvetica', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 16px);
            gap: 18px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }

        .brand-title {
            font-size: 1.15rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 700;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.5);
        }

        .controls {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1 1 130px;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }

        input {
            padding: 10px 12px;
            border: 1px solid rgba(255 (blanco sobre negro, acorde a estética TOXI)
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#fff';
            ctx.fillStyle = '#fff
            font-family: inherit;
            font-size: 0.95rem;
            color-scheme: dark;
        }

        input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            padding: 13px 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: opacity 0.15s ease;
        }

        button:hover, button:active { opacity: 0.8; }

        .canvas-wrapper {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 40px rgba(255,255,255,0.05), 0 20px 40px rgba(0,0,0,0.6);
        }

        .credit {
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-top: auto;
            padding-top: 10px;
        }

        @media (min-width: 640px) {
            .brand-title { font-size: 1.4rem; }
            body { padding-top: 40px; }
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="brand-subtitle">Generador de Laberinto Natal</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Fecha de Nacimiento</label>
            <input type="date" id="birthdate" value="1994-09-28">
        </div>
        <div class="control-group">
            <label>Latitud (Absoluta)</label>
            <input type="number" id="lat" step="0.01" value="34.6" inputmode="decimal">
        </div>
        <div class="control-group">
            <label>Longitud (Absoluta)</label>
            <input type="number" id="lon" step="0.01" value="58.4" inputmode="decimal">
        </div>
        <button onclick="generarLaberinto()">Generar Laberinto</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="mazeCanvas" width="600" height="600"></canvas>
    </div>

    <div class="credit">Diseño: Ricardo Nicola Patrón</div>

    <script>
        function calcularRotaciones(d, m, y, lat, lon) {
            return [
                (d * 12) % 360,                           // Círculo 1
                (m * 30) % 360,                           // Círculo 2
                y % 360,                                  // Círculo 3
                Math.floor(lat * 10) % 360,               // Círculo 4
                Math.floor(lon * 10) % 360,               // Círculo 5
                ((d + m) * 15) % 360,                     // Círculo 6
                (Math.floor(y / d) * 5) % 360,            // Círculo 7
                Math.floor((lat + lon) * 7) % 360,        // Círculo 8
                (d + m + y) % 360                         // Círculo 9
            ];
        }

        function generarLaberinto() {
            const dateInput = document.getElementById('birthdate').value;
            const lat = Math.abs(parseFloat(document.getElementById('lat').value));
            const lon = Math.abs(parseFloat(document.getElementById('lon').value));

            if (!dateInput) return alert("Por favor ingresa una fecha.");

            const date = new Date(dateInput);
            // Ajustar por zona horaria para obtener el día exacto ingresado
            const d = date.getUTCDate();
            const m = date.getUTCMonth() + 1;
            const y = date.getUTCFullYear();

            const rotaciones = calcularRotaciones(d, m, y, lat, lon);
            dibujarLaberinto(rotaciones);
        }

        function dibujarLaberinto(rotaciones) {
            const canvas = document.getElementById('mazeCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Limpiar canvas y rellenar de blanco
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Configuración de estilo (negro sobre blanco)
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#111';
            ctx.fillStyle = '#111';

            const radioBase = 25;
            const espaciado = 28;
            const tamanoPuerta = 0.35; // Tamaño del hueco en radianes

            // Dibujar el centro (la meta)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 10, 0, 2 * Math.PI);
            ctx.fill();

            // Dibujar los 9 anillos de adentro hacia afuera
            for (let i = 0; i < 9; i++) {
                // Invertimos el índice para que el Círculo 1 sea el exterior
                const rotacionGrados = rotaciones[8 - i];
                const rotacionRadianes = (rotacionGrados * Math.PI) / 180;
                const radioActual = radioBase + (i * espaciado);

                ctx.beginPath();
                // Dibujamos un arco que casi completa el círculo, dejando el hueco según la rotación
                ctx.arc(
                    centerX,
                    centerY,
                    radioActual,
                    rotacionRadianes + tamanoPuerta,
                    rotacionRadianes + (2 * Math.PI) - tamanoPuerta
                );
                ctx.stroke();
            }
        }

        // Generar uno por defecto al cargar
        window.onload = generarLaberinto;
    </script>
</body>
</html>
