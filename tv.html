<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TOXI TV</title>
    <meta property="og:title" content="TOXI TV" />
    <meta property="og:description" content="Canal de television de TOXI Media." />
    <meta property="og:image" content="https://toxi.media/toxi-media-og.jpg" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <script>
        // Inicializar Cast SDK con receiver personalizado antes de que mux-player lo use
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                cast.framework.CastContext.getInstance().setOptions({
                    receiverApplicationId: 'B668F863',
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                });
            }
        };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
        }
        .logo-link {
            pointer-events: all;
            opacity: 0.85;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .logo-link:hover { opacity: 1; }
        .logo-link img { height: 22px; }

        .tv-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
        }
        .tv-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.7; }

        #player-wrap {
            flex: 1;
            position: relative;
            background: #000;
        }

        mux-player {
            width: 100%; height: 100%;
            position: absolute; inset: 0;
            z-index: 5;
            --media-object-fit: contain;
            --media-background-color: #000;
            --media-primary-color: #fff;
            --media-accent-color: #fff;
            --media-secondary-color: #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        mux-player.is-active { opacity: 1; z-index: 6; }

        #cast-btn {
            position: absolute;
            bottom: 20px;
            right: 24px;
            z-index: 20;
            width: 28px;
            height: 28px;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            pointer-events: all;
            transition: color 0.2s;
        }
        #cast-btn:hover { color: #fff; }
        
        #now-playing {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: calc(72px + env(safe-area-inset-top, 0px)) 28px 32px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            transform: translateY(-100%);
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        #now-playing.visible { transform: translateY(0); }

        .np-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }
        .np-title { font-size: 1.05rem; font-weight: 500; }
        .np-next  { font-size: 0.7rem; color: rgba(255,255,255,0.38); margin-top: 2px; }
        .np-next span { color: rgba(255,255,255,0.6); }

        .np-progress { margin-top: 10px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
        .np-progress-fill { height: 100%; background: rgba(255,255,255,0.55); border-radius: 2px; transition: width 1s linear; width: 0%; }

        #clock { font-size: 0.65rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.38); font-variant-numeric: tabular-nums; }
        #offline-screen.visible { display: flex; }
        .offline-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.3; }

        #age-gate {
            position: absolute; inset: 0; z-index: 30;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 32px;
        }
        #age-gate.hidden { display: none; }
        .age-gate-logo { height: 28px; opacity: 0.9; margin-bottom: 8px; }
        .age-gate-title {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.25em;
            color: rgba(255,255,255,0.35);
        }
        .age-gate-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .age-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 14px 28px;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .age-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.5); }


    </style>
</head>
<body>

    <header>
        <a class="logo-link" href="/"><img src="/toxi-logo-white.png" alt="TOXI Media" /></a>
        <div class="tv-badge"><span class="tv-dot"></span><span id="clock">--:--</span></div>
    </header>

    <div id="player-wrap">
        <mux-player id="mux-player-a" class="is-active" stream-type="on-demand" autoplay muted preload="auto" nohotkeys nopip nocontrols default-hidden-captions></mux-player>
        <mux-player id="mux-player-b"                    stream-type="on-demand"         muted preload="auto" nohotkeys nopip nocontrols default-hidden-captions></mux-player>
        <google-cast-launcher id="cast-btn" title="Chromecast"></google-cast-launcher>
        <div id="age-gate">
            <img class="age-gate-logo" src="/toxi-logo-white.png" alt="TOXI Media" />
            <div class="age-gate-title">¿Cuántos años tenés?</div>
            <div class="age-gate-buttons">
                <button class="age-btn" id="age-over">Soy mayor de 16 años</button>
                <button class="age-btn" id="age-under">Soy menor de 16 años</button>
            </div>
        </div>
        <div id="offline-screen"><div class="offline-title">Sin señal</div></div>

        <div id="now-playing">
            <div class="np-label">Ahora</div>
            <div class="np-title" id="np-title">—</div>
            <div class="np-progress"><div class="np-progress-fill" id="np-fill"></div></div>
        </div>
    </div>

    <script type="module" src="./src/analytics.js"></script>
    <script type="module">
        const EPOCH_SEC = 1767225600;
        const PLAYLIST_URL = '/api/playlist';
        const SCHEDULE_URL = '/api/schedule';

        const player      = document.getElementById('mux-player-a');
        const standby     = document.getElementById('mux-player-b');
        const npTitle     = document.getElementById('np-title');
        const npFill      = document.getElementById('np-fill');
        const nowPlaying  = document.getElementById('now-playing');
        const clockEl     = document.getElementById('clock');
        const ageGate     = document.getElementById('age-gate');
        const offline     = document.getElementById('offline-screen');

        let activePlaylist = [];
        let weeklySchedule = [];
        let currentSlot = null;
        let currentPlaybackId = '';
        let audioActive = false;
        let overlayTimer = null;

        standby.pause();
        standby.classList.remove('is-active');
        player.classList.add('is-active');

        function showOverlay(title) {
            npTitle.textContent = title || '—';
            nowPlaying.classList.add('visible');
            clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => nowPlaying.classList.remove('visible'), 6000);
        }

        function formatAR(date) {
            const d = new Date(date.getTime() - 3 * 60 * 60 * 1000);
            return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
        }

        function updateClock() {
            clockEl.textContent = formatAR(new Date());
        }

        function getArtTime() {
            const nowMs = Date.now();
            const artMs = nowMs - 3 * 60 * 60 * 1000;
            const d = new Date(artMs);
            const jsDay = d.getUTCDay();
            const dow = (jsDay + 6) % 7;
            const daySec = d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds();
            return { dow, daySec };
        }

        function getFlatSlot(playlist) {
            const totalDuration = playlist.reduce((acc, item) => acc + Number(item.duration || 0), 0);
            if (!totalDuration) return null;
            const nowSec = Date.now() / 1000;
            const elapsed = ((nowSec - EPOCH_SEC) % totalDuration + totalDuration) % totalDuration;
            let acc = 0;
            for (let i = 0; i < playlist.length; i++) {
                acc += Number(playlist[i].duration || 0);
                if (elapsed < acc) {
                    const offsetSec = elapsed - (acc - Number(playlist[i].duration || 0));
                    return { index: i, offsetMs: offsetSec * 1000, item: playlist[i] };
                }
            }
            return { index: 0, offsetMs: 0, item: playlist[0] };
        }

        function getScheduledSlot() {
            const { dow, daySec } = getArtTime();
            for (let i = 0; i < weeklySchedule.length; i++) {
                const entry = weeklySchedule[i];
                if (entry.dayOfWeek !== dow) continue;
                const startSec = entry.startMin * 60;
                const endSec = startSec + Number(entry.item.duration || 0);
                if (daySec >= startSec && daySec < endSec) {
                    return { index: i, offsetMs: (daySec - startSec) * 1000, item: entry.item };
                }
            }

            const schedIds = new Set(weeklySchedule.map(entry => entry.item.id));
            const fillerPool = activePlaylist.filter(item => !schedIds.has(item.id));
            const fillerSlot = getFlatSlot(fillerPool.length ? fillerPool : activePlaylist);
            if (!fillerSlot) return null;
            return { index: 10000 + fillerSlot.index, offsetMs: fillerSlot.offsetMs, item: fillerSlot.item };
        }

        function getCurrentSlot() {
            if (weeklySchedule.length > 0) {
                return getScheduledSlot();
            }
            return getFlatSlot(activePlaylist);
        }

        function loadSlot(slot) {
            if (!slot || !slot.item) return;
            currentSlot = slot;

            const targetId = slot.item.id;
            const targetSeconds = Math.max(0, slot.offsetMs / 1000);

            if (currentPlaybackId !== targetId) {
                currentPlaybackId = targetId;
                player.setAttribute('playback-id', targetId);
                const onMeta = () => {
                    player.currentTime = targetSeconds;
                    player.play().catch(() => {});
                    player.removeEventListener('loadedmetadata', onMeta);
                };
                player.addEventListener('loadedmetadata', onMeta);
            } else {
                if (Math.abs((player.currentTime || 0) - targetSeconds) > 5) {
                    player.currentTime = targetSeconds;
                }
                player.play().catch(() => {});
            }

            showOverlay(slot.item.title);
        }

        async function loadRemoteData() {
            let playlist = [];
            try {
                const res = await fetch(PLAYLIST_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        playlist = data
                            .filter(v => v && v.id && Number(v.duration) > 0)
                            .map(v => ({ id: String(v.id), duration: Number(v.duration), title: String(v.title || '') }));
                    }
                }
            } catch (e) {}

            activePlaylist = playlist;
            if (!activePlaylist.length) return;

            try {
                const res = await fetch(SCHEDULE_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        const byId = new Map(activePlaylist.map(item => [item.id, item]));
                        weeklySchedule = data
                            .filter(entry => entry && Number.isInteger(entry.dayOfWeek) && Number.isFinite(entry.startMin) && entry.itemId)
                            .map(entry => ({
                                dayOfWeek: Number(entry.dayOfWeek),
                                startMin: Number(entry.startMin),
                                item: byId.get(String(entry.itemId))
                            }))
                            .filter(entry => entry.item);
                    }
                }
            } catch (e) {}
        }

        function dismissAgeGate() {
            audioActive = true;
            player.muted = false;
            player.volume = 1;
            ageGate.classList.add('hidden');
        }

        document.getElementById('age-over').addEventListener('click', dismissAgeGate);
        document.getElementById('age-under').addEventListener('click', dismissAgeGate);

        player.addEventListener('pause', () => {
            if (document.hidden) return;
            player.play().catch(() => {});
        });

        player.addEventListener('ended', () => {
            const slot = getCurrentSlot();
            if (slot) loadSlot(slot);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                const slot = getCurrentSlot();
                if (slot) loadSlot(slot);
            }
        });

        setInterval(() => {
            if (!currentSlot?.item?.duration) return;
            const pct = Math.min(100, ((player.currentTime || 0) / Number(currentSlot.item.duration)) * 100);
            npFill.style.width = pct + '%';
        }, 1000);

        setInterval(() => {
            const slot = getCurrentSlot();
            if (!slot) return;
            if (!currentSlot || slot.item.id !== currentSlot.item.id) {
                loadSlot(slot);
                return;
            }
            if (Math.abs((player.currentTime || 0) * 1000 - slot.offsetMs) > 5000) {
                player.currentTime = Math.max(0, slot.offsetMs / 1000);
            }
        }, 30000);

        (async () => {
            updateClock();
            setInterval(updateClock, 10000);

            await loadRemoteData();
            if (!activePlaylist.length) {
                offline.classList.add('visible');
                return;
            }

            player.muted = true;
            const slot = getCurrentSlot();
            if (slot) loadSlot(slot);

            if (!audioActive) {
                player.muted = true;
            }
        })();
    </script>

</body>
</html>
