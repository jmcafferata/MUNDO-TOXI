<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TOXI TV</title>
    <meta property="og:title" content="TOXI TV" />
    <meta property="og:description" content="Canal de television de TOXI Media." />
    <meta property="og:image" content="https://toxi.media/toxi-media-og.jpg" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
        }
        .logo-link {
            pointer-events: all;
            opacity: 0.85;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .logo-link:hover { opacity: 1; }
        .logo-link img { height: 22px; }

        .tv-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
        }
        .tv-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.7; }

        #player-wrap {
            flex: 1;
            position: relative;
            background: #000;
        }

        mux-player {
            width: 100%; height: 100%;
            position: absolute; inset: 0;
            z-index: 5;
            --media-object-fit: contain;
            --media-background-color: #000;
            pointer-events: none;
        }
        
        #now-playing {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: calc(72px + env(safe-area-inset-top, 0px)) 28px 32px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            transform: translateY(-100%);
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        #now-playing.visible { transform: translateY(0); }

        .np-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }
        .np-title { font-size: 1.05rem; font-weight: 500; }
        .np-next  { font-size: 0.7rem; color: rgba(255,255,255,0.38); margin-top: 2px; }
        .np-next span { color: rgba(255,255,255,0.6); }

        .np-progress { margin-top: 10px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
        .np-progress-fill { height: 100%; background: rgba(255,255,255,0.55); border-radius: 2px; transition: width 1s linear; width: 0%; }

        #clock { font-size: 0.65rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.38); font-variant-numeric: tabular-nums; }
        #offline-screen.visible { display: flex; }
        .offline-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.3; }

        #age-gate {
            position: absolute; inset: 0; z-index: 30;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 32px;
        }
        #age-gate.hidden { display: none; }
        .age-gate-logo { height: 28px; opacity: 0.9; margin-bottom: 8px; }
        .age-gate-title {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.25em;
            color: rgba(255,255,255,0.35);
        }
        .age-gate-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .age-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 14px 28px;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .age-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.5); }

        /* ── Grid integrado en el párpado ─────────────────────── */
        .np-grid {
            display: flex;
            align-items: stretch;
            gap: 0;
            margin-top: 18px;
            pointer-events: all;
        }

        .np-arrow {
            flex: 0 0 32px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            color: rgba(255,255,255,0.35);
            transition: color 0.2s;
            padding: 0;
        }
        .np-arrow:hover { color: rgba(255,255,255,0.9); }
        .np-arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .np-cards { flex: 1; display: flex; gap: 10px; overflow: hidden; min-width: 0; }

        .grid-card {
            flex: 0 0 calc(33.333% - 7px);
            min-width: 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 10px 12px 9px;
            opacity: 0.45;
            transition: opacity 0.3s, background 0.3s, border-color 0.3s;
        }
        .grid-card.is-now { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); opacity: 1; }
        .grid-card.is-adj { opacity: 0.68; }
        .grid-card-label { font-size: 0.48rem; text-transform: uppercase; letter-spacing: 0.18em; color: rgba(255,255,255,0.32); margin-bottom: 4px; }
        .grid-card-title { font-size: 0.72rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grid-card-bar { margin-top: 7px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .grid-card-bar-fill { height: 100%; background: rgba(255,255,255,0.5); border-radius: 2px; transition: width 1s linear; width: 0%; }
    </style>
</head>
<body>

    <header>
        <a class="logo-link" href="/"><img src="/toxi-logo-white.png" alt="TOXI Media" /></a>
        <div class="tv-badge"><span class="tv-dot"></span><span id="clock">--:--</span></div>
    </header>

    <div id="player-wrap">
        <mux-player id="mux-player" stream-type="on-demand" autoplay muted preload="auto" nohotkeys nopip nocontrols default-hidden-captions cast-receiver="B668F863"></mux-player>
        <div id="age-gate">
            <img class="age-gate-logo" src="/toxi-logo-white.png" alt="TOXI Media" />
            <div class="age-gate-title">¿Cuántos años tenés?</div>
            <div class="age-gate-buttons">
                <button class="age-btn" id="age-over">Soy mayor de 16 años</button>
                <button class="age-btn" id="age-under">Soy menor de 16 años</button>
            </div>
        </div>
        <div id="offline-screen"><div class="offline-title">Sin señal</div></div>

        <div id="now-playing">
            <div class="np-label">Ahora</div>
            <div class="np-title" id="np-title">—</div>
            <div class="np-progress"><div class="np-progress-fill" id="np-fill"></div></div>
            <div class="np-grid">
                <button class="np-arrow" id="grid-prev" aria-label="Anterior">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="np-cards" id="grid-track"></div>
                <button class="np-arrow" id="grid-next" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { TV_PLAYLIST as PLAYLIST } from './src/content.js';

        // Epoca fija: cambiala para "reiniciar" el canal desde cero
        const EPOCH_SEC = new Date('2026-01-01T00:00:00Z').getTime() / 1000;

        // ── Calcula que video y en que segundo estamos ──────
        const TOTAL = PLAYLIST.reduce((s, v) => s + v.duration, 0);

        function getCurrentSlot() {
            const elapsed = (Date.now() / 1000 - EPOCH_SEC) % TOTAL;
            let acc = 0;
            for (let i = 0; i < PLAYLIST.length; i++) {
                acc += PLAYLIST[i].duration;
                if (elapsed < acc) {
                    const offset = elapsed - (acc - PLAYLIST[i].duration);
                    return {
                        video:  PLAYLIST[i],
                        offset: offset,
                        index:  i,
                        next:   PLAYLIST[(i + 1) % PLAYLIST.length]
                    };
                }
            }
        }

        const player      = document.getElementById('mux-player');
        const npTitle     = document.getElementById('np-title');
        const npFill      = document.getElementById('np-fill');
        const nowPlaying  = document.getElementById('now-playing');
        const clockEl     = document.getElementById('clock');
        const gridTrack   = document.getElementById('grid-track');
        const gridPrev    = document.getElementById('grid-prev');
        const gridNext    = document.getElementById('grid-next');
        let currentIndex     = -1;
        let overlayTimer     = null;
        let programmaticSeek = false;
        let gridStart        = 0;
        const CARDS_VIEW     = 3;

        function loadSlot(slot) {
            currentIndex = slot.index;
            player.setAttribute('playback-id', slot.video.id);
            const seek = () => {
                programmaticSeek = true;
                player.currentTime = slot.offset;
                programmaticSeek = false;
                player.play().catch(() => {});
                player.removeEventListener('loadedmetadata', seek);
            };
            player.addEventListener('loadedmetadata', seek);
            showOverlay(slot);
        }

        // Cuando termina un video, carga el siguiente segun el reloj
        player.addEventListener('ended', () => loadSlot(getCurrentSlot()));

        // Correccion de drift cada 30 segundos
        setInterval(() => {
            const slot = getCurrentSlot();
            if (slot.index !== currentIndex) { loadSlot(slot); return; }
            if (Math.abs(player.currentTime - slot.offset) > 5) {
                programmaticSeek = true;
                player.currentTime = slot.offset;
                programmaticSeek = false;
            }
        }, 30000);

        // Bloquear pausa
        player.addEventListener('pause', () => {
            if (!document.hidden) player.play().catch(() => {});
        });

        // Bloquear seek manual: corrige al offset real (ignora seeks programaticos)
        player.addEventListener('seeking', () => {
            if (programmaticSeek) return;
            const expected = getCurrentSlot().offset;
            if (Math.abs(player.currentTime - expected) > 2) {
                programmaticSeek = true;
                player.currentTime = expected;
                programmaticSeek = false;
            }
        });

        // Overlay de "ahora + grilla"
        function showOverlay(slot) {
            npTitle.textContent = slot.video.title;
            gridStart = (slot.index - 1 + PLAYLIST.length) % PLAYLIST.length;
            buildGrid();
            nowPlaying.classList.add('visible');
            clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => nowPlaying.classList.remove('visible'), 6000);
        }

        // Barra de progreso decorativa
        setInterval(() => {
            const slot = getCurrentSlot();
            npFill.style.width = ((slot.offset / slot.video.duration) * 100) + '%';
        }, 1000);

        // Reloj — UTC-3 fijo (Argentina)
        function formatAR(date) {
            const d = new Date(date.getTime() - 3 * 60 * 60 * 1000);
            return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
        }

        function updateClock() {
            clockEl.textContent = formatAR(new Date());
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ── Grid integrado en el párpado ──────────────────────

        // Pre-computa el inicio acumulado (en segundos desde inicio del loop) de cada video
        const CUM_START = (() => {
            const a = []; let acc = 0;
            for (const v of PLAYLIST) { a.push(acc); acc += v.duration; }
            return a;
        })();

        function getStartTime(idx) {
            const elapsed    = (Date.now() / 1000 - EPOCH_SEC) % TOTAL;
            const cycleStart = Date.now() / 1000 - elapsed;
            return formatAR(new Date((cycleStart + CUM_START[idx]) * 1000));
        }

        function buildGrid() {
            gridTrack.innerHTML = '';
            const slot = getCurrentSlot();
            for (let i = 0; i < CARDS_VIEW; i++) {
                const idx    = (gridStart + i) % PLAYLIST.length;
                const item   = PLAYLIST[idx];
                const isNow  = idx === slot.index;
                const isNext = idx === (slot.index + 1) % PLAYLIST.length;
                const card   = document.createElement('div');
                card.className = 'grid-card' + (isNow ? ' is-now' : (i === 1 ? ' is-adj' : ''));
                const tag  = isNow ? 'Ahora' : (isNext ? 'A continuación' : '');
                const time = getStartTime(idx);
                const lbl  = tag ? tag + ' · ' + time : time;
                const pct  = isNow ? ((slot.offset / slot.video.duration) * 100).toFixed(1) : '0';
                card.innerHTML =
                    '<div class="grid-card-label">' + lbl + '</div>' +
                    '<div class="grid-card-title">' + item.title + '</div>' +
                    '<div class="grid-card-bar"><div class="grid-card-bar-fill" style="width:' + pct + '%"></div></div>';
                gridTrack.appendChild(card);
            }
        }

        function resetOverlayTimer() {
            clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => nowPlaying.classList.remove('visible'), 6000);
        }

        gridPrev.addEventListener('click', e => {
            e.stopPropagation();
            gridStart = (gridStart - 1 + PLAYLIST.length) % PLAYLIST.length;
            buildGrid(); resetOverlayTimer();
        });
        gridNext.addEventListener('click', e => {
            e.stopPropagation();
            gridStart = (gridStart + 1) % PLAYLIST.length;
            buildGrid(); resetOverlayTimer();
        });

        // Sync barra de progreso de la tarjeta "ahora" cada segundo
        setInterval(() => {
            if (!nowPlaying.classList.contains('visible')) return;
            const slot = getCurrentSlot();
            const fill = gridTrack.querySelector('.grid-card.is-now .grid-card-bar-fill');
            if (fill) fill.style.width = ((slot.offset / slot.video.duration) * 100).toFixed(1) + '%';
        }, 1000);

        // Click en el player → mostrar/ocultar párpado
        document.getElementById('player-wrap').addEventListener('click', e => {
            if (e.target === gridPrev || gridPrev.contains(e.target)) return;
            if (e.target === gridNext || gridNext.contains(e.target)) return;
            if (nowPlaying.classList.contains('visible')) {
                nowPlaying.classList.remove('visible');
                clearTimeout(overlayTimer);
            } else {
                showOverlay(getCurrentSlot());
            }
        });

        // Age gate: ambos botones descartan el overlay y activan el audio
        const ageGate = document.getElementById('age-gate');
        function dismissAgeGate() {
            player.muted = false;
            player.volume = 1;
            ageGate.classList.add('hidden');
        }
        document.getElementById('age-over').addEventListener('click', dismissAgeGate);
        document.getElementById('age-under').addEventListener('click', dismissAgeGate);

        // Arrancar
        if (!PLAYLIST.length) {
            document.getElementById('offline-screen').classList.add('visible');
        } else {
            loadSlot(getCurrentSlot());
        }
    </script>

</body>
</html>
