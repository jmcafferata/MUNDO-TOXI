<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RADIO TOXI</title>
    <meta property="og:title" content="RADIO TOXI" />
    <meta property="og:description" content="Radio de TOXI Media." />
    <meta property="og:image" content="https://toxi.media/toxi-media-og.jpg" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── HEADER ── */
        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        .logo-link {
            opacity: 0.85;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .logo-link:hover { opacity: 1; }
        .logo-link img { height: 22px; }

        .radio-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
        }
        .radio-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #fff; opacity: 0.7;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .radio-dot.playing { background: #f87171; opacity: 1; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.3); }
        }

        #clock {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.38);
            font-variant-numeric: tabular-nums;
        }

        /* ── MAIN ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            padding: 80px 28px 120px;
            position: relative;
        }

        /* ── VISUALIZER ── */
        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 80px;
            opacity: 0.18;
            transition: opacity 0.6s ease;
        }
        .visualizer.active { opacity: 1; }

        .bar {
            width: 4px;
            border-radius: 2px;
            background: #fff;
            min-height: 4px;
            animation: none;
            height: 4px;
            transition: height 0.1s ease;
        }
        .visualizer.active .bar { animation: var(--anim) var(--dur) ease-in-out infinite alternate; }

        @keyframes bar1  { 0%{height:8px}  100%{height:52px} }
        @keyframes bar2  { 0%{height:20px} 100%{height:70px} }
        @keyframes bar3  { 0%{height:36px} 100%{height:80px} }
        @keyframes bar4  { 0%{height:14px} 100%{height:60px} }
        @keyframes bar5  { 0%{height:44px} 100%{height:76px} }
        @keyframes bar6  { 0%{height:6px}  100%{height:48px} }
        @keyframes bar7  { 0%{height:28px} 100%{height:72px} }
        @keyframes bar8  { 0%{height:16px} 100%{height:64px} }
        @keyframes bar9  { 0%{height:40px} 100%{height:78px} }
        @keyframes bar10 { 0%{height:10px} 100%{height:56px} }
        @keyframes bar11 { 0%{height:32px} 100%{height:74px} }
        @keyframes bar12 { 0%{height:18px} 100%{height:66px} }
        @keyframes bar13 { 0%{height:46px} 100%{height:80px} }
        @keyframes bar14 { 0%{height:12px} 100%{height:58px} }
        @keyframes bar15 { 0%{height:24px} 100%{height:68px} }
        @keyframes bar16 { 0%{height:38px} 100%{height:76px} }
        @keyframes bar17 { 0%{height:8px}  100%{height:54px} }
        @keyframes bar18 { 0%{height:30px} 100%{height:72px} }
        @keyframes bar19 { 0%{height:22px} 100%{height:62px} }
        @keyframes bar20 { 0%{height:48px} 100%{height:80px} }
        @keyframes bar21 { 0%{height:14px} 100%{height:60px} }
        @keyframes bar22 { 0%{height:34px} 100%{height:74px} }
        @keyframes bar23 { 0%{height:6px}  100%{height:46px} }
        @keyframes bar24 { 0%{height:26px} 100%{height:70px} }
        @keyframes bar25 { 0%{height:42px} 100%{height:78px} }

        /* ── TRACK INFO ── */
        .track-info {
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        .track-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }
        .track-title {
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 8px;
            min-height: 1.8em;
        }
        .track-counter {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            font-variant-numeric: tabular-nums;
        }

        /* ── PROGRESS ── */
        .progress-wrap {
            width: 100%;
            max-width: 520px;
        }
        .progress-bar {
            height: 2px;
            background: rgba(255,255,255,0.12);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: rgba(255,255,255,0.7);
            border-radius: 2px;
            width: 0%;
            transition: width 1s linear;
        }
        .progress-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            color: rgba(255,255,255,0.3);
            font-variant-numeric: tabular-nums;
        }

        /* ── CONTROLS ── */
        .controls {
            display: flex;
            align-items: center;
            gap: 36px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s, transform 0.15s;
            line-height: 0;
        }
        .ctrl-btn:hover { color: #fff; transform: scale(1.1); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.main-btn {
            color: #fff;
            width: 52px; height: 52px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn.main-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.6);
        }

        /* ── AGE GATE ── */
        #age-gate {
            position: fixed; inset: 0; z-index: 30;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 32px;
        }
        #age-gate.hidden { display: none; }
        .age-gate-logo { height: 28px; opacity: 0.9; margin-bottom: 8px; }
        .age-gate-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.35);
        }
        .age-gate-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .age-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 14px 28px;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .age-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.5);
        }

        /* ── OFFLINE ── */
        #offline-screen {
            position: fixed; inset: 0; z-index: 20;
            background: #000;
            display: none;
            align-items: center; justify-content: center;
        }
        #offline-screen.visible { display: flex; }
        .offline-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.3;
        }

    </style>
</head>
<body>

    <header>
        <a class="logo-link" href="/"><img src="/toxi-logo-white.png" alt="TOXI Media" /></a>
        <div class="radio-badge">
            <span class="radio-dot" id="radio-dot"></span>
            <span>Radio</span>
        </div>
        <div id="clock">--:--</div>
    </header>

    <main>
        <div class="visualizer" id="visualizer">
            <!-- 25 barras — generadas por JS -->
        </div>

        <div class="track-info">
            <div class="track-label">Ahora</div>
            <div class="track-title" id="track-title">—</div>
            <div class="track-counter" id="track-counter"></div>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-times">
                <span id="time-current">0:00</span>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="btn-prev" title="Anterior">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
                </svg>
            </button>
            <button class="ctrl-btn main-btn" id="btn-playpause" title="Play / Pausa">
                <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <button class="ctrl-btn" id="btn-next" title="Siguiente">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>
    </main>

    <audio id="audio" preload="auto"></audio>

    <div id="offline-screen"><div class="offline-title">Sin señal</div></div>

    <div id="age-gate">
        <img class="age-gate-logo" src="/toxi-logo-white.png" alt="TOXI Media" />
        <div class="age-gate-title">¿Cuántos años tenés?</div>
        <div class="age-gate-buttons">
            <button class="age-btn" id="age-over">Soy mayor de 16 años</button>
            <button class="age-btn" id="age-under">Soy menor de 16 años</button>
        </div>
    </div>

    <script type="module">
        import { CONTENT } from './src/content.js';

        const PLAYLIST = CONTENT.filter(v => v.onTV).map((v, i) => ({
            id:       v.id,
            title:    v.title,
            duration: v.duration || 0,
            index:    i,
        }));

        // ── DOM ──
        const audio         = document.getElementById('audio');
        const visualizer    = document.getElementById('visualizer');
        const trackTitle    = document.getElementById('track-title');
        const trackCounter  = document.getElementById('track-counter');
        const progressFill  = document.getElementById('progress-fill');
        const progressBar   = document.getElementById('progress-bar');
        const timeCurrent   = document.getElementById('time-current');
        const timeTotal     = document.getElementById('time-total');
        const btnPrev       = document.getElementById('btn-prev');
        const btnPlayPause  = document.getElementById('btn-playpause');
        const btnNext       = document.getElementById('btn-next');
        const iconPlay      = document.getElementById('icon-play');
        const iconPause     = document.getElementById('icon-pause');
        const radioDot      = document.getElementById('radio-dot');
        const clockEl       = document.getElementById('clock');
        const ageGate       = document.getElementById('age-gate');

        // ── Waveform bars ──
        const ANIMS = [
            ['bar1','0.6s'],['bar2','0.8s'],['bar3','0.5s'],['bar4','0.7s'],['bar5','0.9s'],
            ['bar6','0.6s'],['bar7','0.8s'],['bar8','0.5s'],['bar9','0.7s'],['bar10','0.9s'],
            ['bar11','0.6s'],['bar12','0.8s'],['bar13','0.5s'],['bar14','0.7s'],['bar15','0.9s'],
            ['bar16','0.6s'],['bar17','0.8s'],['bar18','0.5s'],['bar19','0.7s'],['bar20','0.9s'],
            ['bar21','0.6s'],['bar22','0.8s'],['bar23','0.5s'],['bar24','0.7s'],['bar25','0.9s'],
        ];
        ANIMS.forEach(([anim, dur], i) => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.cssText = `--anim:${anim}; --dur:${dur}; animation-delay:${(i * 0.06).toFixed(2)}s`;
            visualizer.appendChild(bar);
        });

        // ── HLS state ──
        let hls = null;
        let currentIndex = 0;
        let isPlaying    = false;
        let audioUnlocked = false;

        function formatTime(s) {
            if (!isFinite(s) || s < 0) return '0:00';
            const m = Math.floor(s / 60);
            const ss = Math.floor(s % 60);
            return `${m}:${ss.toString().padStart(2, '0')}`;
        }

        function updateUI() {
            const track = PLAYLIST[currentIndex];
            trackTitle.textContent   = track.title;
            trackCounter.textContent = `${currentIndex + 1} / ${PLAYLIST.length}`;
        }

        function setPlayState(playing) {
            isPlaying = playing;
            iconPlay.style.display  = playing ? 'none'  : '';
            iconPause.style.display = playing ? ''      : 'none';
            visualizer.classList.toggle('active', playing);
            radioDot.classList.toggle('playing', playing);
        }

        function loadTrack(index, autoplay = true) {
            currentIndex = ((index % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
            const track = PLAYLIST[currentIndex];
            const url   = `https://stream.mux.com/${track.id}.m3u8`;

            // Reset progress
            progressFill.style.transition = 'none';
            progressFill.style.width = '0%';
            timeCurrent.textContent = '0:00';
            timeTotal.textContent   = track.duration ? formatTime(track.duration) : '0:00';

            updateUI();

            // Destroy previous HLS instance
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 60, startLevel: -1, autoLevelEnabled: true });
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (autoplay && audioUnlocked) {
                        audio.play().catch(() => {});
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS
                audio.src = url;
                if (autoplay && audioUnlocked) {
                    audio.play().catch(() => {});
                }
            } else {
                document.getElementById('offline-screen').classList.add('visible');
                return;
            }
        }

        // ── Progress update ──
        audio.addEventListener('timeupdate', () => {
            const dur = audio.duration || PLAYLIST[currentIndex].duration;
            if (!dur) return;
            const pct = (audio.currentTime / dur) * 100;
            progressFill.style.transition = 'width 1s linear';
            progressFill.style.width      = Math.min(100, pct) + '%';
            timeCurrent.textContent = formatTime(audio.currentTime);
            timeTotal.textContent   = formatTime(dur);
        });

        // ── Track ended → next ──
        audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

        // ── Play/pause state ──
        audio.addEventListener('play',  () => setPlayState(true));
        audio.addEventListener('pause', () => setPlayState(false));

        // ── Seek via progress bar ──
        progressBar.addEventListener('click', e => {
            if (!audioUnlocked) return;
            const pct = e.offsetX / progressBar.offsetWidth;
            const dur = audio.duration || PLAYLIST[currentIndex].duration;
            if (dur) { audio.currentTime = pct * dur; }
        });

        // ── Controls ──
        btnPlayPause.addEventListener('click', () => {
            if (!audioUnlocked) return;
            if (isPlaying) { audio.pause(); }
            else           { audio.play().catch(() => {}); }
        });

        btnPrev.addEventListener('click', () => {
            if (!audioUnlocked) return;
            // Si llevamos más de 3s → reiniciar track; si no → track anterior
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                loadTrack(currentIndex - 1, isPlaying);
            }
        });

        btnNext.addEventListener('click', () => {
            if (!audioUnlocked) return;
            loadTrack(currentIndex + 1, true);
        });

        // ── Reloj Argentina (UTC-3) ──
        function formatAR(date) {
            const d = new Date(date.getTime() - 3 * 60 * 60 * 1000);
            return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
        }
        function updateClock() { clockEl.textContent = formatAR(new Date()); }
        updateClock();
        setInterval(updateClock, 10000);

        // ── Age gate ──
        function dismissAgeGate() {
            audioUnlocked = true;
            ageGate.classList.add('hidden');
            audio.play().catch(() => {});
        }
        document.getElementById('age-over').addEventListener('click', dismissAgeGate);
        document.getElementById('age-under').addEventListener('click', dismissAgeGate);

        // ── Arrancar ──
        if (!PLAYLIST.length) {
            document.getElementById('offline-screen').classList.add('visible');
        } else {
            loadTrack(0, false);
        }
    </script>

</body>
</html>
