<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detrás de las Risas - TOXI Media</title>
    <meta name="description" content="Detrás de las Risas — película de TOXI Media." />
    <meta property="og:title" content="Detrás de las Risas - TOXI Media" />
    <meta property="og:description" content="Detrás de las Risas — película de TOXI Media." />
    <meta property="og:image" content="/detras%20de%20las%20risas%20pop%20art%20rectangulo.jpg" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-video@0/+esm"></script>
    <style>
        @font-face {
            font-family: 'Helvetica Now';
            src: url('/HelveticaNowDisplay-Bold.otf') format('opentype');
            font-weight: bold;
        }
        @font-face {
            font-family: 'Helvetica Now';
            src: url('/HelveticaNowDisplay-Light.otf') format('opentype');
            font-weight: 300;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── DVD CONTAINER ── */
        #dvd-container {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 50;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-video-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .bg-video-player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            --media-object-fit: cover;
            --media-background-color: transparent;
            opacity: 0;
            pointer-events: none;
        }
        .bg-video-player.active { opacity: 0.4; }
        .bg-video-player::part(control-bar),
        .bg-video-player::part(play-button),
        .bg-video-player::part(center-controls),
        .bg-video-player::part(loading-indicator) {
            display: none !important;
        }

        .dvd-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.85) 100%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .dvd-content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            overflow-y: auto;
        }

        .bounce-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: min(260px, 50vw);
            height: auto;
            display: block;
            z-index: 2;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
        }

        .dvd-menu-wrapper {
            width: 100%;
            max-width: 960px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px 0;
        }

        .dvd-menu-group {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .dvd-menu-item {
            position: relative;
            font-weight: bold;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
            padding: 10px 24px;
            cursor: pointer;
            transition: color 0.25s ease, text-shadow 0.25s ease;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            user-select: none;
        }
        .dvd-menu-item::before {
            content: '▶';
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%) scale(0.85);
            opacity: 0;
            color: #ffcc00;
            transition: opacity 0.2s ease, left 0.2s ease;
        }
        .dvd-menu-item:hover,
        .dvd-menu-item:focus-visible {
            color: #ffcc00;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.7);
            outline: none;
        }
        .dvd-menu-item:hover::before,
        .dvd-menu-item:focus-visible::before {
            opacity: 1;
            left: -10px;
        }

        .dvd-submenu {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            animation: fadeInSubmenu 0.4s ease-out;
        }
        @keyframes fadeInSubmenu {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .submenu-title {
            font-weight: bold;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            color: #ffcc00;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 6px;
        }
        .submenu-back-btn {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .coming-soon {
            font-weight: bold;
            font-size: 1.8rem;
            letter-spacing: 0.15em;
            color: #ffcc00;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: textPulse 2s infinite alternate;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .coming-soon-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.55);
            max-width: 440px;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @keyframes textPulse {
            0%   { opacity: 0.55; transform: scale(0.98); }
            100% { opacity: 1;    transform: scale(1.02); }
        }

        /* ── ESCENAS ── */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 840px;
        }
        .scene-card {
            cursor: pointer;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: left;
            transition: border-color 0.2s, transform 0.2s;
        }
        .scene-card:hover,
        .scene-card:focus-visible {
            border-color: #ffcc00;
            transform: scale(1.03);
            outline: none;
        }
        .scene-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .scene-info { padding: 10px 12px 12px; }
        .scene-num {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
        }
        .scene-title {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 5;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }

        @media (max-width: 700px) {
            .dvd-content { padding: 56px 20px 24px; }
            .dvd-menu-group { flex-direction: column; gap: 6px; }
            .scene-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .coming-soon { font-size: 1.4rem; }
        }

        /* ── PLAYER VIEW ── */
        #player-view {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
        }
        #player-view.active { display: block; }

        #player-view media-controller {
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000;
            --media-object-fit: contain;
            --media-background-color: #000;
        }
        #player-view mux-video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }
        #player-view media-control-bar { display: none !important; }

        .custom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 16px 20px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .controls-row { display: flex; align-items: center; gap: 8px; }
        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }
        .control-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .control-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .scene-marker {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 12px;
            background: #ffcc00;
            pointer-events: none;
        }
        .time-display {
            font-size: 14px;
            color: #fff;
            min-width: 100px;
            text-align: right;
            flex-shrink: 0;
            margin-left: auto;
        }
        @media (max-width: 640px) {
            .custom-controls { padding: 10px 12px 16px; gap: 10px; }
            .control-btn svg { width: 22px; height: 22px; }
            .time-display { font-size: 13px; min-width: 85px; }
        }
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .custom-controls { padding-bottom: max(20px, calc(env(safe-area-inset-bottom) + 8px)); }
        }

        .player-ui-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .player-ui-btn:hover {
            border-color: rgba(255,255,255,0.8);
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .player-top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 110;
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: none;
        }
        .player-top-bar > * { pointer-events: auto; }
        #player-title {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
        }

        .ui-fade { opacity: 1; transition: opacity 0.5s ease; }
        .ui-fade.hidden { opacity: 0; pointer-events: none !important; }
    </style>
    <script type="module" src="./src/analytics.js"></script>
</head>
<body>

    <!-- MENÚ DVD -->
    <div id="dvd-container">
        <div class="bg-video-container">
            <mux-player id="bg-player-1" class="bg-video-player" stream-type="on-demand" muted autoplay></mux-player>
            <mux-player id="bg-player-2" class="bg-video-player" stream-type="on-demand" muted autoplay></mux-player>
        </div>
        <div class="dvd-overlay"></div>
        <img src="/logo%20detras%20de%20las%20risas.png" alt="Detrás de las Risas" class="bounce-logo" id="bounce-logo" />
        <a href="/main.html" class="back-link">&larr; Volver a TOXI</a>

        <div class="dvd-content">
            <div class="dvd-menu-wrapper">
                <div class="dvd-menu-group" id="main-dvd-menu">
                    <div class="dvd-menu-item" id="menu-play" role="button" tabindex="0">Reproducir película</div>
                    <div class="dvd-menu-item" id="menu-scenes" role="button" tabindex="0">Escenas</div>
                    <div class="dvd-menu-item" id="menu-specials" role="button" tabindex="0">Características Especiales</div>
                    <div class="dvd-menu-item" id="menu-languages" role="button" tabindex="0">Idiomas</div>
                </div>

                <div class="dvd-submenu" id="submenu-scenes">
                    <div class="submenu-title">Escenas</div>
                    <div class="scene-grid" id="scene-grid"></div>
                    <div class="dvd-menu-item submenu-back-btn" role="button" tabindex="0" data-action="back">Volver</div>
                </div>

                <div class="dvd-submenu" id="submenu-specials">
                    <div class="submenu-title">Características Especiales</div>
                    <div>
                        <div class="coming-soon">Próximamente</div>
                        <div class="coming-soon-desc">Material extra, detrás de escena y más.</div>
                    </div>
                    <div class="dvd-menu-item submenu-back-btn" role="button" tabindex="0" data-action="back">Volver</div>
                </div>

                <div class="dvd-submenu" id="submenu-languages">
                    <div class="submenu-title">Idiomas</div>
                    <div>
                        <div class="coming-soon">Próximamente</div>
                        <div class="coming-soon-desc">Audio y subtítulos en otros idiomas.</div>
                    </div>
                    <div class="dvd-menu-item submenu-back-btn" role="button" tabindex="0" data-action="back">Volver</div>
                </div>
            </div>
        </div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="player-view">
        <div class="player-top-bar ui-fade">
            <button class="player-ui-btn" id="btn-back">&larr; Menú</button>
            <span id="player-title"></span>
        </div>
        <media-controller>
            <mux-video
                id="mux-player"
                slot="media"
                stream-type="on-demand"
                autoplay
                playsinline
                crossorigin
            ></mux-video>
        </media-controller>
        <div class="custom-controls ui-fade" id="custom-controls">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="controls-row">
                <button class="control-btn" id="play-btn" aria-label="Play/Pausa">
                    <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="control-btn" id="backward-btn" aria-label="Retroceder 10s">
                    <svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
                <button class="control-btn" id="forward-btn" aria-label="Adelantar 10s">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
                </button>
                <button class="control-btn" id="prev-btn" aria-label="Escena anterior">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="control-btn" id="next-btn" aria-label="Escena siguiente">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <span class="time-display" id="time-display">0:00 / 0:00</span>
                <button class="control-btn" id="mute-btn" aria-label="Silenciar/Activar sonido">
                    <svg viewBox="0 0 24 24" id="volume-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </button>
                <button class="control-btn" id="fullscreen-btn" aria-label="Pantalla completa">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const PLAYBACK_ID = 'Zt024bfBG5LGLnsYHY9VrMe2LbvRlInCPZBlGnhTrEWU';
        const MOVIE_TITLE = 'Detrás de las Risas';

        // start = segundo de inicio de cada escena; thumb = segundo desde el cual se muestra la miniatura animada.
        const SCENES = [
            { title: 'Orígenes',  start: 0,    thumb: 80 },    // 0:00 / 1:20
            { title: 'Pandemia',  start: 572,  thumb: 602 },   // 9:32 / 10:02
            { title: 'Cine',      start: 818,  thumb: 848 },   // 13:38 / 14:08
            { title: 'Ascensor',  start: 1047, thumb: 1077 },  // 17:27 / 17:57
            { title: 'Tech',      start: 1118, thumb: 1118 },  // 18:38
            { title: 'Cierre',    start: 1480, thumb: 1480 },  // 24:40
        ];

        const dvdContainer = document.getElementById('dvd-container');
        const playerView = document.getElementById('player-view');
        const player = document.getElementById('mux-player');
        const mainMenu = document.getElementById('main-dvd-menu');
        const submenus = {
            scenes: document.getElementById('submenu-scenes'),
            specials: document.getElementById('submenu-specials'),
            languages: document.getElementById('submenu-languages'),
        };
        let lastSubmenu = null;

        // ── Cortes aleatorios de fondo ──
        const bgPlayers = [document.getElementById('bg-player-1'), document.getElementById('bg-player-2')];
        const BG_MAX_START = 1440; // la película dura más que el inicio de "Cierre"
        let bgIndex = 0;
        let bgTimer = null;

        function playRandomBgClip() {
            const prev = bgPlayers[bgIndex];
            bgIndex = (bgIndex + 1) % 2;
            const next = bgPlayers[bgIndex];
            const startTime = Math.floor(Math.random() * (BG_MAX_START - 5)) + 5;

            if (next.getAttribute('playback-id') !== PLAYBACK_ID) next.setAttribute('playback-id', PLAYBACK_ID);
            next.setAttribute('start-time', startTime);
            next.muted = true;
            next.volume = 0;

            const swap = () => {
                next.classList.add('active');
                prev.classList.remove('active');
                prev.pause();
            };
            const p = next.play();
            if (p && typeof p.then === 'function') p.then(swap).catch(swap);
            else swap();
        }
        function startBackground() {
            clearInterval(bgTimer);
            playRandomBgClip();
            bgTimer = setInterval(playRandomBgClip, 8000);
            startBounce();
        }
        function stopBackground() {
            clearInterval(bgTimer);
            bgTimer = null;
            bgPlayers.forEach(p => { p.pause(); p.classList.remove('active'); });
            stopBounce();
        }

        // ── Logo rebotando estilo DVD (velocidad constante, sin física) ──
        const bounceLogo = document.getElementById('bounce-logo');
        const BOUNCE_SPEED = 110; // px/s por eje
        let bx = 40, by = 40, vx = BOUNCE_SPEED, vy = BOUNCE_SPEED;
        let bounceRaf = null, bounceLast = 0;

        function bounceStep(now) {
            const dt = Math.min((now - bounceLast) / 1000, 0.1);
            bounceLast = now;
            const maxX = dvdContainer.clientWidth - bounceLogo.offsetWidth;
            const maxY = dvdContainer.clientHeight - bounceLogo.offsetHeight;
            bx += vx * dt;
            by += vy * dt;
            if (bx <= 0) { bx = 0; vx = Math.abs(vx); }
            else if (bx >= maxX) { bx = Math.max(maxX, 0); vx = -Math.abs(vx); }
            if (by <= 0) { by = 0; vy = Math.abs(vy); }
            else if (by >= maxY) { by = Math.max(maxY, 0); vy = -Math.abs(vy); }
            bounceLogo.style.transform = `translate(${bx}px, ${by}px)`;
            bounceRaf = requestAnimationFrame(bounceStep);
        }
        function startBounce() {
            if (bounceRaf) return;
            bounceLast = performance.now();
            bounceRaf = requestAnimationFrame(bounceStep);
        }
        function stopBounce() {
            cancelAnimationFrame(bounceRaf);
            bounceRaf = null;
        }

        // ── Menú ──
        function activate(el, fn) {
            el.addEventListener('click', fn);
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
            });
        }
        function showSubmenu(name) {
            mainMenu.style.display = 'none';
            Object.values(submenus).forEach(s => s.style.display = 'none');
            submenus[name].style.display = 'flex';
            lastSubmenu = name;
        }
        function showMainMenu() {
            Object.values(submenus).forEach(s => s.style.display = 'none');
            mainMenu.style.display = 'flex';
            lastSubmenu = null;
        }

        activate(document.getElementById('menu-play'), () => playMovie(0));
        activate(document.getElementById('menu-scenes'), () => showSubmenu('scenes'));
        activate(document.getElementById('menu-specials'), () => showSubmenu('specials'));
        activate(document.getElementById('menu-languages'), () => showSubmenu('languages'));
        document.querySelectorAll('[data-action="back"]').forEach(el => activate(el, showMainMenu));

        // ── Escenas ──
        const sceneGrid = document.getElementById('scene-grid');
        sceneGrid.innerHTML = SCENES.map((s, i) => {
            const from = s.thumb;
            const base = `https://image.mux.com/${PLAYBACK_ID}`;
            const still = `${base}/thumbnail.png?width=640&time=${from}`;
            const gif = `${base}/animated.gif?width=320&start=${from}&end=${from + 6}&fps=8`;
            return `
                <div class="scene-card" data-index="${i}" role="button" tabindex="0" aria-label="Ir a la escena ${s.title}">
                    <img class="scene-thumb" src="${gif}" alt="${s.title}" loading="lazy"
                         onerror="this.onerror=null;this.src='${still}'" />
                    <div class="scene-info">
                        <div class="scene-num">Escena ${i + 1}</div>
                        <div class="scene-title">${s.title}</div>
                    </div>
                </div>`;
        }).join('');
        sceneGrid.querySelectorAll('.scene-card').forEach(card => {
            activate(card, () => playMovie(SCENES[+card.dataset.index].start || 0, +card.dataset.index));
        });

        // ── Reproductor ──
        const btnBack = document.getElementById('btn-back');
        const titleEl = document.getElementById('player-title');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeIcon = document.getElementById('volume-icon');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const timeDisplay = document.getElementById('time-display');

        function formatTime(s) {
            if (!isFinite(s)) return '0:00';
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
        }
        function markedScenes() {
            return SCENES.map((s, i) => ({ ...s, index: i })).filter(s => s.start != null);
        }
        function currentScene() {
            const t = player.currentTime || 0;
            const marked = markedScenes().filter(s => s.start <= t + 0.5);
            return marked.length ? marked[marked.length - 1] : null;
        }
        function updateTitle() {
            const sc = currentScene();
            titleEl.textContent = sc ? `${MOVIE_TITLE} — ${sc.title}` : MOVIE_TITLE;
        }
        function updateProgress() {
            const d = player.duration;
            progressBar.style.width = ((player.currentTime / d) * 100 || 0) + '%';
            timeDisplay.textContent = `${formatTime(player.currentTime)} / ${formatTime(d)}`;
            updateTitle();
        }
        function renderMarkers() {
            progressContainer.querySelectorAll('.scene-marker').forEach(m => m.remove());
            const d = player.duration;
            if (!isFinite(d) || !d) return;
            markedScenes().forEach(s => {
                if (s.start <= 0) return;
                const m = document.createElement('div');
                m.className = 'scene-marker';
                m.style.left = (s.start / d * 100) + '%';
                m.title = s.title;
                progressContainer.appendChild(m);
            });
        }
        function updatePlayIcon() {
            playIcon.innerHTML = player.paused
                ? '<path d="M8 5v14l11-7z"/>'
                : '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
        }
        function updateVolumeIcon() {
            volumeIcon.innerHTML = player.muted
                ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
                : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
        }

        function seekTo(t) {
            if (player.readyState > 0) player.currentTime = t;
            else player.addEventListener('loadedmetadata', () => { player.currentTime = t; }, { once: true });
        }

        function playMovie(startAt = 0) {
            stopBackground();
            dvdContainer.style.display = 'none';
            playerView.classList.add('active');
            if (player.getAttribute('playback-id') !== PLAYBACK_ID) {
                player.setAttribute('metadata-video-title', MOVIE_TITLE);
                player.setAttribute('playback-id', PLAYBACK_ID);
            }
            player.autoplay = true;
            if (startAt > 0 || player.currentTime > 0) seekTo(startAt);
            const p = player.play();
            if (p && typeof p.then === 'function') p.catch(() => {});
            updateTitle();
            showUI();
        }

        function exitToMenu() {
            player.pause();
            playerView.classList.remove('active');
            clearTimeout(uiTimer);
            if (document.fullscreenElement) document.exitFullscreen?.();
            dvdContainer.style.display = 'flex';
            startBackground();
        }

        function jumpScene(dir) {
            const marked = markedScenes();
            if (!marked.length) return;
            const t = player.currentTime || 0;
            if (dir > 0) {
                const next = marked.find(s => s.start > t + 0.5);
                if (next) player.currentTime = next.start;
            } else {
                const earlier = marked.filter(s => s.start < t - 3);
                player.currentTime = earlier.length ? earlier[earlier.length - 1].start : 0;
            }
        }

        playBtn.addEventListener('click', () => { player.paused ? player.play() : player.pause(); });
        document.getElementById('backward-btn').addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 10); });
        document.getElementById('forward-btn').addEventListener('click', () => { player.currentTime = Math.min(player.duration || 0, player.currentTime + 10); });
        document.getElementById('prev-btn').addEventListener('click', () => jumpScene(-1));
        document.getElementById('next-btn').addEventListener('click', () => jumpScene(1));
        document.getElementById('mute-btn').addEventListener('click', () => { player.muted = !player.muted; updateVolumeIcon(); });
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) (playerView.requestFullscreen || playerView.webkitRequestFullscreen)?.call(playerView);
            else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        });
        progressContainer.addEventListener('click', e => {
            const rect = progressContainer.getBoundingClientRect();
            if (isFinite(player.duration)) player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
        });
        btnBack.addEventListener('click', exitToMenu);

        player.addEventListener('play', updatePlayIcon);
        player.addEventListener('pause', updatePlayIcon);
        player.addEventListener('timeupdate', updateProgress);
        player.addEventListener('loadedmetadata', () => { updateProgress(); renderMarkers(); });
        player.addEventListener('durationchange', renderMarkers);
        player.addEventListener('volumechange', updateVolumeIcon);
        player.addEventListener('ended', exitToMenu);

        document.addEventListener('keydown', e => {
            if (playerView.classList.contains('active')) {
                if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
                else if (e.key === 'ArrowLeft') document.getElementById('backward-btn').click();
                else if (e.key === 'ArrowRight') document.getElementById('forward-btn').click();
                else if (e.key === 'Escape' && !document.fullscreenElement) exitToMenu();
                showUI();
            } else if (e.key === 'Escape' && lastSubmenu) {
                showMainMenu();
            }
        });

        // ── UI fade ──
        let uiTimer;
        function showUI() {
            playerView.querySelectorAll('.ui-fade').forEach(el => el.classList.remove('hidden'));
            clearTimeout(uiTimer);
            uiTimer = setTimeout(() => {
                playerView.querySelectorAll('.ui-fade').forEach(el => el.classList.add('hidden'));
            }, 3000);
        }
        ['mousemove', 'touchstart', 'click'].forEach(ev => playerView.addEventListener(ev, showUI));

        startBackground();
    </script>
</body>
</html>
