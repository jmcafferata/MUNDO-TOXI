<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>TOXI Media</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>
      // Only redirect /project/* paths to Webflow; keep toxi.media root on this page.
      (function() {
        const { pathname, search, hash } = window.location;
        if (pathname.startsWith('/project/')) {
          window.location.replace(`https://toxii.webflow.io${pathname}${search}${hash}`);
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/env.js"></script>
  </head>
  <body>
    <style>
        .modal-content, .paywall-card, .keypad-card, .keypad-btn, button, input {
            font-family: 'Helvetica Now', 'Helvetica', 'Arial', sans-serif !important;
        }
    </style>

    <div id="app"></div>

    <!-- Poster Loop Overlay -->
    <div id="poster-overlay-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; align-items: center; justify-content: center; z-index: 90; pointer-events: none; padding: 40px; box-sizing: border-box; transition: opacity 1s ease-in-out;">
        <div id="poster-wrapper" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform: scale(0.95); pointer-events: none;">
            <img 
                id="looping-poster-img"
                src="" 
                alt="Poster" 
                style="max-width: 1280px; width: 100%; height: auto; max-height: 100vh; object-fit: scale-down; cursor: pointer; pointer-events: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: transform 0.3s ease;"
                onmouseover="this.style.transform='scale(1.02)'"
                onmouseout="this.style.transform='scale(1)'"
            />
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('poster-overlay-container');
            const wrapper = document.getElementById('poster-wrapper');
            const img = document.getElementById('looping-poster-img');
            
            const posters = [
                { src: 'hotel%20oriente%20poster.jpg', link: 'hotel-oriente.html' },
                { src: 'detective%20no%20ir%20poster.jpg', link: 'detective-noir.html' }
            ];
            
            let currentIndex = 0;

            const INITIAL_DELAY = 10000;
            const DISPLAY_DURATION = 10000;
            const HIDDEN_DURATION = 10000;

            function updateContent() {
                const p = posters[currentIndex];
                img.src = p.src;
                img.onclick = () => window.location.href = p.link;
            }

            // Set initial content
            updateContent();

            function show() {
                container.style.display = 'flex';
                // Trigger reflow to ensure transition happens
                container.offsetHeight; 
                container.style.opacity = '1';

                // Start scale animation
                wrapper.style.transition = 'transform 10s ease-out';
                wrapper.style.transform = 'scale(1)';

                setTimeout(hide, DISPLAY_DURATION);
            }

            function hide() {
                container.style.opacity = '0';
                
                // Wait for transition to finish before hiding display
                setTimeout(() => {
                    container.style.display = 'none';

                    // Reset scale without animation
                    wrapper.style.transition = 'none';
                    wrapper.style.transform = 'scale(0.95)';

                    // Prepare next poster
                    currentIndex = (currentIndex + 1) % posters.length;
                    updateContent();

                    setTimeout(show, HIDDEN_DURATION);
                }, 1000); // Matches transition duration
            }

            // Start the loop
            setTimeout(show, INITIAL_DELAY);
        })();
    </script>


    <!-- Mux Overlay -->
    <div id="mux-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
      <button id="mux-close" style="position: absolute; top: 20px; right: 20px; z-index: 10000; color: white; background: transparent; border: none; font-size: 2rem; cursor: pointer;">&times;</button>
      <video id="mux-player" controls style="width: 100%; height: 100%;"></video>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="video-title"></h2>
        <div class="video-container">
          <iframe
            id="video-frame"
            width="560"
            height="315"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
        <div id="video-credits" class="credits"></div>
        <div class="modal-footer">
          <p id="release-date"></p>
          <div class="qr-container">
            <img id="qr-code" alt="QR Code" />
            <span>Compartir</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Paywall con Mercado Pago: entrada de $100 ARS válida por 24 horas.
      (function() {
        const ENTRY_STORAGE_KEY = 'toxi_entry_pass';
        const ENTRY_DURATION_MS = 24 * 60 * 60 * 1000; // 24 horas

        function persistEntry() {
          const now = Date.now();
          const payload = { paidAt: now, expiresAt: now + ENTRY_DURATION_MS };
          localStorage.setItem(ENTRY_STORAGE_KEY, JSON.stringify(payload));
        }

        function hasValidEntry() {
          try {
            const raw = localStorage.getItem(ENTRY_STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || typeof data.expiresAt !== 'number') return false;
            if (Date.now() > data.expiresAt) {
              localStorage.removeItem(ENTRY_STORAGE_KEY);
              return false;
            }
            return true;
          } catch (err) {
            localStorage.removeItem(ENTRY_STORAGE_KEY);
            return false;
          }
        }

        const params = new URLSearchParams(window.location.search);

        // Reset Cache Logic
        if (params.get('reset') === 'true') {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
                caches.keys().then((names) => {
                    names.forEach((name) => {
                        caches.delete(name);
                    });
                });
            }
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                    registrations.forEach((registration) => {
                        registration.unregister();
                    });
                });
            }
            console.log('Cache, Storage, and Service Workers reset.');
        }

        const status = (params.get('collection_status') || params.get('status') || '').toLowerCase();
        const paymentApproved = status === 'approved' || status === 'success';

        if (paymentApproved) {
          persistEntry();
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        const paid = hasValidEntry();
        if (!paid) {
          // Redirect to index for payment
          window.location.href = '/';
          return;
        }

        // User is paid/authorized, show the app
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
