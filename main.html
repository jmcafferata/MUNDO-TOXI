  <body>
    <style>
        .modal-content, .paywall-card, .keypad-card, .keypad-btn, button, input {

    <div id="app"></div>

    <!-- Poster Loop Overlay -->
    <div id="poster-overlay-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; align-items: center; justify-content: center; z-index: 90; pointer-events: none; padding: 40px; box-sizing: border-box; transition: opacity 1s ease-in-out;">
        <div id="poster-wrapper" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform: scale(0.95); pointer-events: none; position: relative;">
            <img 
                id="looping-poster-img"
                src="" 
                alt="Poster" 
                style="width: 100%; height: 100%; object-fit: contain; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 0 20px rgba(0,0,0,0.5)); transition: transform 0.3s ease; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;"
                onmouseover="this.style.transform='translate(-50%, -50%) scale(1.02)'"
                onmouseout="this.style.transform='translate(-50%, -50%) scale(1)'"
            />
            <img 
                id="looping-poster-overlay"
                src="" 
                alt="" 
                style="width: 100%; height: 100%; object-fit: contain; pointer-events: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; opacity: 0; transition: opacity 1s ease-in-out;"
            />
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('poster-overlay-container');
            const wrapper = document.getElementById('poster-wrapper');
            const img = document.getElementById('looping-poster-img');
            const overlay = document.getElementById('looping-poster-overlay');
            
            let posters = [
                { src: 'we%20will%20rock%20you%20poster.jpg', link: 'we-will-rock-you.html', id: 'we-will-rock-you' },
                { src: 'hotel%20oriente%20poster.jpg', link: 'hotel-oriente.html', id: 'hotel' },
                { src: 'detective%20no%20ir%20poster.jpg', link: 'detective-noir.html', id: 'detective' }
            ];

            // Reorder based on entry code
            try {
                const rawEntry = localStorage.getItem('toxi_entry_pass');
                if (rawEntry) {
                    const entry = JSON.parse(rawEntry);
                    if (entry && entry.entryCode === '1985') {
                        // Move Detective Noir to first position if found
                        const idx = posters.findIndex(p => p.id === 'detective');
                        if (idx > -1) {
                            const [item] = posters.splice(idx, 1);
                            posters.unshift(item);
                        }
                        console.log('Order: Detective First (1985)');
                    } else {
                         // Default -> Keep default order (Newest First)
                         console.log('Order: Default');
                    }
                }
            } catch (e) {
                console.warn('Error reading entry code', e);
            }
            
            let currentIndex = 0;

            const INITIAL_DELAY = 10000;
            const DISPLAY_DURATION = 10000;
            const HIDDEN_DURATION = 10000;

            function updateContent() {
                const p = posters[currentIndex];
                img.src = p.src;
                img.onclick = () => window.location.href = p.link;
                
                // Overlay Logic
                if (p.id === 'detective') {
                    overlay.src = 'detective-noir-premios.jpeg';
                } else if (p.id === 'we-will-rock-you') {
                    overlay.src = 'we%20will%20rock%20you%20premios.jpeg';
                } else if (p.id === 'hotel') {
                    overlay.src = 'hotel%20oriente%20premios.jpg';
                } else {
                    overlay.src = '';
                }
                overlay.style.opacity = '0';
            }

            // Set initial content
            updateContent();

            function show() {
                container.style.display = 'flex';
                // Trigger reflow to ensure transition happens
                container.offsetHeight; 
                container.style.opacity = '1';

                // Start scale animation
                wrapper.style.transition = 'transform 10s ease-out';
                wrapper.style.transform = 'scale(1)';
                
                // Animation for overlay
                const p = posters[currentIndex];
                if (p.id === 'detective' || p.id === 'we-will-rock-you' || p.id === 'hotel') {
                    // Start fade in after 3 seconds
                    setTimeout(() => {
                         // Only if we are still showing this poster loop? 
                         // With 3s wait + 1s fade, it's 4s total. DISPLAY_DURATION is 10s. Safe.
                         // But ensure container is still visible (it controls the loop).
                         if (container.style.display !== 'none') {
                             overlay.style.opacity = '1';
                         }
                    }, 3000);
                }

                setTimeout(hide, DISPLAY_DURATION);
            }

            function hide() {
                container.style.opacity = '0';
                
                // Wait for transition to finish before hiding display
                setTimeout(() => {
                    container.style.display = 'none';

                    // Reset scale without animation
                    wrapper.style.transition = 'none';
                    wrapper.style.transform = 'scale(0.95)';

                    // Prepare next poster
                    currentIndex = (currentIndex + 1) % posters.length;
                    updateContent();

                    setTimeout(show, HIDDEN_DURATION);
                }, 1000); // Matches transition duration
            }

            // Start the loop
            setTimeout(show, INITIAL_DELAY);
        })();
    </script>


    <!-- Mux Overlay -->
    <div id="mux-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">

      </div>

    <script>
      // Paywall con Mercado Pago: entrada de $100 ARS válida por 24 horas.
      (function() {
        const ENTRY_STORAGE_KEY = 'toxi_entry_pass';
        const ENTRY_DURATION_MS = 24 * 60 * 60 * 1000; // 24 horas

        function persistEntry() {
          const now = Date.now();
          const payload = { paidAt: now, expiresAt: now + ENTRY_DURATION_MS };
          localStorage.setItem(ENTRY_STORAGE_KEY, JSON.stringify(payload));
        }

        function hasValidEntry() {
          try {
            const raw = localStorage.getItem(ENTRY_STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || typeof data.expiresAt !== 'number') return false;
            if (Date.now() > data.expiresAt) {
              localStorage.removeItem(ENTRY_STORAGE_KEY);
              return false;
            }
            return true;
          } catch (err) {
            localStorage.removeItem(ENTRY_STORAGE_KEY);
            return false;
          }
        }

        const params = new URLSearchParams(window.location.search);

        // Reset Cache Logic
        if (params.get('reset') === 'true') {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
                caches.keys().then((names) => {
                    names.forEach((name) => {
                        caches.delete(name);
                    });
                });
            }
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                    registrations.forEach((registration) => {
                        registration.unregister();
                    });
                });
            }
            console.log('Cache, Storage, and Service Workers reset.');
        }

        const status = (params.get('collection_status') || params.get('status') || '').toLowerCase();
        const paymentApproved = status === 'approved' || status === 'success';

        if (paymentApproved) {
          persistEntry();
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        const paid = hasValidEntry();
        if (!paid) {
          // Redirect to index for payment
          window.location.href = '/';
          return;
        }

        // User is paid/authorized, show the app
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </body>
