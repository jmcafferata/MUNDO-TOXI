    function parseDimensions(dimStr) {
      if (!dimStr) return { w: 1, h: 1 };
      let str = dimStr.toLowerCase().replace('(aprox.)', '').trim();
      if (str === 'a4') return { w: 0.21, h: 0.297 };
      if (str === 'a3') return { w: 0.297, h: 0.42 };
      let match = str.match(/([\d\.]+)\s*x\s*([\d\.]+)\s*(m|cm)/);
      if (match) {
        let w = parseFloat(match[1]);
        let h = parseFloat(match[2]);
        let unit = match[3];
        if (unit === 'cm') { w /= 100; h /= 100; }
        return { w: w, h: h };
      }
      return { w: 1, h: 1 }; 
    }

    AFRAME.registerShader('world-vignette', {
      schema: {
        color: { type: 'color', default: '#000000' },
        radius: { type: 'number', default: 5 },
        fade: { type: 'number', default: 5 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        precision mediump float;
        varying vec3 vWorldPosition;
        uniform vec3 color;
        uniform float radius;
        uniform float fade;

        void main() {
          float dist = length(vWorldPosition);
          float alpha = smoothstep(radius, radius + fade, dist);
          gl_FragColor = vec4(color, alpha);
        }
      `
    });

    // Componente para conservar el aspecto real de las fotos
    AFRAME.registerComponent('keep-aspect-ratio', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          const map = this.el.getObject3D('mesh').material.map;
          if (map && map.image) {
            const aspect = map.image.width / map.image.height;
            const width = parseFloat(this.el.getAttribute('width'));
            const correctHeight = width / aspect;
            
            this.el.setAttribute('height', correctHeight);

            const parent = this.el.parentNode;
            const textEl = parent.querySelector('a-text');
            if (textEl) {
              const textYPos = -(correctHeight / 2) - 0.2;
              textEl.setAttribute('position', `0 ${textYPos} 0`);
            }
          }
        });
      }
    });

  // COMPONENTE CORREGIDO: Pinch con "Cooldown" anti-rebote
AFRAME.registerComponent('pinch-toggle', {
  init: function () {
    this.lastPinchTime = 0; // Guarda en qué momento fue el último pellizco
    this.cooldown = 800;    // Ignora otros pellizcos por 800 milisegundos (0.8 segundos)

    this.el.addEventListener('pinchstarted', () => {
      const now = Date.now();
      
      // Si ya pasaron más de 800ms desde el último pellizco...
      if (now - this.lastPinchTime > this.cooldown) {
        this.lastPinchTime = now; // Actualizamos el reloj
        
        // Disparamos la señal de frenar/avanzar
        window.dispatchEvent(new Event('toggle-movement'));
      }
    });
  }
});
    // COMPONENTE: Movimiento automático con Smooth Toggle
    AFRAME.registerComponent('auto-move-loop', {
      schema: { speed: { type: 'number', default: 0.6 } }, 
      
      init: function () {
        this.direction = -1; 
        this.startZ = 0;
        
        this.currentSpeed = this.data.speed;
        this.targetSpeed = this.data.speed;
        this.isMoving = true;

        window.addEventListener('toggle-movement', () => {
          if (this.isMoving) {
            this.targetSpeed = 0; // Frena
            this.isMoving = false;
          } else {
            this.targetSpeed = this.data.speed; // Avanza
            this.isMoving = true;
          }
        });
      },
      
      tick: function (time, delta) {
        // Barrera de seguridad para que la cámara no se vaya al infinito (NaN)
        if (!time || !delta) return; 

        if (delta > 50) delta = 50; 

        // Interpolar la velocidad suavemente (Lerp)
        const lerpFactor = delta * 0.005; 
        this.currentSpeed += (this.targetSpeed - this.currentSpeed) * lerpFactor;

        // Freno total para evitar vibraciones minúsculas
        if (Math.abs(this.currentSpeed) < 0.001) {
          this.currentSpeed = 0;
        }

        if (this.currentSpeed === 0 && this.targetSpeed === 0) return;

        const el = this.el;
        const pos = el.getAttribute('position');
        
        // Segunda barrera por si la posición se corrompe
        if (isNaN(pos.z)) pos.z = this.startZ;

        const endZ = window.corridorEndZ || -50; 
        const padding = 3; 

        const step = (delta / 1000) * this.currentSpeed * this.direction;
        pos.z += step;
        
        if (pos.z < (endZ - padding)) {
          pos.z = endZ - padding;
          this.direction = 1; 
        } else if (pos.z > this.startZ) {
          pos.z = this.startZ;
          this.direction = -1; 
        }
        
        el.setAttribute('position', pos);
      }
    });

    // Generador en formato Pasillo Recto
    AFRAME.registerComponent('spawn-corridor', {
      init: function () {
        const container = this.el;
        const corridorWidth = 1.6; 
        const zSpacing = 3;      
        const startZ = -4;       
        
        window.corridorEndZ = startZ; 
        
        obrasDB.forEach((obra, i) => {
          const pairIndex = Math.floor(i / 2);
          const isLeft = (i % 2 === 0);
          const zPos = startZ - (pairIndex * zSpacing);
          const xPos = isLeft ? -corridorWidth : corridorWidth;
          const rotationY = isLeft ? 90 : -90;

          const yOffset = 1.7 + ((Math.random() - 0.5) * 0.4);

          const obraEntity = document.createElement('a-entity');
          obraEntity.setAttribute('position', `${xPos} ${yOffset} ${zPos}`);
          obraEntity.setAttribute('rotation', `0 ${rotationY} 0`);

          const plane = document.createElement('a-image');
          const dims = parseDimensions(obra.dimensions);
          
          plane.setAttribute('width', dims.w);
          plane.setAttribute('height', dims.h);
          plane.setAttribute('src', '/vr-obras/' + obra.file);
          plane.setAttribute('material', 'shader: flat; transparent: true;');
          plane.setAttribute('keep-aspect-ratio', '');

          obraEntity.appendChild(plane);
          container.appendChild(obraEntity);

          if (zPos < window.corridorEndZ) {
            window.corridorEndZ = zPos;
          }
        });
      }
    });

<body>
  <audio id="ambience" src="/vr-obras/ambience.mp3" loop preload="auto"></audio>
  <script>
    (function () {
      const a = document.getElementById('ambience');
      a.volume = 0.6;
      const events = ['click', 'touchstart', 'keydown', 'pointerdown'];
      const start = () => a.play().then(() => {
        events.forEach(e => window.removeEventListener(e, start));
      }).catch(() => {});
      start();
      events.forEach(e => window.addEventListener(e, start));
      window.addEventListener('load', () => {
        const s = document.querySelector('a-scene');
        if (s) s.addEventListener('enter-vr', start);
      });
    })();
  </script>
  <a-scene 
    fog="type: exponential; color: #000000; density: 0.035"
    webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, bounded-floor, hand-tracking;">
    
    <a-sky color="#000000"></a-sky>

    <a-sphere
      position="0 1.6 0"
      radius="12"
      material="shader: world-vignette; color: #000000; radius: 5; fade: 5; side: back; transparent: true; opacity: 1;">
    </a-sphere>

    <!-- Generador del pasillo de obras -->
    <a-entity spawn-corridor></a-entity>

    <!-- Usuario (Cámara y Manos) que avanza y retrocede -->
    <a-entity id="rig" position="0 0 0" auto-move-loop="speed: 0.6">
      <a-camera look-controls="magicWindowTrackingEnabled: false"></a-camera>
      
      <!-- Habilitamos las manos de WebXR y les agregamos nuestro detector de Pinch -->
<!-- Habilitamos las manos de WebXR y las hacemos INVISIBLES -->
      <a-entity hand-tracking-controls="hand: left" pinch-toggle visible="false"></a-entity>
      <a-entity hand-tracking-controls="hand: right" pinch-toggle visible="false"></a-entity>
        </a-entity>
    
  </a-scene>
</body>
