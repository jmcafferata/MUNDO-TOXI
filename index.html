<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>TOXI Media</title>
    <script>
      // Redirect any /project/* path to the matching Webflow URL, otherwise send to project home.
      (function() {
        const { pathname, search, hash } = window.location;
        if (pathname.startsWith('/project/')) {
          window.location.replace(`https://toxii.webflow.io${pathname}${search}${hash}`);
        } else {
          window.location.replace('https://toxii.webflow.io/project/');
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="video-title"></h2>
        <div class="video-container">
          <iframe
            id="video-frame"
            width="560"
            height="315"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
        <div id="video-credits" class="credits"></div>
        <div class="modal-footer">
          <p id="release-date"></p>
          <div class="qr-container">
            <img id="qr-code" alt="QR Code" />
            <span>Compartir</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
