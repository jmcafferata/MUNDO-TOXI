<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>TOXI Media - Descargar App</title>
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      .app-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
        color: #fff;
        font-family: 'Helvetica Now', sans-serif;
        text-align: center;
        padding: 24px;
      }

      .app-success-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00ff88 0%, #8cffd9 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
      }

      .app-success-icon svg {
        width: 40px;
        height: 40px;
        color: #000;
      }

      .app-title {
        font-size: 32px;
        font-weight: bold;
        margin: 0 0 16px;
        letter-spacing: 1px;
      }

      .app-subtitle {
        font-size: 16px;
        color: #cfcfcf;
        margin: 0 0 40px;
        max-width: 400px;
        line-height: 1.5;
      }

      .app-download-btn {
        padding: 18px 48px;
        border-radius: 50px;
        border: none;
        background: linear-gradient(135deg, #ffffff 0%, #9ae6ff 100%);
        color: #000;
        font-family: 'Helvetica Now', sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .app-download-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(255, 255, 255, 0.25);
      }

      .app-download-btn:active {
        transform: translateY(0);
      }

      .app-note {
        margin-top: 24px;
        font-size: 12px;
        color: #888;
      }

      .app-back-link {
        margin-top: 40px;
        color: #666;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .app-back-link:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="app-success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="app-title">¡Compra exitosa!</h1>
      <p class="app-subtitle">Gracias por tu compra. Ya podés descargar la aplicación de TOXI Media.</p>
      <a href="#" class="app-download-btn" id="download-btn">DESCARGAR APP</a>
      <p class="app-note">Compatible con iOS y Android</p>
      <a href="/" class="app-back-link">← Volver al inicio</a>
    </div>

    <script>
      let deferredPrompt;
      const downloadBtn = document.getElementById('download-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      downloadBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Usuario eligió: ${outcome}`);
          deferredPrompt = null;
        } else {
          alert('Para instalar la app:\n\n• En iOS: Tocá el botón "Compartir" y luego "Agregar a pantalla de inicio"\n\n• En Android: Buscá el ícono de instalación en la barra de direcciones o en el menú del navegador');
        }
      });

      window.addEventListener('appinstalled', () => {
        console.log('PWA instalada correctamente');
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
