<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>TOXI TV</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background: #000; }
        cast-media-player {
            --theme-hue: 0;
            --splash-image: url('/toxi-logo-white.png');
            --splash-size: 120px;
            --background-image: none;
        }
        #dbg {
            position: fixed; top: 20px; left: 20px; right: 20px;
            color: #fff; font: bold 28px monospace;
            background: rgba(0,0,0,0.8); padding: 20px;
            z-index: 9999; word-break: break-all;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <div id="dbg">Receiver iniciado, esperando LOAD...</div>
    <script>
        const dbg = document.getElementById('dbg');
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        let loadedUrl = '';
        let loadedT = 0;

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            request => {
                const media = request.media;
                if (!media) { dbg.textContent = 'LOAD: media null'; return request; }
                const url = (media.contentUrl || media.contentId || '').replace('.m3u8', '.mpd');
                media.contentUrl = url;
                media.contentType = 'application/dash+xml';
                delete media.hlsVideoSegmentFormat;
                delete media.hlsAudioSegmentFormat;
                dbg.textContent = 'LOAD DASH\n' + url;
                return request;
            }
        );

        playerManager.addEventListener(
            cast.framework.events.EventType.BUFFERING,
            e => { if (dbg.style.display !== 'none') dbg.textContent += '\nBUFFERING=' + e.isBuffering; }
        );

        playerManager.addEventListener(
            cast.framework.events.EventType.ERROR,
            e => {
                dbg.style.display = '';
                dbg.textContent = 'ERROR code=' + e.detailedErrorCode + '\n' + JSON.stringify(e.error);
            }
        );

        playerManager.addEventListener(
            cast.framework.events.EventType.PLAYING,
            () => { dbg.style.display = 'none'; }
        );

        setInterval(() => {
            if (dbg.style.display === 'none') return;
            const state = playerManager.getState();
            dbg.textContent = dbg.textContent.split('\n').slice(0, 3).join('\n') + '\nstate=' + state;
        }, 3000);

        context.start();
    </script>
</body>
</html>
