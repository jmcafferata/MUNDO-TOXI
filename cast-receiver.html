<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>TOXI TV</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background: #000; }
        cast-media-player {
            --theme-hue: 0;
            --splash-image: url('/toxi-logo-white.png');
            --splash-size: 120px;
            --background-image: none;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // Forzar contentType correcto para streams HLS de Mux (fMP4/CMAF)
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            request => {
                const media = request.media;
                const url = media && (media.contentUrl || media.contentId);
                if (url && url.includes('.m3u8')) {
                    media.contentType = 'application/x-mpegURL';
                    media.hlsSegmentFormat = cast.framework.messages.HlsSegmentFormat.FMP4;
                }
                return request;
            }
        );

        context.start();
    </script>
</body>
</html>
