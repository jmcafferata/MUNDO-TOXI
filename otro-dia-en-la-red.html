<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otro Día en la Red - TOXI Media</title>
    <meta name="description" content="Otro Día en la Red — serie de TOXI Media." />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        @font-face {
            font-family: 'Helvetica Now';
            src: url('/HelveticaNowDisplay-Bold.otf') format('opentype');
            font-weight: bold;
        }
        @font-face {
            font-family: 'Helvetica Now';
            src: url('/HelveticaNowDisplay-Light.otf') format('opentype');
            font-weight: 300;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Now', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 300;
            min-height: 100vh;
        }

        /* ── GRID VIEW ── */
        #grid-view {
            display: block;
        }

        .grid-header {
            padding: 28px 40px 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .back-link {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }

        .series-hero {
            padding: 40px 40px 28px;
        }
        .series-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }
        .series-title {
            font-weight: bold;
            font-size: clamp(2rem, 6vw, 4rem);
            letter-spacing: -0.01em;
            line-height: 1;
            margin-bottom: 10px;
        }
        .series-desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.45);
            max-width: 560px;
            line-height: 1.6;
        }

        .season-block {
            padding: 0 40px 48px;
        }
        .season-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .ep-card {
            cursor: pointer;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.06);
            transition: border-color 0.2s, transform 0.2s;
        }
        .ep-card:hover {
            border-color: rgba(255,255,255,0.35);
            transform: scale(1.02);
        }
        .ep-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .ep-info {
            padding: 10px 12px 14px;
        }
        .ep-num {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 4px;
        }
        .ep-title {
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.3;
        }
        .ep-duration {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .series-hero, .season-block, .grid-header { padding-left: 20px; padding-right: 20px; }
            .episode-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        }

        /* ── PLAYER VIEW ── */
        #player-view {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
        }
        #player-view.active { display: flex; flex-direction: column; }

        #mux-player {
            width: 100%;
            flex: 1;
            --media-object-fit: contain;
            --media-background-color: #000;
            --media-icon-color: #fff;
            --media-accent-color: #fff;
        }

        .player-ui-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
        }
        .player-ui-btn:hover {
            border-color: rgba(255,255,255,0.8);
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .player-top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 110;
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: none;
        }
        .player-top-bar > * { pointer-events: auto; }

        #player-ep-title {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
        }

        .ui-fade {
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .ui-fade.hidden {
            opacity: 0;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- GRID VIEW -->
    <div id="grid-view">
        <div class="grid-header">
            <a href="/main.html" class="back-link">&larr; Volver</a>
        </div>

        <div class="series-hero">
            <div class="series-label">Serie · TOXI Media</div>
            <h1 class="series-title">Otro Día<br>en la Red</h1>
            <p class="series-desc">Crónicas del mundo online: política, cultura, memes y la vida que transcurre detrás de la pantalla.</p>
        </div>

        <div class="season-block">
            <div class="season-label">Temporada 1</div>
            <div class="episode-grid" id="season-1-grid"></div>
        </div>

        <div class="season-block">
            <div class="season-label">Temporada 2</div>
            <div class="episode-grid" id="season-2-grid"></div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <div id="player-view">
        <div class="player-top-bar ui-fade">
            <button class="player-ui-btn" id="btn-back-to-grid">&larr; Episodios</button>
            <span id="player-ep-title"></span>
        </div>
        <mux-player
            id="mux-player"
            stream-type="on-demand"
            autoplay
        ></mux-player>
    </div>

    <script>
        const SEASONS = [
            {
                id: 1,
                episodes: [
                    { num: '0',  id: 'QUElHo8r5HtNqfh02XfGKm85jUJ01iTGbkyn2D4BeYNZI', title: 'Otro Día en la Red 0',                        duration: 189 },
                    { num: '1',  id: 'UiK7a7RjMI2LkEnxUEthecrAk4chE00OPr7ic1Tn9lG4',  title: 'Capítulo 1',                                  duration: 376 },
                    { num: 'III',id: 'K6p6zWxcLOtRXb02eWcic00RYQG8SwDxE014o9007ZTBwm8',title: 'III',                                         duration: 589 },
                    { num: 'IV', id: 'Q3kMlL901ouKhER0101Nzija5Y1025jWBV4ORBXTruuFEyM', title: 'Odelar — IV',                                 duration: 456 },
                    { num: '5',  id: '9pXQ7MUiVlTklMCQdQVdbxoMn85YIC3jObLtzBFN801o',   title: 'Muerte y Miedo en las Calles',                 duration: 137 },
                ]
            },
            {
                id: 2,
                episodes: [
                    { num: '1',  id: 'HRr2KXg2X800YNuos9Aj2LmZe8XIqHvTMgFrGKc7v7wQ',  title: 'Volvé a ODELAR',                              duration: null },
                    { num: '2',  id: '3GyRcAnmXvKxvNVOLwctczd025sw3gYssdSP7X01miwRE', title: 'ODELaR El musical',                           duration: null },
                    { num: '3',  id: 'MLqVMQ4VqD79zGTUP1PQhdq9nmtPndTZPhNp01Q79Yuc',  title: 'Duro de ODELaR',                              duration: null },
                    { num: '4',  id: '3qY2CPrEaeMkGsiL9BjhXOwalP4FMYNjDWTNdZq6Xuc',   title: 'ODELaR sentado',                              duration: null },
                    { num: '5',  id: 'jydbdxb5CFdw3XAeF2CvQJKTo02mHw9fc1HyVkIix3dQ',  title: 'Mood ODELaR',                                 duration: null },
                ]
            }
        ];

        // Flatten all episodes for prev/next navigation
        const ALL_EPISODES = SEASONS.flatMap(s => s.episodes.map(e => ({ ...e, season: s.id })));

        function fmtDuration(s) {
            if (!s) return '';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${String(sec).padStart(2,'0')}`;
        }

        function buildGrid(containerId, episodes, seasonNum) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = episodes.map((ep, i) => `
                <div class="ep-card" data-id="${ep.id}" role="button" tabindex="0"
                     aria-label="Reproducir ${ep.title}">
                    <img class="ep-thumb" 
                         src="https://image.mux.com/${ep.id}/thumbnail.png?width=640&time=5"
                         alt="${ep.title}"
                         loading="lazy" />
                    <div class="ep-info">
                        <div class="ep-num">T${seasonNum} · EP ${ep.num}</div>
                        <div class="ep-title">${ep.title}</div>
                        ${ep.duration ? `<div class="ep-duration">${fmtDuration(ep.duration)}</div>` : ''}
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.ep-card').forEach(card => {
                card.addEventListener('click', () => playEpisode(card.dataset.id));
                card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') playEpisode(card.dataset.id); });
            });
        }

        buildGrid('season-1-grid', SEASONS[0].episodes, 1);
        buildGrid('season-2-grid', SEASONS[1].episodes, 2);

        // ── PLAYER ──
        const gridView = document.getElementById('grid-view');
        const playerView = document.getElementById('player-view');
        const player = document.getElementById('mux-player');
        const btnBack = document.getElementById('btn-back-to-grid');
        const epTitleEl = document.getElementById('player-ep-title');

        function playEpisode(id) {
            const ep = ALL_EPISODES.find(e => e.id === id);
            if (!ep) return;
            player.setAttribute('metadata-video-title', ep.title);
            player.setAttribute('poster', `https://image.mux.com/${id}/thumbnail.png`);
            player.setAttribute('playback-id', id);
            epTitleEl.textContent = `T${ep.season} · EP ${ep.num} — ${ep.title}`;
            gridView.style.display = 'none';
            playerView.classList.add('active');
            setupUIFade();
        }

        btnBack.addEventListener('click', () => {
            player.pause();
            playerView.classList.remove('active');
            gridView.style.display = 'block';
            clearTimeout(uiTimer);
        });

        player.addEventListener('ended', () => {
            const currentId = player.getAttribute('playback-id');
            const idx = ALL_EPISODES.findIndex(e => e.id === currentId);
            if (idx >= 0 && idx < ALL_EPISODES.length - 1) {
                playEpisode(ALL_EPISODES[idx + 1].id);
            } else {
                btnBack.click();
            }
        });

        // ── UI FADE ──
        let uiTimer;
        const uiElements = () => playerView.querySelectorAll('.ui-fade');

        function showUI() {
            uiElements().forEach(el => { el.classList.remove('hidden'); });
            clearTimeout(uiTimer);
            uiTimer = setTimeout(hideUI, 3000);
        }
        function hideUI() {
            uiElements().forEach(el => { el.classList.add('hidden'); });
        }
        function setupUIFade() {
            showUI();
            playerView.addEventListener('mousemove', showUI);
            playerView.addEventListener('touchstart', showUI);
            playerView.addEventListener('click', showUI);
        }
    </script>
</body>
</html>
