<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xplora Night Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #2a0a4a;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255, 120, 220, 0.35), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(80, 0, 180, 0.6), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05), transparent 70%),
                linear-gradient(135deg, #1a0533 0%, #3d0a6e 35%, #6b1fb0 70%, #8a2be2 100%);
            background-attachment: fixed;
            position: relative;
        }
        /* Patrón sutil de puntos */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255, 180, 255, 0.05) 1px, transparent 1.5px);
            background-size: 32px 32px, 64px 64px;
            background-position: 0 0, 16px 16px;
            pointer-events: none;
            z-index: 0;
        }
        /* Brillo móvil sutil */
        body::after {
            content: '';
            position: fixed;
            inset: -20%;
            background: radial-gradient(ellipse at center, rgba(255, 100, 220, 0.18), transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: drift 18s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0%   { transform: translate(-8%, -6%) scale(1); }
            100% { transform: translate(8%, 6%) scale(1.15); }
        }
        .stage {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            --media-background-color: transparent;
        }
        #unmute {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26, 5, 51, 0.55);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.4s ease;
        }
        #unmute.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #unmute .pill {
            padding: 18px 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 120, 220, 0.35), rgba(80, 0, 180, 0.55));
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="stage">
        <mux-player
            id="player"
            autoplay
            muted
            playsinline
        ></mux-player>
    </div>
    <div id="unmute"><div class="pill">▶ Tocar para activar audio</div></div>
    <script>
        const player = document.getElementById('player');
        const overlay = document.getElementById('unmute');

        const LIVE_PLAYBACK_ID = 'LNRUGbgliNpiaJzOIWLIPn801PFMxBFHNKMtvhdvJsms';
        const SOLIFUGOS_PLAYBACK_ID = '201g8UPZlZrwjqOv201VFUrPF7BlSHHnm02LUTEbZ009ZfA';

        function checkHash() {
            if (window.location.hash.toLowerCase() === '#solifugos') {
                player.setAttribute('stream-type', 'on-demand');
                player.setAttribute('controls', 'true');
                player.setAttribute('playback-id', SOLIFUGOS_PLAYBACK_ID);
            } else {
                player.setAttribute('stream-type', 'live');
                player.removeAttribute('controls');
                player.setAttribute('playback-id', LIVE_PLAYBACK_ID);
            }
        }
        // Comprobar al cargar el archivo y al cambiar el hashtag
        checkHash();
        window.addEventListener('hashchange', checkHash);

        function activate() {
            try {
                player.muted = false;
                player.volume = 1;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            overlay.classList.add('hidden');

            // Si entra con #solifugos, reproducir en pantalla completa
            if (window.location.hash.toLowerCase() === '#solifugos') {
                if (player.requestFullscreen) {
                    player.requestFullscreen();
                } else if (player.webkitRequestFullscreen) {
                    player.webkitRequestFullscreen();
                } else if (player.msRequestFullscreen) {
                    player.msRequestFullscreen();
                }
            }
        }
        overlay.addEventListener('click', activate);
        overlay.addEventListener('touchstart', activate, { passive: true });
    </script>
</body>
</html>
