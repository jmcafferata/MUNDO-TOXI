<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERS Vlog</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            --media-object-fit: contain;
            --media-background-color: #000;
            --media-control-bar-height: 64px;
            --media-button-icon-width: 32px;
            --media-button-icon-height: 32px;
            --media-range-thumb-height: 18px;
            --media-range-thumb-width: 18px;
            --media-range-track-height: 6px;
            --media-font-size: 16px;
            --media-text-content-height: 32px;
        }
        mux-player:fullscreen,
        mux-player:-webkit-full-screen {
            --media-object-fit: contain;
        }
        .controls {
            position: fixed;
            inset: 24px 0 auto 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 16px;
            z-index: 10;
            pointer-events: none;
        }
        .controls button {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 20px 32px;
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease, opacity 0.3s ease;
        }
        .controls button:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.75);
        }
        .controls button.hidden {
            display: none;
        }
        .controls .mux-slot-btn,
        .mux-slot-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .controls .mux-slot-btn:hover,
        .mux-slot-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.03);
        }
        .controls .mux-slot-btn.hidden,
        .mux-slot-btn.hidden {
            display: none;
        }
        .episode-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(360px, 85vw);
            background: rgba(15, 15, 20, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.35s ease;
            display: flex;
            flex-direction: column;
        }
        .episode-panel.open {
            transform: translateX(0);
        }
        .episode-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .episode-panel-header button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .episode-list {
            list-style: none;
            margin: 0;
            padding: 8px 0;
            overflow-y: auto;
            flex: 1;
        }
        .episode-list li {
            padding: 16px 24px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s ease;
        }
        .episode-list li:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .episode-list li.current {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }
        .episode-list .marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        .episode-list li.current .marker {
            background: #ff5ac0;
            box-shadow: 0 0 12px #ff5ac0;
        }
    </style>
</head>
<body>
    <div class="stage">
        <mux-player
            id="player"
            playback-id="KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg"
            stream-type="on-demand"
            autoplay
            muted
            playsinline
            autohide="-1"
        ></mux-player>
    </div>
    <div class="controls">
        <button id="unmute-btn" type="button" aria-label="Activar sonido">🔇 Activar sonido</button>
        <button id="mux-next-btn" class="mux-slot-btn" type="button" aria-label="Siguiente episodio">Siguiente ⏭</button>
        <button id="mux-list-btn" class="mux-slot-btn" type="button" aria-label="Ver lista de episodios">📋 Episodios</button>
    </div>

    <aside id="episode-panel" class="episode-panel" aria-hidden="true">
        <div class="episode-panel-header">
            <span>Episodios</span>
            <button id="close-panel" type="button" aria-label="Cerrar">✕</button>
        </div>
        <ul id="episode-list" class="episode-list"></ul>
    </aside>
    <script>
        const player = document.getElementById('player');
        const unmuteBtn = document.getElementById('unmute-btn');
        const nextBtn = document.getElementById('mux-next-btn');
        const listBtn = document.getElementById('mux-list-btn');
        const closeBtn = document.getElementById('close-panel');
        const panel = document.getElementById('episode-panel');
        const listEl = document.getElementById('episode-list');

        const EPISODES = [
            { id: 'KMqFFjIjC4R7FafgSiwFb8oRnDDwkyzq7YDgcMsp9zg', title: 'Episodio 1' },
            { id: 'm400b5KKa9zFXdB7pzc00X6U5mekfteej8WHQbI6UR102g', title: 'Episodio 2' },
            { id: '7aA401UGod4t2zsaIWxH3KEwjMKcO1EuJF1gMvks9C4E', title: 'Episodio 3' },
            { id: '9orOWaGSufTUXAV02t1i3RVFlz41NHeZDMEUZQSUA202E', title: 'Episodio 4' },
            { id: 'VdEEcI601TJyUEz535TNYWDpWDU3I02xjdXWbW6Pozt7Y', title: 'Episodio 5' },
            { id: '2pvsoB4YE81IJwB3miI9hD7p02VAInuLagXPx01S2f02ao', title: 'Episodio 6', poster: 496 }
        ];
        let currentIndex = 0;

        function renderEpisodeList() {
            listEl.innerHTML = '';
            EPISODES.forEach((ep, idx) => {
                const li = document.createElement('li');
                li.className = idx === currentIndex ? 'current' : '';
                li.innerHTML = `<span class="marker"></span><span>${ep.title}</span>`;
                li.addEventListener('click', () => {
                    playEpisode(idx, { keepSound: !player.muted });
                    closePanel();
                });
                listEl.appendChild(li);
            });
        }

        function updateNextButton() {
            if (currentIndex >= EPISODES.length - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        function playEpisode(index, { keepSound = false } = {}) {
            if (index < 0 || index >= EPISODES.length) return;
            currentIndex = index;
            player.setAttribute('playback-id', EPISODES[index].id);
            updateNextButton();
            renderEpisodeList();
            try {
                if (!keepSound) player.muted = false;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
        }

        function goNext() {
            playEpisode(currentIndex + 1, { keepSound: !player.muted });
        }

        function activateSound() {
            try {
                player.muted = false;
                player.volume = 1;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            unmuteBtn.classList.add('hidden');
        }

        function openPanel() {
            panel.classList.add('open');
            panel.setAttribute('aria-hidden', 'false');
        }
        function closePanel() {
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden', 'true');
        }
        function togglePanel() {
            if (panel.classList.contains('open')) closePanel();
            else openPanel();
        }

        player.addEventListener('volumechange', () => {
            if (!player.muted) unmuteBtn.classList.add('hidden');
        });

        player.addEventListener('ended', () => {
            if (currentIndex < EPISODES.length - 1) goNext();
        });

        unmuteBtn.addEventListener('click', activateSound);
        unmuteBtn.addEventListener('touchstart', activateSound, { passive: true });
        nextBtn.addEventListener('click', goNext);
        listBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);

        function disableAutohide() {
            try {
                const mc = player.shadowRoot && player.shadowRoot.querySelector('media-controller');
                if (mc) mc.setAttribute('autohide', '-1');
            } catch (e) {}
        }
        if (customElements && customElements.whenDefined) {
            customElements.whenDefined('mux-player').then(disableAutohide);
        }
        disableAutohide();

        renderEpisodeList();
        updateNextButton();
    </script>
</body>
</html>
