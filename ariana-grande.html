<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariana Grande — Ariana Rising Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #0c0813;
            background-image: url('/ariana-grande/ariana-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        /* Capa oscura superpuesta para que resalte más el video y el logo sobre el fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 0;
        }
        .stage {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        mux-player {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            --media-background-color: transparent;
            --controls: none;
        }
        
        /* Logo centrado en pantalla, encima del player pero que deje pasar los clicks */
        .logo-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Permite clicks a través del logo */
            z-index: 2;
        }
        .logo-container img {
            max-width: 80%;
            max-height: 40%;
            object-fit: contain;
            filter: drop-shadow(0 2px 20px rgba(0, 0, 0, 0.7));
            opacity: 0.9;
        }

        #unmute {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 120, 220, 0.45), rgba(80, 0, 180, 0.65));
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }
        #unmute:hover {
            transform: scale(1.15);
        }
        #unmute:active {
            transform: scale(0.95);
        }
        #unmute.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }
        #unmute svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Responsive optimization */
        @media (max-width: 768px) {
            .logo-container img {
                max-width: 90%;
                max-height: 30%;
            }
            #unmute {
                top: 16px;
                right: 16px;
                width: 48px;
                height: 48px;
            }
            #unmute svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <mux-player
            id="player"
            playback-id="O8w7gIrfoTR2kj4RAv8NdGsuFkn19QNDej9FSDtO00q4"
            stream-type="on-demand"
            start-time="20"
            autoplay
            muted
            playsinline
        ></mux-player>
    </div>

    <div class="logo-container">
        <img src="/ariana-grande/eternal sunshine tour logo.png" alt="Eternal Sunshine Tour">
    </div>

    <!-- Botón sutil de parlante flotante para activar el sonido -->
    <div id="unmute" title="Activar audio">
        <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4zm4.5 8c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z"/>
        </svg>
    </div>
    <script>
        const player = document.getElementById('player');
        const overlay = document.getElementById('unmute');

        function activate() {
            try {
                player.muted = false;
                player.volume = 1;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {}
            overlay.classList.add('hidden');
        }

        // Bucle manual para reiniciar desde el segundo 20
        player.addEventListener('ended', () => {
            try {
                player.currentTime = 20;
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch(() => {});
            } catch (e) {
                console.error("Error al reiniciar la reproducción:", e);
            }
        });

        overlay.addEventListener('click', activate);
        overlay.addEventListener('touchstart', activate, { passive: true });
    </script>
</body>
</html>
