<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <title>404 | TOXI Media</title>
  <style>
    @font-face {
      font-family: "Helvetica Now";
      src: url("/HelveticaNowDisplay-Light.otf") format("opentype");
      font-weight: 300;
    }

    @font-face {
      font-family: "Helvetica Now";
      src: url("/HelveticaNowDisplay-Bold.otf") format("opentype");
      font-weight: 700;
    }

    :root {
      color-scheme: dark;
      --paper: #f3f0e9;
      --ink: #080808;
      --red: #e21d38;
      --muted: rgba(243, 240, 233, 0.62);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "Helvetica Now", Helvetica, Arial, sans-serif;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      padding: 32px;
      isolation: isolate;
    }

    main::before,
    main::after {
      position: absolute;
      z-index: -1;
      content: "";
      border: 1px solid rgba(243, 240, 233, 0.12);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    main::before {
      width: min(70vw, 720px);
      height: min(70vw, 720px);
      right: -18vw;
      top: -24vw;
    }

    main::after {
      width: min(45vw, 460px);
      height: min(45vw, 460px);
      left: -18vw;
      bottom: -18vw;
      border-color: rgba(226, 29, 56, 0.55);
    }

    .panel {
      width: min(100%, 860px);
      padding: clamp(28px, 7vw, 76px);
      border-top: 3px solid var(--red);
      background: #111;
      box-shadow: 18px 18px 0 rgba(226, 29, 56, 0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--paper);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand img { width: 104px; height: auto; }

    .code {
      margin: clamp(54px, 10vw, 104px) 0 10px;
      color: var(--red);
      font-size: clamp(5rem, 17vw, 11rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 0.78;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      text-transform: uppercase;
    }

    p {
      max-width: 520px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 300;
      line-height: 1.5;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 38px;
    }

    nav a {
      padding: 12px 15px;
      border: 1px solid rgba(243, 240, 233, 0.22);
      color: var(--paper);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
      outline: none;
    }

    @media (max-width: 520px) {
      main { padding: 16px; }
      .panel { box-shadow: 8px 8px 0 rgba(226, 29, 56, 0.12); }
      nav a { flex: 1 1 calc(50% - 10px); text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="error-title">
      <a class="brand" href="/" aria-label="Volver a TOXI Media">
        <img src="/toxi-logo-white.png" alt="TOXI Media" />
      </a>
      <div class="code" aria-hidden="true">404</div>
      <h1 id="error-title">Esta ruta no existe.</h1>
      <p>El contenido que buscás no está acá. Podemos llevarte de vuelta a alguna de las señales de TOXI.</p>
      <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/university">University</a>
        <a href="/tv">TV</a>
        <a href="/radio">Radio</a>
        <a href="/wiki">Wiki</a>
        <a href="/trabajos">Trabajos</a>
      </nav>
    </section>
  </main>
</body>
</html>
