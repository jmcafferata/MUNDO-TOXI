<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>TOXI TV</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background: #000; }
        cast-media-player {
            --theme-hue: 0;
            --splash-image: url('https://toxi.tv/toxi-logo-white.png');
            --splash-size: 120px;
            --background-image: none;
        }
        #dbg {
            position: fixed; top: 20px; left: 20px; right: 20px;
            color: #fff; font: bold 20px monospace;
            background: rgba(0,0,0,0.8); padding: 20px;
            z-index: 9999; word-break: break-all;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <div id="dbg">Receiver v4 iniciado...</div>
    <script>
        const dbg = document.getElementById('dbg');
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // Parche rápido para evitar crashing de Media3 en Android: 
        // Solo modificamos contentUrl y dejamos el contentId intacto.
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            request => {
                const media = request.media;
                if (!media) return request;

                const url = (media.contentUrl || media.contentId || '').replace('.mpd', '.m3u8');
                
                // Conservamos el contentId original para que Media3 no crashee
                media.contentUrl = url;
                media.contentType = 'application/x-mpegurl';
                media.streamType = cast.framework.messages.StreamType.BUFFERED;
                media.hlsSegmentFormat = cast.framework.messages.HlsSegmentFormat.FMP4; // Mux usa fmp4

                dbg.textContent = `? LOAD\nURL: ${url}\nOff: ${request.currentTime}s`;
                return request;
            }
        );

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, e => {
            dbg.style.display = '';
            dbg.textContent = 'ERR=' + e.detailedErrorCode + '\n' + JSON.stringify(e.error);
        });

        playerManager.addEventListener(cast.framework.events.EventType.PLAYING, () => { 
            setTimeout(() => { dbg.style.display = 'none'; }, 2000); 
        });

        context.start({
            supportedCommands: cast.framework.messages.Command.ALL_BASIC_MEDIA
        });
    </script>
</body>
</html>
